name: Diagnose ServGo Gmail spam infrastructure (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/servgo-mail-deliverability-dns.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve live SMTP reverse DNS and forward confirmation
        run: |
          python - <<'PY'
          import socket
          ip='155.212.162.47'
          try:
              name=socket.gethostbyaddr(ip)[0]
              addrs={x[4][0] for x in socket.getaddrinfo(name,None,family=socket.AF_INET)}
              print('smtp_ptr_hostname='+name)
              print('smtp_ptr_forward_confirmed='+str(ip in addrs).lower())
          except Exception as exc:
              print('smtp_ptr_lookup_error='+type(exc).__name__)
          for name in ('mail.servgo.ru','servgo.ru'):
              try:
                  addrs={x[4][0] for x in socket.getaddrinfo(name,None,family=socket.AF_INET)}
                  print(name.replace('.','_')+'_matches_mail_ip='+str(ip in addrs).lower())
              except Exception as exc:
                  print(name.replace('.','_')+'_lookup_error='+type(exc).__name__)
          PY
      - name: Inspect live Postfix identity without credentials or configuration secrets
        run: |
          python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
          python - <<'PY'
          import os
          from scripts.deploy_business_creation_and_reminders import connect,run
          client=connect(os.environ['SERVGO_PASSWORD'])
          try:
              for key in ('myhostname','myorigin','smtp_helo_name'):
                  value=run(client,'postconf -h '+key+' || true')
                  if value and len(value)<180:
                      print('postfix_'+key+'='+value)
          finally: client.close()
          PY
