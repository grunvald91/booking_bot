name: Finalize ServGo mail server

on:
  push:
    branches: [ops/mail-server-finalize-20261006]

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Finalize services and smoke test
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time, paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=paramiko.SSHClient(); ssh.set_missing_host_key_policy(Pinned())
          ssh.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                      look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
          cmd=r'''set -Eeuo pipefail
          postfix check
          postfix stop || true
          sleep 1
          postfix start
          systemctl restart dovecot opendkim fail2ban
          sleep 2

          test "$(systemctl is-active dovecot)" = active
          test "$(systemctl is-active opendkim)" = active
          test "$(systemctl is-active fail2ban)" = active

          ss -lnt | grep -Eq '0\.0\.0\.0:25[[:space:]]'
          ss -lnt | grep -Eq '0\.0\.0\.0:587[[:space:]]'
          ss -lnt | grep -Eq '0\.0\.0\.0:993[[:space:]]'

          PASS="$(awk -F': ' '/^Password:/{print $2}' /root/servgo-mail-credentials.txt)"
          doveadm auth test support@servgo.ru "$PASS" >/tmp/servgo-doveauth.txt 2>&1
          grep -qi 'auth succeeded' /tmp/servgo-doveauth.txt

          BEFORE="$(find /var/mail/vhosts/servgo.ru/support/Maildir/new -type f | wc -l)"
          printf 'Subject: ServGo final mail smoke\nFrom: noreply@servgo.ru\nTo: support@servgo.ru\n\nFinal smoke test.\n' |
            /usr/sbin/sendmail -f noreply@servgo.ru support@servgo.ru
          sleep 2
          AFTER="$(find /var/mail/vhosts/servgo.ru/support/Maildir/new -type f | wc -l)"
          test "$AFTER" -gt "$BEFORE"

          python3 - <<'DNS'
          from pathlib import Path
          import re
          raw=Path('/etc/opendkim/keys/servgo.ru/servgo.txt').read_text()
          parts=re.findall(r'"([^"]*)"', raw)
          print('DKIM_TXT=' + ''.join(parts))
          DNS

          echo 'MX=10 mail.servgo.ru.'
          echo 'SPF=v=spf1 ip4:155.212.162.47 -all'
          echo 'DMARC=v=DMARC1; p=none; rua=mailto:dmarc@servgo.ru; adkim=s; aspf=s; pct=100'
          echo 'PTR_REQUIRED=mail.servgo.ru'
          echo "MAILDIR_MESSAGES=$AFTER"
          echo 'MAIL_SETUP=success'
          ss -lntp | egrep ':(25|587|993)\b'
          systemctl start unattended-upgrades.service >/dev/null 2>&1 || true
          '''
          _,out,err=ssh.exec_command(cmd,timeout=120)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print(stderr[-3000:])
              raise SystemExit(status)
          ssh.close()
          PY

      - name: Check public mail ports
        shell: bash
        run: |
          python - <<'PY'
          import socket
          host='mail.servgo.ru'
          for port in (25,587,993):
              s=socket.create_connection((host,port),timeout=8)
              s.close()
              print(f'public_port_{port}=ok')
          PY
