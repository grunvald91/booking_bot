name: Apply bookings overlap migration (approved 2026-10-20)
on:
  push:
    branches: [ops/db-overlap-migration-20261020]
    paths: ['.github/ops/apply_overlap_migration.py', '.github/workflows/ops-db-overlap-migration-20261020.yml']
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q --disable-pip-version-check 'paramiko==3.5.1'
      - run: python .github/ops/apply_overlap_migration.py
