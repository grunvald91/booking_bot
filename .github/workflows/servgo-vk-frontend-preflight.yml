name: VK ID frontend release readiness (read-only)
on:
  push:
    branches: [ops/vk-id-guarded-release-20261107]
    paths:
      - '.github/workflows/servgo-vk-frontend-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install and build production PWA
        run: |
          set -euo pipefail
          cd web/frontend
          npm ci --legacy-peer-deps
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH client
        run: python -m pip install -q 'paramiko==3.5.1'
      - name: Read-only deployment gate; no site changes
        run: python scripts/deploy_servgo_frontend_atomic.py
