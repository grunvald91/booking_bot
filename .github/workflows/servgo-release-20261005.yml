name: ServGo rental prerequisite check

on:
  push:
    branches:
      - ops/servgo-release-20261005

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH client library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Check production rental prerequisites
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          command=r'''set -e
          cd /opt/booking_bot
          echo '--- runtime modules ---'
          ./venv/bin/python - <<'MOD_PY'
          for name in ('httpx','pywebpush'):
              try:
                  mod=__import__(name)
                  print(name+'=present version='+str(getattr(mod,'__version__','unknown')))
              except Exception as e:
                  print(name+'=missing type='+type(e).__name__)
          MOD_PY
          echo '--- rental files ---'
          for f in web/api/rental.py web/api/rental_logic.py; do
            if [ -f "$f" ]; then echo "$f=present"; else echo "$f=missing"; fi
          done
          echo '--- env state ---'
          python3 - <<'ENV_PY'
          from pathlib import Path
          p=Path('.env')
          keys={'VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','VAPID_SUBJECT','SERVGO_TIMEZONE'}
          found={}
          if p.exists():
              for line in p.read_text(errors='replace').splitlines():
                  if '=' in line and not line.lstrip().startswith('#'):
                      k,v=line.split('=',1)
                      if k.strip() in keys: found[k.strip()]='set' if v.strip() else 'empty'
          for k in sorted(keys): print(k+'='+found.get(k,'absent'))
          ENV_PY
          echo '--- db fields ---'
          ./venv/bin/python - <<'DB_PY'
          import asyncio
          from sqlalchemy import text
          from database.database import async_session_maker
          async def run():
              checks={
                'businesses':['working_hours_start','working_hours_end','booking_labels','booking_flow_order'],
                'employees':['solo_price_per_hour','primary_photo'],
                'bookings':['duration_minutes','estimated_price','price_requires_confirmation','prepayment_amount','notify_token'],
              }
              async with async_session_maker() as s:
                  for table,cols in checks.items():
                      rows=set((await s.execute(text("select column_name from information_schema.columns where table_name=:t"),{'t':table})).scalars().all())
                      for col in cols: print(f'{table}.{col}='+str(col in rows).lower())
                  q=text("select exists(select 1 from information_schema.tables where table_name='push_subscriptions')")
                  print('push_subscriptions='+str(bool((await s.execute(q)).scalar())).lower())
          asyncio.run(run())
          DB_PY
          printf 'api_health='; curl -sS --max-time 5 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/health
          printf 'bot='; systemctl is-active booking-bot.service
          '''
          _,out,err=ssh.exec_command(command,timeout=45)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print(stderr[-1000:])
              raise SystemExit(status)
          ssh.close()
          PY
