name: ServGo production drift provenance

on:
  push:
    branches:
      - ops/servgo-release-20261005

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SSH client library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Identify production source provenance
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, subprocess, tempfile, time
          import paramiko

          HOST='155.212.162.47'; ROOT='/opt/booking_bot'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          PATHS=['database/models.py','requirements.txt','web/api/database.py','web/api/main.py','web/api/routes/admin.py','web/api/schemas.py']

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  actual=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if actual!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)

          ssh=None
          for attempt in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2: raise
                  time.sleep(3)
          sftp=ssh.open_sftp()
          try:
              for path in PATHS:
                  with sftp.open(ROOT+'/'+path,'rb') as rf: data=rf.read()
                  blob=subprocess.check_output(['git','hash-object','--stdin'],input=data).decode().strip()
                  hits=subprocess.run(['git','log','--all','--format=%H|%cs|%s','--find-object='+blob,'--',path],
                                      capture_output=True,text=True).stdout.strip().splitlines()
                  print(path)
                  print('  production_blob='+blob)
                  if hits:
                      print('  historical_match=yes')
                      for h in hits[:4]: print('  commit='+h)
                  else:
                      print('  historical_match=no')
                  current=subprocess.check_output(['git','hash-object',path]).decode().strip()
                  print('  current_blob='+current)
          finally:
              sftp.close(); ssh.close()
          PY
