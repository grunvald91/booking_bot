name: ServGo post-rollback health check

on:
  push:
    branches:
      - ops/servgo-release-20261005

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH client library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Check production services
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko
          HOST='155.212.162.47'; FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set +e
          echo '--- status ---'
          systemctl is-active booking-web-api.service
          systemctl is-active booking-bot.service
          systemctl is-active nginx.service
          printf 'local_api='; curl -sS --max-time 5 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/health
          printf 'public_api='; curl -sS --max-time 8 -o /dev/null -w '%{http_code}\n' https://servgo.ru/api/health
          echo '--- release env presence ---'
          cd /opt/booking_bot
          python3 - <<'ENV_PY'
          from pathlib import Path
          p=Path('.env')
          vals={}
          if p.exists():
              for line in p.read_text(errors='replace').splitlines():
                  if '=' in line and not line.lstrip().startswith('#'):
                      k,v=line.split('=',1)
                      if k.strip() in {'VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','VAPID_SUBJECT','SERVGO_TIMEZONE'}:
                          vals[k.strip()]='set' if v.strip() else 'empty'
          for k in ('VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','VAPID_SUBJECT','SERVGO_TIMEZONE'):
              print(k+'='+vals.get(k,'absent'))
          ENV_PY
          echo '--- current code marker ---'
          test -f web/api/rental.py && echo rental_file=present || echo rental_file=missing
          test -f web/api/routes/notifications.py && echo notifications_file=present || echo notifications_file=missing
          echo '--- api logs ---'
          journalctl -u booking-web-api.service -n 35 --no-pager | sed -E 's/(password|token|secret|key)=([^ ]+)/\1=[REDACTED]/Ig'
          '''
          _,out,err=ssh.exec_command(cmd,timeout=45)
          print(out.read().decode('utf-8','replace'))
          e=err.read().decode('utf-8','replace')
          if e: print('stderr_suffix='+e[-800:])
          ssh.close()
          PY
