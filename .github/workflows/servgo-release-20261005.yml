name: ServGo production drift review

on:
  push:
    branches:
      - ops/servgo-release-20261005

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH client library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Show sanitized production drift
        shell: bash
        run: |
          python - <<'PY'
          import base64, difflib, hashlib, os, pathlib, re, subprocess, time
          import paramiko

          HOST='155.212.162.47'
          ROOT='/opt/booking_bot'
          BASE_SHA='439b5e9dddfe76dc73e355404ee78b9f06a4318c'
          EXPECTED_FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          PATHS=[
              'database/models.py',
              'requirements.txt',
              'web/api/database.py',
              'web/api/main.py',
              'web/api/routes/admin.py',
              'web/api/schemas.py',
          ]
          secret_re=re.compile(r'(password|passwd|secret|token|api[_-]?key|private[_-]?key|credential)',re.I)

          def sanitize(line):
              raw=line.rstrip('\n')
              if secret_re.search(raw) and ('=' in raw or ':' in raw):
                  prefix=raw[:1] if raw[:1] in '+- ' else ''
                  indent=re.match(r'^\s*',raw[len(prefix):]).group(0)
                  return prefix+indent+'[REDACTED]\n'
              return line

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,client,hostname,key):
                  actual=base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual!=EXPECTED_FP: raise paramiko.SSHException('Host key mismatch')
                  client.get_host_keys().add(hostname,key.get_name(),key)

          ssh=None
          for attempt in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c;break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2: raise
                  time.sleep(3)

          sftp=ssh.open_sftp()
          try:
              for path in PATHS:
                  print('\n===== '+path+' : BASE -> PRODUCTION =====')
                  try:
                      base=subprocess.check_output(['git','show',BASE_SHA+':'+path],stderr=subprocess.DEVNULL).decode('utf-8','replace').splitlines(True)
                  except subprocess.CalledProcessError:
                      base=[]
                  with sftp.open(ROOT+'/'+path,'rb') as f:
                      prod=f.read().decode('utf-8','replace').splitlines(True)
                  diff=list(difflib.unified_diff(base,prod,fromfile='base/'+path,tofile='production/'+path,n=4))
                  safe=[sanitize(x) for x in diff]
                  if len(safe)>500:
                      safe=safe[:500]+['... [DIFF TRUNCATED] ...\n']
                  print(''.join(safe) if safe else '(no diff from base)')

                  print('===== '+path+' : PRODUCTION -> CURRENT MAIN =====')
                  current=pathlib.Path(path).read_text(errors='replace').splitlines(True)
                  diff2=list(difflib.unified_diff(prod,current,fromfile='production/'+path,tofile='current/'+path,n=4))
                  safe2=[sanitize(x) for x in diff2]
                  if len(safe2)>500:
                      safe2=safe2[:500]+['... [DIFF TRUNCATED] ...\n']
                  print(''.join(safe2) if safe2 else '(already current)')
          finally:
              sftp.close();ssh.close()
          PY
