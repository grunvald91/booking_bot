name: Read-only promo 502 diagnosis
on:
  push:
    branches:
      - incident/promo-502-diagnostics-20261031
    paths:
      - '.github/workflows/promo-502-diagnostics.yml'
permissions:
  contents: read
concurrency:
  group: servgo-promo-diagnosis
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH client
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Inspect promo upstream and services (strictly read-only)
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from scripts.deploy_business_creation_and_reminders import connect

          if not os.environ.get("SERVGO_PASSWORD"):
              raise RuntimeError("SSH secret is missing")
          client = connect(os.environ["SERVGO_PASSWORD"])
          probes = {
              "clock": "date -u '+%Y-%m-%dT%H:%M:%SZ'",
              "nginx_syntax": "nginx -t 2>&1 | tail -n 4",
              "booking_service": "systemctl show booking-bot.service -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts -p ActiveEnterTimestamp -p FragmentPath --no-pager",
              "web_api_service": "systemctl show booking-web-api.service -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager",
              "listeners": "ss -ltn 2>/dev/null | grep -E ':(8080|8000) ' || true",
              "direct_8080_home": "curl -sS -o /dev/null -w 'HTTP %{http_code}' --max-time 5 http://127.0.0.1:8080/ 2>/dev/null || true",
              "direct_8080_beauty": "curl -sS -o /dev/null -w 'HTTP %{http_code}' --max-time 5 http://127.0.0.1:8080/beauty 2>/dev/null || true",
              "nginx_promo": "curl -ksS -o /dev/null -w 'HTTP %{http_code}' --max-time 7 --resolve promo.servgo.ru:443:127.0.0.1 https://promo.servgo.ru/ 2>/dev/null || true",
              "nginx_servgo": "curl -ksS -o /dev/null -w 'HTTP %{http_code}' --max-time 7 --resolve servgo.ru:443:127.0.0.1 https://servgo.ru/ 2>/dev/null || true",
              "routing": "nginx -T 2>/dev/null | grep -E '^\\s*(server_name|proxy_pass|listen) ' | grep -E 'promo|servgo|8080|8000' | head -n 25",
              "last_service_errors": "journalctl -u booking-bot.service -n 110 --no-pager -o cat 2>/dev/null | grep -Ei 'Traceback|error|exception|no module named|failed|exited|syntax' | tail -n 22 | cut -c1-200",
              "proxy_port": "ss -ltn 2>/dev/null | grep -E ':(1089|1080|1081|9050) ' || true",
              "proxy_unit_names": "systemctl list-unit-files --no-pager 2>/dev/null | grep -Ei 'proxy|sing-box|xray|v2ray|socks|clash|3proxy|dante|warp|wireguard|tor' | head -n 35 || true",
              "proxy_unit_runtime": "systemctl list-units --all --no-pager 2>/dev/null | grep -Ei 'proxy|sing-box|xray|v2ray|socks|clash|3proxy|dante|warp|wireguard|tor' | head -n 35 || true",
              "booking_unit_command": "systemctl show booking-bot.service -p ExecStart -p ExecStartPre -p Requires -p Wants -p After -p WorkingDirectory -p EnvironmentFiles --no-pager | sed -E 's/(PASSWORD|TOKEN|SECRET|KEY)=[^ ;]+/\\1=REDACTED/Ig' | cut -c1-350",
              "unit_details": "systemctl cat booking-bot.service 2>/dev/null | sed -E '/^(Environment|ExecStart|ExecStartPre|ExecStartPost|EnvironmentFile|PassEnvironment)=/s/=.*$/=REDACTED/' | head -n 80",
              "enabled_target_units": "systemctl list-units --type=service --state=running --no-pager --plain | awk 'NR>1{print $1}' | grep -Ei 'booking|growth|mail|smena|redis|postgres|proxy|relay|nginx|systemd-timesyncd|assistant|monitor|alert' | head -n 60",
              "existing_monitors": "systemctl list-timers --all --no-pager --plain | grep -Ei 'health|monitor|check|backup|cert|proxy|relay|watch' | head -n 28 || true",
              "promo_vhost_files": "nginx -T 2>/dev/null | awk '/^# configuration file /{f=$4} /server_name promo.servgo.ru;/{print f}' | sort -u",
              "promo_vhost_directives": "nginx -T 2>/dev/null | grep -B 18 -A 28 -E 'server_name promo[.]servgo[.]ru;' | grep -E 'server_name|proxy_pass|return |rewrite |location |listen |root |# configuration file' | head -n 70",
              "promo_route_checks": "for u in / /beauty /api/landing/connect-request /static/landing.js /robots.txt /blog; do printf '%s ' \"$u\"; curl -ksS -o /dev/null -w '%{http_code} %{content_type}\\n' --max-time 6 --resolve promo.servgo.ru:443:127.0.0.1 \"https://promo.servgo.ru$u\"; done",
              "monitor_relevant_env_keys": "for f in /opt/booking_bot/.env /opt/ai_growth_os/.env; do [ -r \"$f\" ] && { echo \"$f\"; grep -E '^[A-Za-z_][A-Za-z_0-9]*=' \"$f\" | sed -E 's/=.*$/=SET/' | grep -Ei 'BOT|ADMIN|MONITOR|ALERT|CHAT|NOTIFY|PROXY' | head -n 40; }; done",
              "monitor_scripts": "find /opt /etc/systemd/system -maxdepth 4 -type f \\( -iname '*monitor*' -o -iname '*health*' -o -iname '*alert*' -o -iname '*watch*' \\) 2>/dev/null | grep -E 'booking|servgo|growth|telegram|systemd' | head -n 40",
              "current_unit_states": "systemctl show booking-bot.service booking-bot-relay89.service nginx.service booking-web-api.service -p Id -p ActiveState -p NRestarts --no-pager | head -n 35",
              "proxy_recent_errors": "journalctl --no-pager --since '2026-10-31 16:00:00' -p err -n 65 -o cat 2>/dev/null | grep -Ei '1089|proxy|socks|sing-box|xray|v2ray|booking-bot' | tail -n 25 | cut -c1-180",
              "direct_telegram": "curl -sS -o /dev/null -w 'HTTP %{http_code}' --connect-timeout 4 --max-time 8 https://api.telegram.org/ 2>/dev/null || true",
              "nginx_upstream_errors": "tail -n 150 /var/log/nginx/error.log 2>/dev/null | grep -E 'upstream|connect\\(\\) failed|prematurely closed' | tail -n 10 | sed -E 's/client: [0-9a-fA-F:.]+/client: REDACTED/g' | cut -c1-230",
          }
          try:
              for title, cmd in probes.items():
                  print("\n## " + title, flush=True)
                  _, stdout, stderr = client.exec_command(cmd, timeout=16)
                  result = stdout.read().decode("utf-8", "replace")[:6500].strip()
                  code = stdout.channel.recv_exit_status()
                  print(result or "(empty)", flush=True)
                  print("exit_code=" + str(code), flush=True)
          finally:
              client.close()
          PY
