name: Mail outage diagnose (read-only)

# One-shot read-only diagnosis of the mail stack on server 155 after the
# 2026-10-16 report: mail.servgo.ru UI, outbound and inbound mail all failing.
# Changes nothing on the server. Prints no secrets or message bodies.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/mail-outage-diagnose-20261016.yml'

permissions:
  contents: read

concurrency:
  group: mail-outage-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Server-side state
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set +e
          sec(){ echo; echo "===== $1 ====="; }
          mask(){ sed -E 's/[A-Za-z0-9._%+-]+@([A-Za-z0-9.-]+)/***@\1/g; s/(ticket|token)=[^ &"]+/\1=***/g'; }
          sec RUN2_NGINX_SERVGO_MAIL_ROUTES
          f=$(grep -lE 'server_name[^;]*\bservgo\.ru' /etc/nginx/sites-enabled/* | head -3); echo "$f"
          for x in $f; do echo "--- $x"; grep -nE 'server_name|listen|location|proxy_pass|return|try_files|root ' "$x" | head -60; done
          sec RUN2_ACCESS_LOG_MAIL_ENTRY_TODAY
          for L in /var/log/nginx/access.log /var/log/nginx/*servgo*access*.log; do [ -f "$L" ] || continue; echo "--- $L"; grep -E 'owner-mail|"(GET|POST) /mail[ ?]|/claim' "$L" | grep -E '16/Oct/2026|17/Oct/2026' | awk '{print $1,$4,$6,$7,$9,$10}' | mask | tail -40; done
          sec RUN2_MAILHOST_ACCESS_TODAY
          grep -h 'mail.servgo.ru' /var/log/nginx/*.log 2>/dev/null | grep -E '16/Oct/2026|17/Oct/2026' | awk '{print $1,$4,$6,$7,$9}' | mask | tail -30
          grep -l . /var/log/nginx/*.log 2>/dev/null | head -20
          sec RUN2_DIST_MAIL_ENTRY
          D=/opt/booking_bot/web/frontend/dist; ls -l --time-style=+%F_%T $D/index.html; ls -l --time-style=+%F_%T $D/assets/*.js 2>/dev/null | tail -5
          grep -l 'owner-mail/entry' $D/assets/*.js 2>/dev/null | while read j; do echo "--- $j"; grep -oE '.{160}owner-mail/entry.{200}' "$j" | head -3; done
          grep -c 'MailEntryPage\|Открываем почту' $D/assets/*.js 2>/dev/null | grep -v ':0'
          ls -ld --time-style=+%F_%T $D.bak_20261016 2>&1
          sec RUN2_OWNER_MAIL_ROUTES
          grep -nE '@router\.(get|post|put|delete)|^router *=|prefix' /opt/booking_bot/web/api/routes/owner_mail.py | head -40
          grep -rnE 'owner_mail|mail_campaign' /opt/booking_bot/web/api/main.py /opt/booking_bot/web/api/app.py 2>/dev/null | head
          sec RUN2_POSTFIX_GOOGLE_TODAY
          journalctl -u 'postfix*' --since '2026-10-16 00:00' --no-pager -o short-iso 2>/dev/null | grep -Ei 'google|gmail' | mask | tail -40
          echo '--- delivered/sent today'
          journalctl -u 'postfix*' --since '2026-10-16 00:00' --no-pager -o short-iso 2>/dev/null | grep -E 'status=(sent|deferred|bounced)|lmtp.*status' | mask | tail -40
          echo '--- grep mail.log for google today'
          grep -hEi 'google|gmail' /var/log/mail.log /var/log/mail.log.1 2>/dev/null | grep -E '^(Oct 1[56]|2026-10-1[56])' | mask | tail -40
          sec RUN2_MAILDIR_RECENT_HEADERS
          for m in $(ls -t /var/mail/vhosts/servgo.ru/support/Maildir/new/ 2>/dev/null | head -4); do f=/var/mail/vhosts/servgo.ru/support/Maildir/new/$m; stat -c '%y' "$f"; grep -m3 -iE '^(From|Date|Subject):' "$f" | mask; done
          sec RUN2_CAMPAIGN_STORE
          ls -la --time-style=+%F_%T /var/lib/servgo-owner-mail
          for db in /var/lib/servgo-owner-mail/*.db /var/lib/servgo-owner-mail/*.sqlite*; do [ -f "$db" ] || continue; echo "--- $db"; python3 - "$db" <<'SQ'
          import sqlite3,sys
          c=sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True)
          for (t,) in c.execute("select name from sqlite_master where type='table'"):
              cols=[r[1] for r in c.execute(f'pragma table_info({t})')]
              n=c.execute(f'select count(*) from {t}').fetchone()[0]
              line=f'{t}: rows={n}'
              if 'status' in cols:
                  line+=' '+str(c.execute(f'select status,count(*) from {t} group by status').fetchall())
              print(line)
          SQ
          done
          sec RUN2_WORKER
          systemctl status servgo-mail-worker --no-pager 2>&1 | head -8
          journalctl -u servgo-mail-worker --since '-3 days' --no-pager -o short-iso 2>/dev/null | mask | tail -30
          sec RUN2_WEBAPI_TODAY_ERRORS
          journalctl -u booking-web-api --since '2026-10-16 00:00' --no-pager -o short-iso 2>/dev/null | grep -E 'owner-mail| 5[0-9][0-9] |Traceback|Error|Exception' | grep -vE ' 200 OK' | mask | tail -40
          sec RUN2_MAIL_SESSION_CHECK
          grep -nE 'max_age|COOKIE|cookie_name|SESSION_HOURS|samesite|domain=' /opt/booking_bot/web/api/routes/owner_mail.py | head -20
          '''
          _,o,e=s.exec_command(cmd,timeout=120)
          print(o.read().decode('utf-8','replace'))
          err=e.read().decode('utf-8','replace')
          if err.strip(): print('--- stderr ---'); print(err[-2500:])
          s.close()
          PY
      - name: Public reachability from runner
        shell: bash
        run: |
          python - <<'PY'
          import socket,ssl,smtplib,urllib.request
          for port in (25,587,993,443):
              try:
                  socket.create_connection(('mail.servgo.ru',port),timeout=8).close(); print(f'public {port}=ok')
              except Exception as e: print(f'public {port}=FAIL {type(e).__name__}: {e}')
          try:
              s=smtplib.SMTP('mail.servgo.ru',25,timeout=10); print('smtp25 banner/ehlo', s.ehlo()[0]); s.quit()
          except Exception as e: print('smtp25 FAIL', type(e).__name__, e)
          for u in ('https://mail.servgo.ru/','https://servgo.ru/mail'):
              try:
                  r=urllib.request.urlopen(u,timeout=10); print(u, r.status)
              except Exception as e: print(u, 'FAIL', type(e).__name__, getattr(e,'code',''), e)
          PY
