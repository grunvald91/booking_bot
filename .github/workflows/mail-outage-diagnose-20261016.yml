name: Mail outage diagnose (read-only)

# One-shot read-only diagnosis of the mail stack on server 155 after the
# 2026-10-16 report: mail.servgo.ru UI, outbound and inbound mail all failing.
# Changes nothing on the server. Prints no secrets or message bodies.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/mail-outage-diagnose-20261016.yml'

permissions:
  contents: read

concurrency:
  group: mail-outage-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Server-side state
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set +e
          sec(){ echo; echo "===== $1 ====="; }
          mask(){ sed -E 's/[A-Za-z0-9._%+-]+@([A-Za-z0-9.-]+)/***@\1/g; s/\+?[0-9]{10,}/<num>/g'; }
          sec R8_RELAY_UNITS
          for u in booking-bot-relay89 booking-bot; do printf '%s=%s since %s\n' $u "$(systemctl is-active $u)" "$(systemctl show -p ActiveEnterTimestamp --value $u)"; done
          systemctl cat booking-bot-relay89 2>/dev/null | grep -E '^(ExecStart|Restart)' | sed -E 's/-i [^ ]+/-i <key>/'
          journalctl -u booking-bot-relay89 --since '-3 days' --no-pager -o short-iso | tail -15
          ss -lntp | grep -E 'ssh' | head
          sec R8_RELAY_HOST_REACH
          timeout 6 bash -c '</dev/tcp/89.125.90.101/22' && echo 'tcp 89.125.90.101:22 ok' || echo 'tcp 89.125.90.101:22 FAIL'
          ping -c 2 -W 2 89.125.90.101 2>&1 | tail -2
          for port in $(ss -lntp | grep -E '"ssh"' | grep -oE '127\.0\.0\.1:[0-9]+' | cut -d: -f2 | sort -u); do
            printf 'socks %s -> telegram widget: ' $port; curl -s -o /dev/null -m 10 -w '%{http_code}\n' --socks5-hostname 127.0.0.1:$port https://telegram.org/js/telegram-widget.js?22
            printf 'socks %s -> oauth.telegram.org: ' $port; curl -s -o /dev/null -m 10 -w '%{http_code}\n' --socks5-hostname 127.0.0.1:$port https://oauth.telegram.org/
          done
          sec R8_NGINX_TELEGRAM_PROXY
          grep -RnE 'telegram|socks|tg-widget|tgwidget' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -20
          ls -la --time-style=+%F_%T /etc/nginx/sites-enabled/ | tail -15
          sec R8_WIDGET_SRC_IN_BUNDLES
          for j in /opt/booking_bot/web/frontend/dist/assets/index-*.js /opt/booking_bot/web/frontend/dist.bak_20261016/assets/index-*.js; do
            printf '%s %s: ' "$(stat -c %y "$j" | cut -c1-16)" "$j"; grep -oE 'a\.src=`[^`]*`|src=`https://[^`]*telegram[^`]*`|"https://[^"]*telegram-widget[^"]*"|[a-z0-9/._-]*telegram-widget[^`"]*' "$j" | sort -u | head -3 | tr '\n' ' '; echo; done
          grep -oE 'index-[A-Za-z0-9_-]+\.js' /opt/booking_bot/web/frontend/dist/index.html /opt/booking_bot/web/frontend/dist.bak_20261016/index.html
          ls -la --time-style=+%F_%T /opt/servgo-releases/20261016/mail-entry/ 2>/dev/null | head
          find / -xdev -name 'telegram-widget*.js' -not -path '*/node_modules/*' 2>/dev/null | head
          sec R8_MAILBOX_UI_FETCHES
          grep -oE "fetch\([^)]{0,80}\)|'/api/[a-z/_-]+'|\"/api/[a-z/_-]+\"|Подключение к почтовому сервису[^<]{0,40}" /opt/booking_bot/web/api/routes/owner_mail_ui.html | sort | uniq -c | head -25
          sec R8_MAILBOX_API_LOG_TODAY
          journalctl -u booking-web-api --since '2026-10-17 06:00' --no-pager -o short-iso | grep -E 'owner-mail' | grep -vE 'GET /owner-mail/app' | mask | tail -30
          journalctl -u booking-web-api --since '2026-10-17 06:00' --no-pager -o short-iso | grep -iE 'imap|Traceback|Error' | mask | tail -15
          sec R8_DOVECOT_AUTH_TODAY
          journalctl -u dovecot --since '2026-10-17 00:00' --no-pager -o short-iso | grep -E 'Login|auth failed|Aborted login|imap\(' | mask | tail -15
          sec R8_IMAP_ENV_KEYS
          P=$(systemctl show -p MainPID --value booking-web-api); tr '\0' '\n' </proc/$P/environ | grep -E '^SERVGO_MAIL_IMAP_(USER|PASSWORD)=' | sed -E 's/=.+/=<set>/; s/=$/=<EMPTY>/'
          sec R8_END
          '''
          _,o,e=s.exec_command(cmd,timeout=120)
          print(o.read().decode('utf-8','replace'))
          err=e.read().decode('utf-8','replace')
          if err.strip(): print('--- stderr ---'); print(err[-2500:])
          s.close()
          PY
      - name: Public reachability from runner
        shell: bash
        run: |
          python - <<'PY'
          import socket,ssl,smtplib,urllib.request
          for port in (25,587,993,443):
              try:
                  socket.create_connection(('mail.servgo.ru',port),timeout=8).close(); print(f'public {port}=ok')
              except Exception as e: print(f'public {port}=FAIL {type(e).__name__}: {e}')
          try:
              s=smtplib.SMTP('mail.servgo.ru',25,timeout=10); print('smtp25 banner/ehlo', s.ehlo()[0]); s.quit()
          except Exception as e: print('smtp25 FAIL', type(e).__name__, e)
          for u in ('https://mail.servgo.ru/','https://servgo.ru/mail'):
              try:
                  r=urllib.request.urlopen(u,timeout=10); print(u, r.status)
              except Exception as e: print(u, 'FAIL', type(e).__name__, getattr(e,'code',''), e)
          PY
