name: Mail outage diagnose (read-only)

# One-shot read-only diagnosis of the mail stack on server 155 after the
# 2026-10-16 report: mail.servgo.ru UI, outbound and inbound mail all failing.
# Changes nothing on the server. Prints no secrets or message bodies.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/mail-outage-diagnose-20261016.yml'

permissions:
  contents: read

concurrency:
  group: mail-outage-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Server-side state
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set +e
          sec(){ echo; echo "== $1"; }
          sec MEM155; free -m; cat /proc/pressure/memory 2>/dev/null
          sec SERVICES_BY_MEM_PLUS_SWAP
          for d in /sys/fs/cgroup/system.slice/*.service /sys/fs/cgroup/system.slice/docker-*.scope; do
            [ -f "$d/memory.current" ] || continue
            m=$(cat $d/memory.current); sw=$(cat $d/memory.swap.current 2>/dev/null || echo 0)
            echo "$(( (m+sw)/1048576 )) MB  ram=$((m/1048576)) swap=$((sw/1048576))  $(basename $d)"
          done | sort -rn | head -30
          sec USER_SLICE; for d in /sys/fs/cgroup/user.slice /sys/fs/cgroup/init.scope; do echo "$(( $(cat $d/memory.current)/1048576 ))MB $d"; done
          sec PROCESSES_RSS_SWAP
          for p in /proc/[0-9]*; do n=$(tr '\0' ' ' < $p/cmdline 2>/dev/null | cut -c1-110); r=$(awk '/VmRSS/{print $2}' $p/status 2>/dev/null); w=$(awk '/VmSwap/{print $2}' $p/status 2>/dev/null); [ -n "$r" ] && echo "$(( (r+${w:-0})/1024 )) MB rss=$((r/1024)) swap=$((${w:-0}/1024)) pid=$(basename $p) $n"; done | sort -rn | head -30 | sed -E 's/(token|password|secret|key)=[^ ]+/\1=***/Ig'
          sec DOCKER_STATS; docker stats --no-stream --format "{{.Name}} {{.MemUsage}} {{.CPUPerc}}" 2>/dev/null
          sec DOCKER_PS; docker ps --format "{{.Names}} | {{.Image}} | {{.Status}}" 2>/dev/null
          sec ENABLED_APP_SERVICES; systemctl list-units --type=service --state=running --no-legend --plain | awk '{print $1}' | grep -vE '^(systemd|dbus|cron|ssh|rsyslog|polkit|udisks|ModemManager|multipathd|networkd|getty|serial|user@|unattended|snapd|packagekit|irqbalance|qemu|chrony|atd|fwupd)' | tr '\n' ' '
          sec ZRAM; zramctl 2>/dev/null; cat /proc/sys/vm/swappiness
          sec LAST_ACTIVITY_PER_BOT
          for u in $(systemctl list-units --type=service --state=running --no-legend --plain | awk '{print $1}' | grep -Ei 'bot|concierge|sushef|form|sync|flight|dating|mlm|cityservice|wb-|id-bot|grunvald|elitles|smena'); do echo "$u since $(systemctl show -p ActiveEnterTimestamp --value $u) last-log: $(journalctl -u $u -n1 --no-pager -o short-iso 2>/dev/null | tail -1 | cut -c1-25)"; done
          sec SSH155; sshd -T 2>/dev/null | grep -E '^(passwordauthentication|permitrootlogin|maxauthtries|port|pubkeyauthentication|logingracetime) '
          sec F2B155; ls /etc/fail2ban/jail.d/ 2>/dev/null; grep -hvE '^\s*(#|$)' /etc/fail2ban/jail.local /etc/fail2ban/jail.d/*.conf /etc/fail2ban/jail.d/*.local 2>/dev/null | head -40; fail2ban-client status 2>/dev/null; fail2ban-client get sshd bantime 2>/dev/null; fail2ban-client get sshd maxretry 2>/dev/null; fail2ban-client get sshd findtime 2>/dev/null
          sec SSH155_TOP_ATTACKERS; journalctl -u ssh --since "-24 hours" --no-pager 2>/dev/null | grep -oE "Failed password for .* from [0-9.]+" | awk '{print $NF}' | sort | uniq -c | sort -rn | head -8
          sec SERVER89
          timeout 60 ssh -i /root/.ssh/servgo_89_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/booking-bot-relay89/known_hosts -o ConnectTimeout=8 root@89.125.90.101 '
            sshd -T 2>/dev/null | grep -E "^(passwordauthentication|permitrootlogin|maxauthtries|port|pubkeyauthentication) "
            echo "authorized keys: $(grep -c . /root/.ssh/authorized_keys 2>/dev/null)"
            which fail2ban-client || echo "fail2ban: not installed"
            apt-cache policy fail2ban 2>/dev/null | sed -n 1,3p
            journalctl -u ssh --since "-24 hours" --no-pager 2>/dev/null | grep -oE "Failed password for .* from [0-9.]+" | awk "{print \$NF}" | sort | uniq -c | sort -rn | head -5
            journalctl -u ssh --since "-7 days" --no-pager 2>/dev/null | grep -E "Accepted (password|publickey)" | awk "{print \$6, \$7, \$9, \$11}" | sort | uniq -c | sort -rn | head -8
            ufw status 2>/dev/null | head -3; nft list ruleset 2>/dev/null | grep -c . 
          ' 2>&1 | tail -40
          sec SSH155_ACCEPTED_7D; journalctl -u ssh --since "-7 days" --no-pager 2>/dev/null | grep -E "Accepted (password|publickey)" | awk '{print $6, $7, $9, $11}' | sort | uniq -c | sort -rn | head -10
          '''
          _,o,e=s.exec_command(cmd,timeout=300)
          print(o.read().decode('utf-8','replace'))
          err=e.read().decode('utf-8','replace')
          if err.strip(): print('--- stderr ---'); print(err[-2500:])
          s.close()
          PY
      - name: Public reachability from runner
        shell: bash
        run: |
          python - <<'PY'
          import socket,ssl,smtplib,urllib.request
          for port in (25,587,993,443):
              try:
                  socket.create_connection(('mail.servgo.ru',port),timeout=8).close(); print(f'public {port}=ok')
              except Exception as e: print(f'public {port}=FAIL {type(e).__name__}: {e}')
          try:
              s=smtplib.SMTP('mail.servgo.ru',25,timeout=10); print('smtp25 banner/ehlo', s.ehlo()[0]); s.quit()
          except Exception as e: print('smtp25 FAIL', type(e).__name__, e)
          for u in ('https://mail.servgo.ru/','https://servgo.ru/mail'):
              try:
                  r=urllib.request.urlopen(u,timeout=10); print(u, r.status)
              except Exception as e: print(u, 'FAIL', type(e).__name__, getattr(e,'code',''), e)
          PY
