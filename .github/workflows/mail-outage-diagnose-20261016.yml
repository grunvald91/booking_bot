name: Mail outage diagnose (read-only)

# One-shot read-only diagnosis of the mail stack on server 155 after the
# 2026-10-16 report: mail.servgo.ru UI, outbound and inbound mail all failing.
# Changes nothing on the server. Prints no secrets or message bodies.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/mail-outage-diagnose-20261016.yml'

permissions:
  contents: read

concurrency:
  group: mail-outage-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Server-side state
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set +e
          sec(){ echo; echo "===== $1 ====="; }
          mask(){ sed -E 's/[A-Za-z0-9._%+-]+@([A-Za-z0-9.-]+)/***@\1/g; s/\+?[0-9]{10,}/<num>/g; s/(token|hash|code)=[^ &"]+/\1=***/g'; }
          sec RUN6_API_UPTIME
          systemctl show -p ActiveEnterTimestamp booking-web-api booking-bot
          sec RUN6_API_FILES_CHANGED_SINCE_PREV_RESTART
          find /opt/booking_bot/web/api /opt/booking_bot/bot /opt/booking_bot/*.py -name '*.py' -newermt '2026-10-16 11:06:30' -printf '%TF_%TT %p\n' 2>/dev/null | grep -v __pycache__ | sort | tail -30
          sec RUN6_AUTH_REQUESTS_16OCT_BEFORE
          journalctl -u booking-web-api --since '2026-10-16 00:00' --until '2026-10-17 03:11' --no-pager -o cat 2>/dev/null | grep -oE '"(GET|POST) /auth/[^ ?]*[^"]*" [0-9]{3}' | sort | uniq -c | sort -rn | head -15
          sec RUN6_AUTH_REQUESTS_AFTER_RESTART
          journalctl -u booking-web-api --since '2026-10-17 03:11' --no-pager -o short-iso 2>/dev/null | grep -E '/auth/' | mask | tail -30
          sec RUN6_API_ERRORS_AFTER_RESTART
          journalctl -u booking-web-api --since '2026-10-17 03:11' --no-pager -o short-iso 2>/dev/null | grep -vE '" [234][0-9][0-9] ' | grep -E 'Traceback|Error|Exception|error|WARNING|File "' | mask | tail -40
          sec RUN6_AUTH_ERRORS_LAST_3_DAYS
          journalctl -u booking-web-api --since '-3 days' --no-pager -o short-iso 2>/dev/null | grep -iE 'auth|telegram|phone|sms|code' | grep -iE 'error|fail|exception|traceback|refused|timeout|denied' | mask | tail -30
          sec RUN6_LOCAL_PROBES
          printf 'session -> '; curl -s -o /dev/null -m 8 -w '%{http_code}\n' http://127.0.0.1:8000/auth/session
          printf 'phone empty -> '; curl -s -m 8 -w ' %{http_code}\n' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8000/auth/phone | cut -c1-300
          printf 'telegram empty -> '; curl -s -m 8 -w ' %{http_code}\n' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8000/auth/telegram | cut -c1-300
          printf 'capabilities -> '; curl -s -m 8 -w ' %{http_code}\n' http://127.0.0.1:8000/auth/email/capabilities | cut -c1-300
          sec RUN6_SERVGO_LOGIN_HEADERS
          curl -skI -m 8 --resolve servgo.ru:443:127.0.0.1 https://servgo.ru/login | grep -iE '^(HTTP|content-security|x-frame|cache-control)'
          sec RUN6_FRONTEND_TELEGRAM
          D=/opt/booking_bot/web/frontend/dist; J=$D/assets/$(grep -oE 'index-[A-Za-z0-9_-]+\.js' $D/index.html | head -1); echo "$J"
          grep -oE '.{120}telegram-widget.{220}' "$J" | head -3
          grep -oE '.{80}data-telegram-login.{120}' "$J" | head -2
          grep -oE '.{100}/auth/phone.{200}' "$J" | head -2
          grep -oE '.{60}/auth/telegram[^-].{160}' "$J" | head -2
          sec RUN6_LOGIN_CHUNKS
          ls -l --time-style=+%F_%T $D/assets | grep -iE 'login|auth' | tail -5
          sec RUN6_SERVER_TELEGRAM_REACH
          curl -s -o /dev/null -m 8 -w 'telegram.org widget from server -> %{http_code}\n' https://telegram.org/js/telegram-widget.js
          curl -s -o /dev/null -m 8 -w 'api.telegram.org from server -> %{http_code}\n' https://api.telegram.org/
          sec RUN6_AUTH_PY_DELIVERY
          grep -nE 'def (send|request|deliver)|api.telegram.org|gateway|sendMessage|sms|TELEGRAM_[A-Z_]+|BOT_USERNAME' /opt/booking_bot/web/api/routes/auth.py | sed -E 's/(=\s*)["'"'"'][^"'"'"']{20,}["'"'"']/\1<redacted>/' | head -25
          sec RUN6_END
          '''
          _,o,e=s.exec_command(cmd,timeout=120)
          print(o.read().decode('utf-8','replace'))
          err=e.read().decode('utf-8','replace')
          if err.strip(): print('--- stderr ---'); print(err[-2500:])
          s.close()
          PY
      - name: Public reachability from runner
        shell: bash
        run: |
          python - <<'PY'
          import socket,ssl,smtplib,urllib.request
          for port in (25,587,993,443):
              try:
                  socket.create_connection(('mail.servgo.ru',port),timeout=8).close(); print(f'public {port}=ok')
              except Exception as e: print(f'public {port}=FAIL {type(e).__name__}: {e}')
          try:
              s=smtplib.SMTP('mail.servgo.ru',25,timeout=10); print('smtp25 banner/ehlo', s.ehlo()[0]); s.quit()
          except Exception as e: print('smtp25 FAIL', type(e).__name__, e)
          for u in ('https://mail.servgo.ru/','https://servgo.ru/mail'):
              try:
                  r=urllib.request.urlopen(u,timeout=10); print(u, r.status)
              except Exception as e: print(u, 'FAIL', type(e).__name__, getattr(e,'code',''), e)
          PY
