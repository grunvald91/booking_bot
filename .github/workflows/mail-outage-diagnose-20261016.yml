name: Mail outage diagnose (read-only)

# One-shot read-only diagnosis of the mail stack on server 155 after the
# 2026-10-16 report: mail.servgo.ru UI, outbound and inbound mail all failing.
# Changes nothing on the server. Prints no secrets or message bodies.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/mail-outage-diagnose-20261016.yml'

permissions:
  contents: read

concurrency:
  group: mail-outage-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Server-side state
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set +e
          sec(){ echo; echo "===== $1 ====="; }
          sec R12_RELAY
          timeout 50 ssh -i /root/.ssh/servgo_89_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/booking-bot-relay89/known_hosts -o ConnectTimeout=8 root@89.125.90.101 '
            echo "--- who brings up tg-relay"
            ip -d link show tg-relay 2>&1 | head -3
            grep -rlE "tg-relay" /etc/systemd /lib/systemd/system /etc/wireguard /etc/network /etc/netplan 2>/dev/null | head
            systemctl list-units --all --no-pager --no-legend 2>/dev/null | grep -iE "tg-relay|wg|wireguard|networkd" | head
            networkctl list 2>/dev/null | head -10
            for u in $(grep -rlE "tg-relay" /etc/systemd/system 2>/dev/null | xargs -r -n1 basename | grep -E "\.service$"); do echo "# $u"; systemctl cat "$u" 2>/dev/null | grep -E "^(Description|After|Before|Wants|Requires|ExecStart|Type|RemainAfterExit|WantedBy)=" | sed -E "s/(PrivateKey|PresharedKey)[^ ]*/\1=<redacted>/g"; echo "active=$(systemctl is-active $u) enabled=$(systemctl is-enabled $u)"; done
            echo "--- nginx drop-ins"; ls /etc/systemd/system/nginx.service.d/; systemctl cat nginx | grep -E "^(After|Wants|Requires|ExecStartPre|Restart)="
            echo "--- telemt units"
            systemctl list-units --all --no-pager --no-legend "telemt*" 2>/dev/null
            systemctl cat telemt 2>/dev/null | grep -E "^(Description|ExecStart|Restart|RestartSec|After|User|WorkingDirectory)="
            echo "--- telemt journal"
            journalctl -u telemt --no-pager -n 40 -o short-iso 2>&1 | grep -viE "secret|ad_tag" | tail -40
            echo "--- telemt restarts"; systemctl show telemt -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp
            CONF=$(systemctl cat telemt 2>/dev/null | sed -n "s/^ExecStart=.* \(\/[^ ]*\.toml\).*/\1/p" | head -1); echo "config=$CONF"
            [ -n "$CONF" ] && grep -nEi "^\[|listen|port|tls_domain|mask_host|mask_port|public" "$CONF" | grep -viE "secret|key" | head -30
            echo "--- ports in use near telemt"; ss -lntp 2>/dev/null | grep -E ":(443|944[0-9]|909[0-9]|947[0-9]) " | awk "{print \$4, \$6}"
          ' 2>&1 | tail -140
          sec R12_END
          '''
          _,o,e=s.exec_command(cmd,timeout=120)
          print(o.read().decode('utf-8','replace'))
          err=e.read().decode('utf-8','replace')
          if err.strip(): print('--- stderr ---'); print(err[-2500:])
          s.close()
          PY
      - name: Public reachability from runner
        shell: bash
        run: |
          python - <<'PY'
          import socket,ssl,smtplib,urllib.request
          for port in (25,587,993,443):
              try:
                  socket.create_connection(('mail.servgo.ru',port),timeout=8).close(); print(f'public {port}=ok')
              except Exception as e: print(f'public {port}=FAIL {type(e).__name__}: {e}')
          try:
              s=smtplib.SMTP('mail.servgo.ru',25,timeout=10); print('smtp25 banner/ehlo', s.ehlo()[0]); s.quit()
          except Exception as e: print('smtp25 FAIL', type(e).__name__, e)
          for u in ('https://mail.servgo.ru/','https://servgo.ru/mail'):
              try:
                  r=urllib.request.urlopen(u,timeout=10); print(u, r.status)
              except Exception as e: print(u, 'FAIL', type(e).__name__, getattr(e,'code',''), e)
          PY
