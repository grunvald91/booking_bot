name: Mail outage diagnose (read-only)

# One-shot read-only diagnosis of the mail stack on server 155 after the
# 2026-10-16 report: mail.servgo.ru UI, outbound and inbound mail all failing.
# Changes nothing on the server. Prints no secrets or message bodies.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/mail-outage-diagnose-20261016.yml'

permissions:
  contents: read

concurrency:
  group: mail-outage-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Server-side state
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set +e
          sec(){ echo; echo "===== $1 ====="; }
          mask(){ sed -E 's/[A-Za-z0-9._%+-]+@([A-Za-z0-9.-]+)/***@\1/g; s/(ticket|token)=[^ &"]+/\1=***/g'; }
          sec RUN3_WEBAPP_VHOST
          for x in $(grep -lE 'server_name[^;]*servgo\.ru' /etc/nginx/sites-enabled/* 2>/dev/null | grep -vE 'growth|mail-servgo|promo' | sort -u); do echo "--- $x"; grep -vE '^\s*(#|$)' "$x" | grep -Ev 'ssl_(session|protocols|ciphers|prefer|dhparam)|include /etc/letsencrypt' | head -140; done
          grep -lR 'servgo.ru' /etc/nginx/sites-enabled/ 2>/dev/null
          sec RUN3_LOG_FILES
          grep -hoE 'access_log\s+[^ ;]+' -R /etc/nginx/ 2>/dev/null | sort -u
          sec RUN3_USER_REQUESTS_TODAY
          for L in $(grep -hoE 'access_log\s+[^ ;]+' -R /etc/nginx/ 2>/dev/null | awk '{print $2}' | sort -u) /var/log/nginx/access.log; do [ -f "$L" ] || continue; r=$(grep -E '^195\.178\.110\.18 ' "$L" | grep -E '16/Oct/2026|17/Oct/2026' | grep -E 'mail|owner|login|/api/auth' | awk '{print $4,$6,$7,$9,$11}' | mask | tail -40); [ -n "$r" ] && { echo "--- $L"; echo "$r"; }; done
          sec RUN3_REDIRECT_PROBES
          for u in https://www.servgo.ru/api/owner-mail/entry http://servgo.ru/api/owner-mail/entry https://servgo.ru/api/owner-mail/entry https://servgo.ru/api/owner-mail/entry/ ; do h=$(echo "$u" | sed -E 's#https?://([^/]+).*#\1#'); pr=$(echo "$u" | cut -d: -f1); port=443; [ "$pr" = http ] && port=80; printf '%s POST -> ' "$u"; curl -sk -o /dev/null -m 8 -X POST -w '%{http_code} %{redirect_url}\n' --resolve "$h:$port:127.0.0.1" "$u"; done
          printf 'www /mail -> '; curl -sk -o /dev/null -m 8 -w '%{http_code} %{redirect_url}\n' --resolve www.servgo.ru:443:127.0.0.1 https://www.servgo.ru/mail
          sec RUN3_INDEX_BUNDLE
          grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' /opt/booking_bot/web/frontend/dist/index.html
          grep -oE 'serviceWorker|registerSW|sw\.js' /opt/booking_bot/web/frontend/dist/index.html | sort -u
          ls -l --time-style=+%F_%T /opt/booking_bot/web/frontend/dist/sw.js /opt/booking_bot/web/frontend/dist/*.webmanifest 2>&1
          sec RUN3_MAIL_UI_AUTH
          grep -nE 'mailbox-dashboard|def .*owner|Depends\(|HTTPException\(401' /opt/booking_bot/web/api/routes/mail_campaign_ui.py | head -20
          grep -nE 'def mail_owner' -A16 /opt/booking_bot/web/api/routes/owner_mail.py | head -24
          grep -nE 'logout|delete_cookie' /opt/booking_bot/web/api/routes/owner_mail.py /opt/booking_bot/web/api/routes/mail_campaign_dashboard.html /opt/booking_bot/web/api/routes/owner_mail_ui.html | head
          grep -nE 'mailbox-dashboard|location\.(href|assign)|401' /opt/booking_bot/web/api/routes/mail_campaign_dashboard.html | head -20
          '''
          _,o,e=s.exec_command(cmd,timeout=120)
          print(o.read().decode('utf-8','replace'))
          err=e.read().decode('utf-8','replace')
          if err.strip(): print('--- stderr ---'); print(err[-2500:])
          s.close()
          PY
      - name: Public reachability from runner
        shell: bash
        run: |
          python - <<'PY'
          import socket,ssl,smtplib,urllib.request
          for port in (25,587,993,443):
              try:
                  socket.create_connection(('mail.servgo.ru',port),timeout=8).close(); print(f'public {port}=ok')
              except Exception as e: print(f'public {port}=FAIL {type(e).__name__}: {e}')
          try:
              s=smtplib.SMTP('mail.servgo.ru',25,timeout=10); print('smtp25 banner/ehlo', s.ehlo()[0]); s.quit()
          except Exception as e: print('smtp25 FAIL', type(e).__name__, e)
          for u in ('https://mail.servgo.ru/','https://servgo.ru/mail'):
              try:
                  r=urllib.request.urlopen(u,timeout=10); print(u, r.status)
              except Exception as e: print(u, 'FAIL', type(e).__name__, getattr(e,'code',''), e)
          PY
