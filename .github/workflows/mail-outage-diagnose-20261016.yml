name: Mail outage diagnose (read-only)

# One-shot read-only diagnosis of the mail stack on server 155 after the
# 2026-10-16 report: mail.servgo.ru UI, outbound and inbound mail all failing.
# Changes nothing on the server. Prints no secrets or message bodies.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/mail-outage-diagnose-20261016.yml'

permissions:
  contents: read

concurrency:
  group: mail-outage-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Server-side state
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set +e
          AUDIT='
          sec(){ echo; echo "== $1"; }
          sec HOST; hostname; uptime; last -x reboot 2>/dev/null | head -3
          sec MEM; free -m; swapon --show 2>/dev/null
          sec DISK; df -hT -x tmpfs -x devtmpfs -x overlay -x squashfs; df -ih / | tail -1
          sec TOP_DIRS; du -xhd1 / 2>/dev/null | sort -h | tail -12
          sec VAR; du -xhd2 /var 2>/dev/null | sort -h | tail -12
          sec OPT; du -xhd1 /opt 2>/dev/null | sort -h | tail -12
          sec ROOT_HOME; du -xhd1 /root /home 2>/dev/null | sort -h | tail -10
          sec TMP; du -xsh /tmp /var/tmp 2>/dev/null; find /tmp /var/tmp -xdev -type f -mtime +7 2>/dev/null | wc -l
          sec JOURNAL; journalctl --disk-usage 2>/dev/null
          sec LOGS; du -sh /var/log 2>/dev/null; find /var/log -type f \( -name "*.gz" -o -name "*.[0-9]" -o -name "*.old" \) -printf "%s\n" 2>/dev/null | awk "{s+=\$1}END{printf \"rotated logs: %.0f MB\n\", s/1048576}"; find /var/log -type f -size +50M -printf "%s %p\n" 2>/dev/null | sort -n | tail -6
          sec APT; du -sh /var/cache/apt 2>/dev/null; apt list --upgradable 2>/dev/null | grep -c upgradable; apt list --upgradable 2>/dev/null | grep -ci security; [ -f /var/run/reboot-required ] && echo REBOOT_REQUIRED || echo no-reboot-required
          sec KERNELS; dpkg -l "linux-image-*" 2>/dev/null | awk "/^ii/{print \$2}" | tr "\n" " "; echo; uname -r
          sec CACHES; du -sh /root/.cache /root/.npm /root/.cache/pip /home/*/.cache 2>/dev/null
          sec DOCKER; docker system df 2>/dev/null; docker images -f dangling=true -q 2>/dev/null | wc -l; docker ps -a --filter status=exited --format "{{.Names}} {{.Status}}" 2>/dev/null | head
          sec CRASH; ls -la /var/crash 2>/dev/null | tail -5; find / -xdev -name "core" -o -name "core.[0-9]*" -type f 2>/dev/null | head -5
          sec FAILED; systemctl --failed --no-legend --plain
          sec OOM_7D; journalctl -k --since "-7 days" --no-pager 2>/dev/null | grep -ciE "out of memory|oom-kill"
          sec TOP_MEM; ps -eo pid,comm,%mem,%cpu,etime --sort=-%mem | head -8
          sec TOP_CPU; ps -eo pid,comm,%cpu,etime --sort=-%cpu | head -6
          sec ZOMBIES; ps -eo stat | grep -c "^Z"
          sec SSH_BRUTE_24H; journalctl -u ssh -u sshd --since "-24 hours" --no-pager 2>/dev/null | grep -c "Failed password"; fail2ban-client status sshd 2>/dev/null | grep -E "Currently|Total" 
          sec BACKUPS_OLD; find /opt /etc /root -xdev \( -name "*.bak*" -o -name "*.orig" -o -name "*backup*" -o -name "*.tgz" -o -name "*.tar.gz" \) -mtime +7 -printf "%TF %s %p\n" 2>/dev/null | sort | awk "{printf \"%s %6.1fMB %s\n\", \$1, \$2/1048576, \$3}" | tail -25
          '
          echo "############ SERVER 155 ############"
          bash -c "$AUDIT" 2>&1
          echo "--- 155 app specifics"
          du -sh /opt/booking_bot/web/frontend/dist /opt/booking_bot/web/frontend/dist.bak_* /opt/servgo-releases /opt/servgo-releases/* 2>/dev/null
          ls /opt/booking_bot/web/frontend/dist/assets | wc -l
          echo "############ SERVER 89 ############"
          timeout 90 ssh -i /root/.ssh/servgo_89_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/booking-bot-relay89/known_hosts -o ConnectTimeout=8 root@89.125.90.101 "bash -s" <<< "$AUDIT" 2>&1
          echo AUDIT_END
          '''
          _,o,e=s.exec_command(cmd,timeout=300)
          print(o.read().decode('utf-8','replace'))
          err=e.read().decode('utf-8','replace')
          if err.strip(): print('--- stderr ---'); print(err[-2500:])
          s.close()
          PY
      - name: Public reachability from runner
        shell: bash
        run: |
          python - <<'PY'
          import socket,ssl,smtplib,urllib.request
          for port in (25,587,993,443):
              try:
                  socket.create_connection(('mail.servgo.ru',port),timeout=8).close(); print(f'public {port}=ok')
              except Exception as e: print(f'public {port}=FAIL {type(e).__name__}: {e}')
          try:
              s=smtplib.SMTP('mail.servgo.ru',25,timeout=10); print('smtp25 banner/ehlo', s.ehlo()[0]); s.quit()
          except Exception as e: print('smtp25 FAIL', type(e).__name__, e)
          for u in ('https://mail.servgo.ru/','https://servgo.ru/mail'):
              try:
                  r=urllib.request.urlopen(u,timeout=10); print(u, r.status)
              except Exception as e: print(u, 'FAIL', type(e).__name__, getattr(e,'code',''), e)
          PY
