name: Verify existing owned Telegram proxy routes
on:
  push:
    branches: [work/ai-job-worker-20261102]
    paths: [.github/workflows/ai-job-worker-host.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --quiet 'paramiko==3.5.1'
      - uses: actions/checkout@v4
      - run: python scripts/diagnose_ai_job_worker.py
