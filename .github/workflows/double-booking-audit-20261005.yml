name: ServGo double-booking read-only audit

on:
  push:
    branches:
      - audit/double-booking-20261005

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Audit production booking protections
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko
          HOST='155.212.162.47'; FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set -e
          cd /opt/booking_bot
          ./venv/bin/python - <<'DB_PY'
          import asyncio
          from sqlalchemy import text
          from database.database import async_session_maker

          ACTIVE=('pending','confirmed','pending_prepayment','prepayment_sent','prepayment_confirmed')

          async def run():
              async with async_session_maker() as s:
                  print('--- isolation ---')
                  iso=(await s.execute(text("show transaction_isolation"))).scalar()
                  print('transaction_isolation='+str(iso))

                  print('--- bookings constraints ---')
                  q=text("""
                    select c.conname, c.contype, pg_get_constraintdef(c.oid)
                    from pg_constraint c
                    join pg_class t on t.oid=c.conrelid
                    where t.relname='bookings'
                    order by c.conname
                  """)
                  for name,typ,defn in (await s.execute(q)).all():
                      print(f'constraint={name}|type={typ}|def={defn}')

                  print('--- bookings indexes ---')
                  q=text("""
                    select indexname, indexdef
                    from pg_indexes
                    where tablename='bookings'
                    order by indexname
                  """)
                  for name,defn in (await s.execute(q)).all():
                      print(f'index={name}|def={defn}')

                  print('--- active exact duplicate starts (same employee/date/time) ---')
                  q=text("""
                    select count(*)
                    from (
                      select employee_id, booking_date, booking_time, count(*) n
                      from bookings
                      where employee_id is not null
                        and status = any(:statuses)
                      group by employee_id, booking_date, booking_time
                      having count(*) > 1
                    ) x
                  """)
                  exact=(await s.execute(q,{'statuses':list(ACTIVE)})).scalar()
                  print('active_exact_duplicate_slot_groups='+str(exact))

                  print('--- active interval overlaps (aggregate only) ---')
                  q=text("""
                    with active as (
                      select b.id,b.employee_id,b.booking_date,b.booking_time,
                             coalesce(b.duration_minutes,s.duration_minutes,30) duration_minutes
                      from bookings b
                      left join services s on s.id=b.service_id
                      where b.employee_id is not null
                        and b.status = any(:statuses)
                        and coalesce(s.is_additional,false)=false
                    )
                    select count(*)
                    from active a
                    join active b
                      on a.id < b.id
                     and a.employee_id=b.employee_id
                     and (
                       a.booking_date between b.booking_date - interval '1 day' and b.booking_date + interval '1 day'
                       or b.booking_date between a.booking_date - interval '1 day' and a.booking_date + interval '1 day'
                     )
                     and (a.booking_date + a.booking_time) <
                         (b.booking_date + b.booking_time + make_interval(mins=>b.duration_minutes))
                     and (b.booking_date + b.booking_time) <
                         (a.booking_date + a.booking_time + make_interval(mins=>a.duration_minutes))
                  """)
                  overlaps=(await s.execute(q,{'statuses':list(ACTIVE)})).scalar()
                  print('active_overlap_pairs='+str(overlaps))

                  print('--- bookings without employee ---')
                  q=text("""
                    select count(*) from bookings
                    where employee_id is null and status = any(:statuses)
                  """)
                  print('active_bookings_without_employee='+str((await s.execute(q,{'statuses':list(ACTIVE)})).scalar()))
          asyncio.run(run())
          DB_PY
          '''
          _,out,err=ssh.exec_command(cmd,timeout=45)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print(stderr[-1200:])
              raise SystemExit(status)
          ssh.close()
          PY
