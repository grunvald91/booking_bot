name: ServGo studio company switch scoped release
on:
  push:
    branches: [ops/studio-switch-release-20261102]
    paths:
      - '.github/workflows/servgo-studio-switch-release.yml'
      - 'scripts/deploy_studio_switch.py'
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test and deployment dependencies
        run: python -m pip install -r requirements.txt -r web/api/requirements.txt 'paramiko==3.5.1' pytest aiosqlite
      - name: Check SSO roles and safe patch before touching production
        run: python -m pytest -q tests/test_studio_sso.py tests/test_studio_switch_deploy.py
      - name: Deploy only company-list functions with rollback and health checks
        env:
          SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        run: python -m scripts.deploy_studio_switch
