name: Deploy AI seller venue rules + Air chat (scoped, guarded)

# Разовая выкладка: AI-продавец бронирует площадки по правилам страницы записи,
# чат в дизайне Air. Только booking-web-api (бот не перезапускается) и frontend.
#   1. сверка хэшей файлов API на сервере с ожидаемыми (63a6e5b) — иначе ничего не трогает;
#   2. бэкап; 3. заливка; 4. py_compile; 5. рестарт booking-web-api;
#   6. проверка API (/businesses, /ai/history); при ошибке — откат и проверка отката;
#   7. frontend в соседнюю папку и подмена dist переименованием.
# Журналы сервисов в публичный лог не выводятся. Временный файл: удалить до мержа PR #38.

on:
  push:
    branches:
      - ccr-545c5158-rcd05z
    paths:
      - '.github/workflows/servgo-sales-air-deploy.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — secret present
        run: |
          if [ -z "$SERVER_PASSWORD" ]; then
            echo "::error::SERVER_SSH_PASSWORD is not configured"; exit 1
          fi

      - name: Expected server hashes
        run: |
          set -euo pipefail
          for f in web/api/routes/ai.py web/api/sales/engine.py web/api/sales/policy.py web/api/sales/stages.py web/api/sales/state.py web/api/sales/tools.py; do
            echo "$f $(git show 63a6e5b:"$f" | sha256sum | cut -d' ' -f1)"
          done > expected.txt
          cat expected.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          grep -R -q 'bf-chat-card' dist/assets

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Deploy with backup and rollback
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, posixpath, shlex, sys, time
          import paramiko

          ROOT = '/opt/booking_bot'
          FRONT = f'{ROOT}/web/frontend'
          FILES = [line.split()[0] for line in pathlib.Path('expected.txt').read_text().splitlines()]
          expected = dict(line.split() for line in pathlib.Path('expected.txt').read_text().splitlines())

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != 'uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU':
                      raise paramiko.SSHException('Host key mismatch')
                  client.get_host_keys().add(hostname, key.get_name(), key)

          ssh = None
          for attempt in range(3):
              conn = paramiko.SSHClient(); conn.set_missing_host_key_policy(Pinned())
              try:
                  conn.connect('155.212.162.47', port=22, username='root', password=os.environ['SERVER_PASSWORD'],
                               look_for_keys=False, allow_agent=False, timeout=12, banner_timeout=25, auth_timeout=15)
                  ssh = conn; break
              except (paramiko.SSHException, OSError, EOFError):
                  conn.close()
                  if attempt == 2: raise
                  time.sleep(3)
          sftp = ssh.open_sftp()

          def run(cmd, check=True):
              _, out, err = ssh.exec_command(cmd, timeout=180)
              code = out.channel.recv_exit_status()
              o = out.read().decode(errors='replace'); e = err.read().decode(errors='replace')
              if o.strip(): print(o.rstrip())
              if e.strip(): print(e.rstrip(), file=sys.stderr)
              if check and code != 0:
                  raise RuntimeError(f'command failed ({code})')
              return code, o

          def api_healthy():
              checks = (
                  "curl -fsS -o /dev/null --max-time 4 http://127.0.0.1:8000/businesses",
                  # /ai/history без диалога: 200 или 404 (нет компании) — но не 5xx.
                  "code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 'http://127.0.0.1:8000/ai/history?business_id=1'); case $code in 5*|000) exit 1;; esac",
              )
              for _ in range(25):
                  if all(run(c, check=False)[0] == 0 for c in checks):
                      return True
                  time.sleep(2)
              return False

          def put_tree(local, remote):
              for path in sorted(pathlib.Path(local).rglob('*')):
                  target = posixpath.join(remote, path.relative_to(local).as_posix())
                  if path.is_dir():
                      run(f'mkdir -p {shlex.quote(target)}')
                  else:
                      sftp.put(str(path), target)

          try:
              mismatched = []
              for f in FILES:
                  with sftp.open(f'{ROOT}/{f}', 'rb') as fh:
                      if hashlib.sha256(fh.read()).hexdigest() != expected[f]:
                          mismatched.append(f)
              if mismatched:
                  print('Server copies differ from the expected state, refusing to overwrite:', *mismatched, sep='\n  ')
                  sys.exit(2)
              print('Server files match the expected state: ok')

              stamp = time.strftime('%Y%m%d-%H%M%S')
              backup = f'{ROOT}/backups/sales-air-{stamp}.tgz'
              run(f'mkdir -p {ROOT}/backups && cd {ROOT} && tar czf {backup} {" ".join(FILES)}')
              print('Backup:', backup)

              def restore():
                  print('Rolling back from', backup)
                  code, _ = run(f'cd {ROOT} && tar xzf {backup} && systemctl restart booking-web-api', check=False)
                  print('Rollback', 'succeeded, API healthy' if code == 0 and api_healthy() else 'FAILED — API needs manual attention')

              for f in FILES:
                  sftp.put(f, f'{ROOT}/{f}')
              try:
                  run(f'cd {ROOT} && ./venv/bin/python -m py_compile {" ".join(FILES)}')
                  run('systemctl restart booking-web-api')
                  if not api_healthy():
                      run("printf 'booking-web-api: '; systemctl is-active booking-web-api", check=False)
                      raise RuntimeError('API did not come up healthy')
                  run("printf 'booking-web-api: '; systemctl is-active booking-web-api")
                  print('API health: ok')
              except Exception:
                  restore()
                  raise

              new_dir = f'{FRONT}/dist.new-{stamp}'
              prev_dir = f'{FRONT}/dist.prev-{stamp}'
              run(f'test -d {FRONT}/dist && rm -rf {new_dir} && mkdir -p {new_dir}')
              try:
                  put_tree('web/frontend/dist', new_dir)
                  run(f"grep -R -q 'bf-chat-card' {new_dir}/assets")
                  run(f'cp -an {FRONT}/dist/assets/. {new_dir}/assets/ 2>/dev/null || true')
                  run(f'mv {FRONT}/dist {prev_dir} && mv {new_dir} {FRONT}/dist')
              except Exception:
                  run(f'rm -rf {new_dir}', check=False)
                  raise
              run(f'ls -d {FRONT}/dist.prev-* 2>/dev/null | sort | head -n -2 | xargs -r rm -rf', check=False)
              run("printf 'site HTTP '; curl -s -o /dev/null -w '%{http_code}\\n' --max-time 5 -H 'Host: servgo.ru' http://127.0.0.1/", check=False)
              print('frontend live; previous build kept at', prev_dir)
              print('Done. API rollback: tar xzf', backup, '-C', ROOT, '&& systemctl restart booking-web-api')
          finally:
              sftp.close(); ssh.close()
          PY
