name: Deploy ServGo Air (scoped, guarded)

# Разовый узконаправленный деплой редизайна ServGo Air (PR #38).
# Запускается только пушем этого файла в ветку редизайна.
#
# Что делает, по шагам (останавливается при первой ошибке):
#   1. проверяет, что 4 backend-файла на сервере совпадают со сверенным
#      снимком прода (коммит be2d6bc); если прод снова ушёл вперёд —
#      ничего не трогает и падает;
#   2. делает бэкап этих файлов и web/frontend/dist в /opt/booking_bot/backups/;
#   3. применяет аддитивную миграцию migrations/add_allow_multiple_services.sql;
#   4. заливает 4 backend-файла, проверяет синтаксис, перезапускает booking-web-api;
#   5. проверяет API (openapi + поле allow_multiple_services), при ошибке
#      возвращает файлы из бэкапа и перезапускает сервис;
#   6. заливает собранный web/frontend/dist (nginx отдаёт статику, рестарт не нужен).
# booking-bot не перезапускается.

on:
  push:
    branches:
      - ccr-545c5158-rcd05z
    paths:
      - '.github/workflows/servgo-air-deploy.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — secret present
        run: |
          if [ -z "$SERVER_PASSWORD" ]; then
            echo "::error::SERVER_SSH_PASSWORD is not configured"; exit 1
          fi

      - name: Expected server hashes (reconciled production snapshot)
        run: |
          set -euo pipefail
          # be2d6bc = "Reconcile GitHub with production source"
          for f in database/models.py web/api/schemas.py web/api/routes/admin.py web/api/routes/client.py; do
            echo "$f $(git show be2d6bc:"$f" | sha256sum | cut -d' ' -f1)"
          done > expected-main.txt
          cat expected-main.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          grep -R -q 'grunvaldlab@gmail.com' dist/assets

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Deploy with backup and rollback
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, posixpath, shlex, stat, sys, time
          import paramiko

          ROOT = '/opt/booking_bot'
          BACKEND = ['database/models.py', 'web/api/schemas.py', 'web/api/routes/admin.py', 'web/api/routes/client.py']
          MIGRATION = 'migrations/add_allow_multiple_services.sql'
          expected = dict(line.split() for line in pathlib.Path('expected-main.txt').read_text().splitlines())

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != 'uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU':
                      raise paramiko.SSHException('Host key mismatch')
                  client.get_host_keys().add(hostname, key.get_name(), key)

          ssh = None
          for attempt in range(3):
              conn = paramiko.SSHClient(); conn.set_missing_host_key_policy(Pinned())
              try:
                  conn.connect('155.212.162.47', port=22, username='root', password=os.environ['SERVER_PASSWORD'],
                               look_for_keys=False, allow_agent=False, timeout=12, banner_timeout=25, auth_timeout=15)
                  ssh = conn; break
              except (paramiko.SSHException, OSError, EOFError):
                  conn.close()
                  if attempt == 2: raise
                  time.sleep(3)
          sftp = ssh.open_sftp()

          def run(cmd, check=True):
              _, out, err = ssh.exec_command(cmd, timeout=180)
              code = out.channel.recv_exit_status()
              o = out.read().decode(errors='replace'); e = err.read().decode(errors='replace')
              if o.strip(): print(o.rstrip())
              if e.strip(): print(e.rstrip(), file=sys.stderr)
              if check and code != 0:
                  raise RuntimeError(f'command failed ({code})')
              return code, o

          def put_tree(local, remote):
              for path in sorted(pathlib.Path(local).rglob('*')):
                  rel = path.relative_to(local).as_posix()
                  target = posixpath.join(remote, rel)
                  if path.is_dir():
                      run(f'mkdir -p {shlex.quote(target)}')
                  else:
                      sftp.put(str(path), target)

          try:
              # 1. Server source must match main for the files we replace.
              mismatched = []
              for f in BACKEND:
                  with sftp.open(f'{ROOT}/{f}', 'rb') as fh:
                      actual = hashlib.sha256(fh.read()).hexdigest()
                  if actual != expected[f]:
                      mismatched.append(f)
              if mismatched:
                  print('Server copies differ from the reconciled snapshot, refusing to overwrite:', *mismatched, sep='\n  ')
                  sys.exit(2)
              print('Server backend files match the reconciled snapshot: ok')

              # 2. Backup.
              stamp = time.strftime('%Y%m%d-%H%M%S')
              backup = f'{ROOT}/backups/servgo-air-{stamp}.tgz'
              run(f'mkdir -p {ROOT}/backups && cd {ROOT} && tar czf {backup} {" ".join(BACKEND)} web/frontend/dist')
              print('Backup:', backup)

              # 3. Additive migration with the API's own database credentials
              #    (asyncpg from the app venv; the URL is never printed).
              MIGRATE_PY = (
                  "import asyncio, os, asyncpg\n"
                  "async def main():\n"
                  "    c = await asyncpg.connect(os.environ['MIG_URL'].replace('+asyncpg', ''))\n"
                  "    try:\n"
                  "        await c.execute(open('/tmp/servgo-air-migration.sql').read())\n"
                  "        n = await c.fetchval(\"SELECT count(*) FROM information_schema.columns \"\n"
                  "                             \"WHERE table_name='businesses' AND column_name='allow_multiple_services'\")\n"
                  "    finally:\n"
                  "        await c.close()\n"
                  "    assert n == 1, n\n"
                  "    print('migration: allow_multiple_services column present')\n"
                  "asyncio.run(main())\n"
              )
              sftp.put(MIGRATION, '/tmp/servgo-air-migration.sql')
              with sftp.open('/tmp/servgo-air-migrate.py', 'w') as fh:
                  fh.write(MIGRATE_PY)
              run(r"""set -e; cd /opt/booking_bot
          URL=$(systemctl show -p Environment --value booking-web-api | tr ' ' '\n' | sed -n 's/^DATABASE_URL=//p')
          if [ -z "$URL" ] && [ -f .env ]; then URL=$(sed -n 's/^DATABASE_URL=//p' .env | tr -d '\r"' | tail -1); fi
          test -n "$URL" || { echo 'DATABASE_URL not found'; exit 1; }
          MIG_URL="$URL" ./venv/bin/python /tmp/servgo-air-migrate.py""")
              run('rm -f /tmp/servgo-air-migration.sql /tmp/servgo-air-migrate.py')

              # 4. Backend files + syntax check + restart.
              def restore_backend():
                  print('Rolling back backend files from', backup)
                  run(f'cd {ROOT} && tar xzf {backup} {" ".join(BACKEND)} && systemctl restart booking-web-api', check=False)

              for f in BACKEND:
                  sftp.put(f, f'{ROOT}/{f}')
              try:
                  run(f'cd {ROOT} && ./venv/bin/python -m py_compile {" ".join(BACKEND)}')
                  run('systemctl restart booking-web-api')
                  ok = False
                  for _ in range(20):
                      code, out = run("curl -s --max-time 3 http://127.0.0.1:8000/openapi.json | grep -c allow_multiple_services || true", check=False)
                      if out.strip() not in ('', '0'):
                          ok = True; break
                      time.sleep(2)
                  if not ok:
                      run('systemctl status booking-web-api --no-pager | head -20; journalctl -u booking-web-api -n 40 --no-pager', check=False)
                      raise RuntimeError('API did not come up with the new schema')
                  run("printf 'booking-web-api: '; systemctl is-active booking-web-api")
                  run("printf 'public business list HTTP '; curl -s -o /dev/null -w '%{http_code}\\n' --max-time 5 http://127.0.0.1:8000/businesses")
              except Exception:
                  restore_backend()
                  raise

              # 5. Frontend static build.
              run(f'mkdir -p {ROOT}/web/frontend/dist')
              put_tree('web/frontend/dist', f'{ROOT}/web/frontend/dist')
              run(f"grep -R -q 'bf-root' {ROOT}/web/frontend/dist/assets && echo 'frontend: ServGo Air build is live'")
              run("printf 'site HTTP '; curl -s -o /dev/null -w '%{http_code}\\n' --max-time 5 -H 'Host: servgo.ru' http://127.0.0.1/", check=False)
              print('Done. Rollback: tar xzf', backup, '-C', ROOT, '&& systemctl restart booking-web-api')
          finally:
              sftp.close(); ssh.close()
          PY
