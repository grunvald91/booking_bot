name: Release ServGo Mail backend only (guarded)
on:
  push:
    branches:
      - ops/servgo-mail-pwa-20261102
    paths:
      - '.github/workflows/mail-pwa-scoped-release.yml'
permissions:
  contents: read
concurrency:
  group: servgo-mail-pwa-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH client
        run: python -m pip install -q 'paramiko==3.5.1'
      - name: Compile guarded deployment tool
        run: python -m py_compile scripts/deploy_mail_pwa_scoped.py scripts/mail_pwa_server_preflight.py
      - name: Deploy only seven hash-verified Mail backend files with backups and rollback
        run: python -m scripts.deploy_mail_pwa_scoped
