name: Promo isolation and monitoring tests
on:
  push:
    branches:
      - feature/servgo-promo-isolation-monitor-20261031
  pull_request:
    paths:
      - 'webapp/promo_standalone.py'
      - 'ops/servgo_monitor.py'
      - 'deploy/systemd/**'
      - 'tests/test_promo_isolation_contract.py'
      - 'tests/test_servgo_monitor.py'
      - '.github/workflows/promo-monitor-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Compile isolated entrypoints
        run: python -m py_compile webapp/promo_standalone.py ops/servgo_monitor.py
      - name: Run no-network regression tests
        run: python -m pytest -q tests/test_promo_isolation_contract.py tests/test_servgo_monitor.py
