name: Diagnose prepayment attention (read-only)
on:
  push:
    branches: [diag/prepayment-attention-20261020]
    paths: ['.github/diag/prepayment_attention.py', '.github/workflows/diag-prepayment-attention-20261020.yml']
permissions:
  contents: read
concurrency:
  group: diag-prepayment-attention
  cancel-in-progress: true
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q --disable-pip-version-check 'paramiko==3.5.1'
      - run: python .github/diag/prepayment_attention.py
