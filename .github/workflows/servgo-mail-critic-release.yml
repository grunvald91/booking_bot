name: Deploy ServGo Mail critic (scoped)
on:
  pull_request:
    paths: ['.github/workflows/servgo-mail-critic-release.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/servgo-mail-critic-release.yml']
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BOT_TOKEN: test-token
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -r web/api/requirements.txt pytest aiosqlite 'paramiko==3.5.1'
      - run: python -m pytest -q tests/test_mail_company_search.py tests/test_mail_search_deploy.py
      - name: Release the reviewed Mail critic file
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          from scripts import deploy_mail_search as rollout

          target = "web/api/routes/mail_campaign_research.py"
          commit = "a3baf5d0a880eb6f9edf9569834d8752560fa4f3"
          reviewed = subprocess.check_output(["git", "show", f"{commit}:{target}"])
          if Path(target).read_bytes() != reviewed:
              raise RuntimeError("Mail critic changed after review")
          previous = subprocess.check_output(["git", "show", f"{commit}^1:{target}"])
          rollout.EXPECTED_OLD = {target: hashlib.sha256(previous).hexdigest()}
          rollout.NEW_URL = "/owner-mail/api/company-search/providers"
          discover = rollout.discover

          def mail_worker_only(ssh):
              workers = [
                  row for row in discover(ssh)
                  if "web.api.routes.mail_campaign_worker" in row[1]
                  and "," not in row[0] and row[0].endswith(".service")
                  and row[0] != rollout.WEB_UNIT
              ]
              if len({row[0] for row in workers}) != 1:
                  raise RuntimeError("Expected a single dedicated Mail worker unit")
              return workers

          rollout.discover = mail_worker_only
          rollout.main()
          PY
