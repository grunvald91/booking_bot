name: BookingBot classify six server source deltas
on:
  push:
    branches: [ops/production-parity-audit-20261105]
    paths: [.github/workflows/booking-parity-classify.yml]
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/production-parity-audit-20261105
          fetch-depth: 0
      - name: Install pinned SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Classify production source changes without editing server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync_server_source.py
          cp scripts/ops/classify_production_source_20261105.py "$RUNNER_TEMP/classify_production.py"
          git checkout --detach f1529d1bf4960b5e0ad282f05eb9f651faf1cb36
          python3 "$RUNNER_TEMP/classify_production.py"
