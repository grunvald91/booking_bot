name: Deploy ServGo studio sign-in and schedule (scoped)
# Manual only. apply=false is a read-only preflight (nothing on the server changes).
# apply=true: migration, scoped patch of three diverged files + two new route files, restart, health, rollback on failure.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Change production (false = read-only preflight)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: servgo-studio-backend-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check pytest 'paramiko==3.5.1'
      - name: Verify the production patch locally
        run: python -m pytest -q tests/test_studio_backend_deploy.py
      - name: Roll out (or preflight) and verify
        run: python scripts/deploy_studio_backend.py
