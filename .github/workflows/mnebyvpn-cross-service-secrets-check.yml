name: Check cross-service SSH readiness (no secret values)
on:
  push:
    branches: [feat/reviewed-mnebyvpn-mail-rebased-20261107]
    paths: ['.github/workflows/mnebyvpn-cross-service-secrets-check.yml']
permissions:
  contents: read
jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VPS188_PASSWORD: ${{ secrets.SERVER188_SSH_PASSWORD }}
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Report ONLY credential availability, never values
        shell: bash
        run: |
          if [[ -n "$VPS188_PASSWORD" ]]; then echo 'vps188_secret_in_servgo_repo=true'; else echo 'vps188_secret_in_servgo_repo=false'; fi
          if [[ -n "$SERVGO_PASSWORD" ]]; then echo 'servgo_secret_in_servgo_repo=true'; else echo 'servgo_secret_in_servgo_repo=false'; fi
