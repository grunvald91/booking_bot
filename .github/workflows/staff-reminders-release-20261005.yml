name: Staff reminders production audit

on:
  push:
    branches: [ops/staff-reminders-release-20261005]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Suppress demo reminders and audit recipients
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time, paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set -e
          cd /opt/booking_bot
          ./venv/bin/python - <<'AUDIT'
          import asyncio
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from sqlalchemy import text
          from database.database import async_session_maker

          async def main():
              async with async_session_maker() as s:
                  demo=await s.execute(text("""
                    UPDATE bookings b
                    SET reminder_24h_sent=TRUE,
                        reminder_2h_sent=TRUE,
                        staff_reminder_24h_sent=TRUE,
                        staff_reminder_2h_sent=TRUE
                    FROM users u
                    WHERE b.client_id=u.id
                      AND u.telegram_id BETWEEN -880026100048 AND -880026100001
                    RETURNING b.id
                  """))
                  demo_count=len(demo.all())
                  await s.commit()

                  owner_push=(await s.execute(text("""
                    SELECT COUNT(DISTINCT ps.id)
                    FROM push_subscriptions ps
                    WHERE ps.is_active=TRUE
                      AND (
                        EXISTS(SELECT 1 FROM businesses b WHERE b.owner_id=ps.user_id)
                        OR EXISTS(SELECT 1 FROM business_owners bo WHERE bo.user_id=ps.user_id)
                      )
                  """))).scalar() or 0

                  master_telegram=(await s.execute(text("""
                    SELECT COUNT(*) FROM employees
                    WHERE is_active=TRUE AND telegram_id IS NOT NULL AND telegram_id>0
                  """))).scalar() or 0

                  master_push=(await s.execute(text("""
                    SELECT COUNT(DISTINCT ps.id)
                    FROM employees e
                    JOIN users u ON u.telegram_id=e.telegram_id
                    JOIN push_subscriptions ps ON ps.user_id=u.id AND ps.is_active=TRUE
                    WHERE e.is_active=TRUE AND e.telegram_id IS NOT NULL AND e.telegram_id>0
                  """))).scalar() or 0

                  now=datetime.now(ZoneInfo('Europe/Moscow')).replace(tzinfo=None)
                  due=(await s.execute(text("""
                    SELECT COUNT(*)
                    FROM bookings b
                    JOIN users u ON u.id=b.client_id
                    WHERE b.status IN ('pending','confirmed','prepayment_sent','prepayment_confirmed')
                      AND (b.booking_date + b.booking_time) > :now
                      AND (b.booking_date + b.booking_time) <= :horizon
                      AND NOT (u.telegram_id BETWEEN -880026100048 AND -880026100001)
                  """),{'now':now,'horizon':now+timedelta(hours=24)})).scalar() or 0

                  cols=(await s.execute(text("""
                    SELECT COUNT(*) FROM information_schema.columns
                    WHERE table_name='bookings'
                      AND column_name IN ('staff_reminder_24h_sent','staff_reminder_2h_sent')
                  """))).scalar() or 0

                  print('staff_columns='+str(cols))
                  print('demo_rows_suppressed='+str(demo_count))
                  print('owner_push_subscriptions='+str(owner_push))
                  print('masters_with_telegram='+str(master_telegram))
                  print('master_push_subscriptions='+str(master_push))
                  print('real_bookings_next_24h='+str(due))
          asyncio.run(main())
          AUDIT
          systemctl is-active booking-bot.service
          curl -fsS --max-time 8 https://servgo.ru/api/health >/dev/null
          echo audit_status=success
          '''
          _,out,err=ssh.exec_command(cmd,timeout=90)
          print(out.read().decode('utf-8','replace'))
          status=out.channel.recv_exit_status()
          if status:
              print(err.read().decode('utf-8','replace')[-1500:])
              raise SystemExit(status)
          ssh.close()
          PY
