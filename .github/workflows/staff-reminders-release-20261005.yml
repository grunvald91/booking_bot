name: Staff reminders live delivery check

on:
  push:
    branches: [ops/staff-reminders-release-20261005]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Run scheduler once and inspect flags
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time, paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set -e
          cd /opt/booking_bot
          ./venv/bin/python - <<'CHECK'
          import asyncio, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from aiogram import Bot
          from sqlalchemy import text
          from dotenv import load_dotenv
          from database.database import async_session_maker
          from bot.services.notifications import check_and_send_reminders

          load_dotenv('/opt/booking_bot/.env')

          async def main():
              bot=Bot(token=os.environ['BOT_TOKEN'])
              try:
                  await check_and_send_reminders(bot)
              finally:
                  await bot.session.close()

              now=datetime.now(ZoneInfo('Europe/Moscow')).replace(tzinfo=None)
              async with async_session_maker() as s:
                  rows=(await s.execute(text("""
                    SELECT b.id,b.reminder_24h_sent,b.reminder_2h_sent,
                           b.staff_reminder_24h_sent,b.staff_reminder_2h_sent,
                           b.booking_date,b.booking_time
                    FROM bookings b
                    JOIN users u ON u.id=b.client_id
                    WHERE b.status IN ('pending','confirmed','prepayment_sent','prepayment_confirmed')
                      AND (b.booking_date+b.booking_time) > :now
                      AND (b.booking_date+b.booking_time) <= :horizon
                      AND NOT (u.telegram_id BETWEEN -880026100048 AND -880026100001)
                    ORDER BY b.booking_date,b.booking_time
                  """),{'now':now,'horizon':now+timedelta(hours=24)})).mappings().all()
                  print('real_due_rows='+str(len(rows)))
                  for row in rows:
                      print(
                        'booking='+str(row['id'])
                        +' client24='+str(row['reminder_24h_sent'])
                        +' client2='+str(row['reminder_2h_sent'])
                        +' staff24='+str(row['staff_reminder_24h_sent'])
                        +' staff2='+str(row['staff_reminder_2h_sent'])
                      )
          asyncio.run(main())
          CHECK
          '''
          _,out,err=ssh.exec_command(cmd,timeout=120)
          print(out.read().decode('utf-8','replace'))
          status=out.channel.recv_exit_status()
          if status:
              print(err.read().decode('utf-8','replace')[-1600:])
              raise SystemExit(status)
          ssh.close()
          PY
