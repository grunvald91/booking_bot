name: Staff reminder recipient audit

on:
  push:
    branches: [ops/staff-reminders-release-20261005]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Audit booking 2751 recipients
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time, paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set -e
          cd /opt/booking_bot
          ./venv/bin/python - <<'AUDIT'
          import asyncio
          from sqlalchemy import text
          from database.database import async_session_maker

          async def main():
              async with async_session_maker() as s:
                  row=(await s.execute(text("""
                    SELECT b.business_id,b.employee_id,b.staff_reminder_2h_sent
                    FROM bookings b WHERE b.id=2751
                  """))).mappings().one()

                  owner_tg=(await s.execute(text("""
                    SELECT COUNT(DISTINCT u.id)
                    FROM users u
                    WHERE u.telegram_id>0
                      AND (
                        EXISTS(SELECT 1 FROM businesses b WHERE b.id=:bid AND b.owner_id=u.id)
                        OR EXISTS(SELECT 1 FROM business_owners bo WHERE bo.business_id=:bid AND bo.user_id=u.id)
                      )
                  """),{'bid':row['business_id']})).scalar() or 0

                  owner_push=(await s.execute(text("""
                    SELECT COUNT(DISTINCT ps.id)
                    FROM push_subscriptions ps
                    WHERE ps.is_active=TRUE
                      AND (
                        EXISTS(SELECT 1 FROM businesses b WHERE b.id=:bid AND b.owner_id=ps.user_id)
                        OR EXISTS(SELECT 1 FROM business_owners bo WHERE bo.business_id=:bid AND bo.user_id=ps.user_id)
                      )
                  """),{'bid':row['business_id']})).scalar() or 0

                  master_tg=(await s.execute(text("""
                    SELECT CASE WHEN telegram_id IS NOT NULL AND telegram_id>0 THEN 1 ELSE 0 END
                    FROM employees WHERE id=:eid
                  """),{'eid':row['employee_id']})).scalar() or 0

                  master_push=(await s.execute(text("""
                    SELECT COUNT(DISTINCT ps.id)
                    FROM employees e
                    JOIN users u ON u.telegram_id=e.telegram_id
                    JOIN push_subscriptions ps ON ps.user_id=u.id AND ps.is_active=TRUE
                    WHERE e.id=:eid
                  """),{'eid':row['employee_id']})).scalar() or 0

                  print('staff2_flag='+str(row['staff_reminder_2h_sent']))
                  print('owner_telegram_targets='+str(owner_tg))
                  print('owner_push_targets='+str(owner_push))
                  print('master_telegram_target='+str(master_tg))
                  print('master_push_targets='+str(master_push))
          asyncio.run(main())
          AUDIT
          '''
          _,out,err=ssh.exec_command(cmd,timeout=60)
          print(out.read().decode('utf-8','replace'))
          status=out.channel.recv_exit_status()
          if status:
              print(err.read().decode('utf-8','replace')[-1200:])
              raise SystemExit(status)
          ssh.close()
          PY
