name: Staff reminders release

on:
  push:
    branches: [ops/staff-reminders-release-20261005]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Pack
        run: |
          tar -czf /tmp/release.tgz database/models.py bot/services/notifications.py bot/services/webpush.py web/api/routes/client.py web/api/routes/admin.py migrations/add_staff_reminder_fields.sql web/frontend/dist
      - name: Install SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Deploy
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time, paramiko
          HOST='155.212.162.47'
          ROOT='/opt/booking_bot'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          stage=ROOT+'/.release_staging/staff-reminders-93f2451c'
          ssh.exec_command("mkdir -p "+stage,timeout=10)[1].channel.recv_exit_status()
          sftp=ssh.open_sftp(); sftp.put('/tmp/release.tgz',stage+'/release.tgz'); sftp.close()
          cmd=r'''set -Eeuo pipefail
          ROOT=/opt/booking_bot
          STAGE=$ROOT/.release_staging/staff-reminders-93f2451c
          PAYLOAD=$STAGE/payload
          BACKUP=$ROOT/.release_backups/staff-reminders-93f2451c-$(date +%Y%m%d-%H%M%S)
          rm -rf "$PAYLOAD"; mkdir -p "$PAYLOAD" "$BACKUP"
          tar -xzf "$STAGE/release.tgz" -C "$PAYLOAD"
          for f in database/models.py bot/services/notifications.py bot/services/webpush.py web/api/routes/client.py web/api/routes/admin.py; do
            mkdir -p "$BACKUP/$(dirname "$f")"
            cp -a "$ROOT/$f" "$BACKUP/$f"
          done
          cp -a "$ROOT/web/frontend/dist" "$BACKUP/frontend-dist"
          cd "$ROOT"
          STAGE_PAYLOAD="$PAYLOAD" ./venv/bin/python - <<'MIG'
          import asyncio, os, asyncpg
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv('/opt/booking_bot/.env')
          async def main():
              conn=await asyncpg.connect(host=os.getenv('DB_HOST','localhost'),port=int(os.getenv('DB_PORT','5432')),user=os.getenv('DB_USER','postgres'),password=os.getenv('DB_PASSWORD',''),database=os.getenv('DB_NAME','booking_bot'))
              try:
                  await conn.execute((Path(os.environ['STAGE_PAYLOAD'])/'migrations'/'add_staff_reminder_fields.sql').read_text())
              finally: await conn.close()
          asyncio.run(main())
          MIG
          for f in database/models.py bot/services/notifications.py bot/services/webpush.py web/api/routes/client.py web/api/routes/admin.py; do install -m 0644 "$PAYLOAD/$f" "$ROOT/$f"; done
          rm -rf "$ROOT/web/frontend/dist"
          cp -a "$PAYLOAD/web/frontend/dist" "$ROOT/web/frontend/dist"
          ./venv/bin/python -m py_compile database/models.py bot/services/notifications.py bot/services/webpush.py web/api/routes/client.py web/api/routes/admin.py
          systemctl restart booking-web-api.service
          systemctl restart booking-bot.service
          sleep 4
          test "$(systemctl is-active booking-web-api.service)" = active
          test "$(systemctl is-active booking-bot.service)" = active
          curl -fsS --max-time 8 http://127.0.0.1:8000/health >/dev/null
          curl -fsS --max-time 10 https://servgo.ru/api/health >/dev/null
          echo release_status=success
          echo backup_dir=$BACKUP
          '''
          _,out,err=ssh.exec_command(cmd,timeout=300)
          print(out.read().decode('utf-8','replace'))
          status=out.channel.recv_exit_status()
          if status:
              print(err.read().decode('utf-8','replace')[-1800:])
              raise SystemExit(status)
          ssh.close()
          PY
