name: MNEBYVPN email gateway safety
on:
  push:
    branches:
      - feat/mnebyvpn-otp-mail-gateway-20261106
  pull_request:
    branches:
      - main
    paths:
      - web/api/routes/mnebyvpn_mail.py
      - bot/services/email_notifications.py
      - database/models.py
      - tests/test_mnebyvpn_mail.py
      - .github/workflows/mnebyvpn-email-gateway-ci.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt -r web/api/requirements.txt aiosqlite
      - name: Compile modules
        run: python -m py_compile web/api/routes/mnebyvpn_mail.py database/models.py bot/services/email_notifications.py tests/test_mnebyvpn_mail.py
      - name: Run isolated mail relay tests
        env:
          BOT_TOKEN: test-token
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p test_mnebyvpn_mail.py -v
