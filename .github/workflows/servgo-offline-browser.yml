name: ServGo installed PWA offline browser smoke
on:
  pull_request:
    paths:
      - 'web/frontend/**'
      - 'scripts/check_servgo_offline_pwa_browser.py'
      - '.github/workflows/servgo-offline-browser.yml'
permissions:
  contents: read
jobs:
  offline-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Build the complete React PWA
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify cold start and saved booking offline
        run: python scripts/check_servgo_offline_pwa_browser.py
