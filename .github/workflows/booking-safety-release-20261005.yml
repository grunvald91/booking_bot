name: ServGo booking safety production release

on:
  push:
    branches:
      - ops/booking-safety-release-20261005

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Pack release
        run: |
          tar -czf /tmp/booking-safety-release.tgz \
            booking_intervals.py \
            database/models.py \
            database/booking_safety.py \
            database/crud.py \
            requirements.txt \
            web/api/routes/client.py \
            web/api/routes/admin.py \
            web/api/rental.py \
            migrations/add_booking_overlap_constraint.sql \
            web/frontend/dist

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Deploy with backup and rollback
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko

          HOST='155.212.162.47'
          ROOT='/opt/booking_bot'
          RELEASE='booking-safety-e25726b'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  actual=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if actual!=FP:
                      raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)

          ssh=None
          for attempt in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2: raise
                  time.sleep(3)

          stage=f'{ROOT}/.release_staging/{RELEASE}'
          _,out,err=ssh.exec_command(f"mkdir -p '{stage}' && chmod 700 '{stage}'",timeout=15)
          if out.channel.recv_exit_status()!=0:
              raise SystemExit(err.read().decode('utf-8','replace')[-800:])

          sftp=ssh.open_sftp()
          try:
              sftp.put('/tmp/booking-safety-release.tgz',stage+'/release.tgz')
          finally:
              sftp.close()

          cmd=r'''set -Eeuo pipefail
          ROOT=/opt/booking_bot
          RELEASE=booking-safety-e25726b
          STAGE="$ROOT/.release_staging/$RELEASE"
          PAYLOAD="$STAGE/payload"
          BACKUP="$ROOT/.release_backups/$RELEASE-$(date +%Y%m%d-%H%M%S)"
          TARGETS=(
            booking_intervals.py
            database/models.py
            database/booking_safety.py
            database/crud.py
            requirements.txt
            web/api/routes/client.py
            web/api/routes/admin.py
            web/api/rental.py
          )

          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD" "$BACKUP"
          chmod 700 "$BACKUP"
          tar -xzf "$STAGE/release.tgz" -C "$PAYLOAD"

          echo "release=$RELEASE"
          echo "backup_dir=$BACKUP"

          : > "$BACKUP/absent.txt"
          for f in "${TARGETS[@]}"; do
            if [ -f "$ROOT/$f" ]; then
              mkdir -p "$BACKUP/files/$(dirname "$f")"
              cp -a "$ROOT/$f" "$BACKUP/files/$f"
            else
              echo "$f" >> "$BACKUP/absent.txt"
            fi
          done
          if [ -d "$ROOT/web/frontend/dist" ]; then
            mkdir -p "$BACKUP/files/web/frontend"
            cp -a "$ROOT/web/frontend/dist" "$BACKUP/files/web/frontend/dist"
          fi

          cd "$ROOT"
          ./venv/bin/python - <<'SCHEMA_PY'
          import os, subprocess
          from dotenv import load_dotenv
          load_dotenv('/opt/booking_bot/.env')
          env=os.environ.copy()
          env['PGPASSWORD']=os.getenv('DB_PASSWORD','')
          cmd=['pg_dump','-h',os.getenv('DB_HOST','localhost'),'-p',os.getenv('DB_PORT','5432'),
               '-U',os.getenv('DB_USER','postgres'),'-d',os.getenv('DB_NAME','booking_bot'),
               '--schema-only','--no-owner','--no-privileges','-t','bookings']
          p=subprocess.run(cmd,env=env,capture_output=True,text=True,timeout=30)
          if p.returncode==0:
              open('/tmp/booking-safety-before.sql','w').write(p.stdout)
              print('schema_backup=ok')
          else:
              print('schema_backup=skipped')
          SCHEMA_PY
          if [ -f /tmp/booking-safety-before.sql ]; then
            mv /tmp/booking-safety-before.sql "$BACKUP/bookings-schema-before.sql"
            chmod 600 "$BACKUP/bookings-schema-before.sql"
          fi

          rollback() {
            code=$?
            trap - ERR
            echo "release_failed=yes exit=$code; rolling back code and schema additions"
            for f in "${TARGETS[@]}"; do
              if [ -f "$BACKUP/files/$f" ]; then
                mkdir -p "$ROOT/$(dirname "$f")"
                cp -a "$BACKUP/files/$f" "$ROOT/$f"
              fi
            done
            while IFS= read -r f; do [ -n "$f" ] && rm -f "$ROOT/$f"; done < "$BACKUP/absent.txt"
            if [ -d "$BACKUP/files/web/frontend/dist" ]; then
              rm -rf "$ROOT/web/frontend/dist"
              cp -a "$BACKUP/files/web/frontend/dist" "$ROOT/web/frontend/dist"
            fi

            ./venv/bin/python - <<'ROLLBACK_DB_PY' || true
          import asyncio, os
          import asyncpg
          from dotenv import load_dotenv
          load_dotenv('/opt/booking_bot/.env')
          async def run():
              conn=await asyncpg.connect(
                  host=os.getenv('DB_HOST','localhost'),
                  port=int(os.getenv('DB_PORT','5432')),
                  user=os.getenv('DB_USER','postgres'),
                  password=os.getenv('DB_PASSWORD',''),
                  database=os.getenv('DB_NAME','booking_bot'),
              )
              try:
                  await conn.execute("""
                    ALTER TABLE bookings DROP CONSTRAINT IF EXISTS bookings_no_active_resource_overlap;
                    DROP INDEX IF EXISTS ix_bookings_resource_day_active;
                    ALTER TABLE bookings DROP COLUMN IF EXISTS occupies_resource;
                    ALTER TABLE bookings DROP COLUMN IF EXISTS resource_duration_minutes;
                  """)
                  print('schema_additions_rolled_back=yes')
              finally:
                  await conn.close()
          asyncio.run(run())
          ROLLBACK_DB_PY

            systemctl restart booking-web-api.service || true
            systemctl restart booking-bot.service || true
            for i in $(seq 1 12); do
              if curl -fsS --max-time 2 http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
              sleep 1
            done
            printf 'rollback_api='; curl -sS --max-time 3 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/health || true
            printf 'rollback_bot='; systemctl is-active booking-bot.service || true
            exit "$code"
          }
          trap rollback ERR

          echo '--- dependency prerequisite ---'
          ./venv/bin/pip install --disable-pip-version-check 'SQLAlchemy[asyncio]>=2.0.25'

          echo '--- apply booking overlap migration ---'
          STAGE_PAYLOAD="$PAYLOAD" ./venv/bin/python - <<'MIG_PY'
          import asyncio, os
          from pathlib import Path
          import asyncpg
          from dotenv import load_dotenv
          load_dotenv('/opt/booking_bot/.env')
          async def run():
              conn=await asyncpg.connect(
                  host=os.getenv('DB_HOST','localhost'),
                  port=int(os.getenv('DB_PORT','5432')),
                  user=os.getenv('DB_USER','postgres'),
                  password=os.getenv('DB_PASSWORD',''),
                  database=os.getenv('DB_NAME','booking_bot'),
              )
              try:
                  sql=(Path(os.environ['STAGE_PAYLOAD'])/'migrations'/'add_booking_overlap_constraint.sql').read_text()
                  await conn.execute(sql)
                  print('migration=ok')
              finally:
                  await conn.close()
          asyncio.run(run())
          MIG_PY

          echo '--- activate source and frontend ---'
          for f in "${TARGETS[@]}"; do
            mkdir -p "$ROOT/$(dirname "$f")"
            install -m 0644 "$PAYLOAD/$f" "$ROOT/$f"
          done
          rm -rf "$ROOT/web/frontend/dist.new-$RELEASE"
          cp -a "$PAYLOAD/web/frontend/dist" "$ROOT/web/frontend/dist.new-$RELEASE"
          rm -rf "$ROOT/web/frontend/dist"
          mv "$ROOT/web/frontend/dist.new-$RELEASE" "$ROOT/web/frontend/dist"

          echo '--- compile/import validation ---'
          ./venv/bin/python -m py_compile \
            booking_intervals.py \
            database/models.py database/booking_safety.py database/crud.py \
            web/api/rental.py web/api/routes/client.py web/api/routes/admin.py
          ./venv/bin/python - <<'IMPORT_PY'
          from database.booking_safety import ACTIVE_BOOKING_STATUSES, intervals_overlap
          from web.api.main import app
          assert 'confirmed' in ACTIVE_BOOKING_STATUSES
          print('imports=ok')
          IMPORT_PY

          echo '--- restart services ---'
          systemctl restart booking-web-api.service
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null

          systemctl restart booking-bot.service
          sleep 3
          test "$(systemctl is-active booking-bot.service)" = active

          echo '--- verify schema safety ---'
          ./venv/bin/python - <<'VERIFY_PY'
          import asyncio
          from sqlalchemy import text
          from database.database import async_session_maker
          async def run():
              async with async_session_maker() as s:
                  cols=set((await s.execute(text(
                      "select column_name from information_schema.columns where table_name='bookings'"
                  ))).scalars().all())
                  assert 'resource_duration_minutes' in cols
                  assert 'occupies_resource' in cols
                  exists=bool((await s.execute(text(
                      "select exists(select 1 from pg_constraint where conname='bookings_no_active_resource_overlap')"
                  ))).scalar())
                  assert exists
                  overlaps=(await s.execute(text("""
                    with active as (
                      select id,employee_id,booking_date,booking_time,resource_duration_minutes
                      from bookings
                      where employee_id is not null
                        and occupies_resource
                        and status in ('pending','confirmed','pending_prepayment','prepayment_sent','prepayment_confirmed')
                    )
                    select count(*)
                    from active a join active b
                      on a.id < b.id
                     and a.employee_id=b.employee_id
                     and tsrange(a.booking_date+a.booking_time,
                                 a.booking_date+a.booking_time+a.resource_duration_minutes*interval '1 minute','[)')
                         &&
                         tsrange(b.booking_date+b.booking_time,
                                 b.booking_date+b.booking_time+b.resource_duration_minutes*interval '1 minute','[)')
                  """))).scalar()
                  print('active_overlap_pairs='+str(overlaps))
                  assert overlaps == 0
          asyncio.run(run())
          print('schema_safety=ok')
          VERIFY_PY

          echo '--- public smoke ---'
          curl -fsS --max-time 10 https://servgo.ru/api/health >/dev/null
          curl -fsS --max-time 10 https://servgo.ru/ >/dev/null
          echo 'public_api=200'
          echo 'frontend=200'
          printf '%s\n' 'e25726b89fb3984ae298c078beb15f3c6dbb0cf8' > "$ROOT/.release_version"

          trap - ERR
          echo 'release_status=success'
          printf 'api_service='; systemctl is-active booking-web-api.service
          printf 'bot_service='; systemctl is-active booking-bot.service
          echo "backup_retained=$BACKUP"
          '''
          _,out,err=ssh.exec_command(cmd,timeout=600)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print('stderr_suffix='+stderr[-3000:])
              raise SystemExit(status)
          ssh.close()
          PY
