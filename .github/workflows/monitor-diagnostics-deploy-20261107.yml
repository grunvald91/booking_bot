name: Deploy ServGo monitor detailed Telegram incident alerts (server 155)
on:
  push:
    branches: ['ops/incident-readonly-20261107']
    paths: ['.github/workflows/monitor-diagnostics-deploy-20261107.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servgo-monitor-diag-20261107
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: 155.212.162.47
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Checkout patch and offline tests
        uses: actions/checkout@v4
      - name: Syntax-check patcher and test before accessing server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/monitor_diagnostics_20261107_patch.py
          python3 -m py_compile ops/test_monitor_diagnostics_20261107.py
          test -n "$SSHPASS" || { echo '::error::Missing server SSH access'; exit 2; }
      - name: Install SSH client
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -qq -y sshpass
      - name: Upload patch and tests (do not touch running monitor yet)
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          sshpass -e scp "${opts[@]}" \
             ops/monitor_diagnostics_20261107_patch.py "root@$HOST:/tmp/servgo-monitor-patch-$GITHUB_SHA.py"
          sshpass -e scp "${opts[@]}" \
             ops/test_monitor_diagnostics_20261107.py "root@$HOST:/tmp/servgo-monitor-test-$GITHUB_SHA.py"
      - name: Test candidate, backup, atomically deploy, test live, and rollback on error
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o ConnectTimeout=12 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          sshpass -e ssh "${opts[@]}" "root@$HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          short="${sha:0:10}"
          live=/opt/booking_bot/ops/servgo_monitor.py
          patcher="/tmp/servgo-monitor-patch-$sha.py"
          tests="/tmp/servgo-monitor-test-$sha.py"
          backup="${live}.backup-monitor-diag-${short}"
          candidate="$(mktemp --tmpdir=/opt/booking_bot/ops --suffix=.py '.servgo_monitor_diag.XXXXXXXX')"
          rollback_needed=0
          cleanup() {
            code=$?
            if [ "$rollback_needed" = 1 ]; then
              echo "::error::Post-install verification failed, restoring existing monitor"
              cp -p "$backup" "$live" || true
            fi
            rm -f "$patcher" "$tests" "$candidate"
            exit "$code"
          }
          trap cleanup EXIT
          test -f "$live"
          test ! -e "$backup" || { echo 'Backup already exists, refusing overwrite'; exit 2; }
          echo 'Prepare candidate from the existing production monitor'
          python3 "$patcher" "$live" "$candidate"
          python3 -m py_compile "$candidate"
          echo 'Run isolated offline tests against candidate; no Telegram delivery'
          python3 "$tests" "$candidate"
          cp -p "$live" "$backup"
          chmod --reference="$live" "$candidate"
          chown --reference="$live" "$candidate"
          mv -f "$candidate" "$live"
          rollback_needed=1
          echo 'Run isolated offline tests against installed file'
          python3 "$tests" "$live"
          echo 'Read-only status smoke test (no Telegram, no state modification)'
          python3 "$live" --check > "/tmp/servgo-monitor-smoke-$sha.json" || true
          python3 - "/tmp/servgo-monitor-smoke-$sha.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          print('Monitor checks:',len(data),'healthy:',sum(bool(x['ok']) for x in data.values()))
          key=data.get('proxy:telegram-egress',{})
          print('Telegram egress test healthy:',key.get('ok'))
          print('Monitor still uses threshold-based alerting.')
          PY
          rm -f "/tmp/servgo-monitor-smoke-$sha.json"
          rollback_needed=0
          echo 'SUCCESS: production monitor upgraded atomically, no services restarted'
          echo "Backup retained: $backup"
          REMOTE
