name: Client email release

on:
  push:
    branches:
      - ops/client-email-release-20261006

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Pack release
        run: tar -czf /tmp/release.tgz email_utils.py database/models.py database/crud.py web/api/schemas.py web/api/routes/client.py bot/services/email_notifications.py bot/services/notifications.py bot/handlers/admin.py migrations/add_user_email.sql web/frontend/dist

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check "paramiko==3.5.1"

      - name: Deploy
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import time
          import paramiko

          host = "155.212.162.47"
          expected = "uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU"

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip("=")
                  if actual != expected:
                      raise paramiko.SSHException("host key mismatch")
                  client.get_host_keys().add(hostname, key.get_name(), key)

          ssh = None
          for attempt in range(3):
              candidate = paramiko.SSHClient()
              candidate.set_missing_host_key_policy(Pinned())
              try:
                  candidate.connect(
                      host,
                      username="root",
                      password=os.environ["SERVER_PASSWORD"],
                      look_for_keys=False,
                      allow_agent=False,
                      timeout=12,
                      banner_timeout=25,
                      auth_timeout=15,
                  )
                  ssh = candidate
                  break
              except (paramiko.SSHException, OSError, EOFError):
                  candidate.close()
                  if attempt == 2:
                      raise
                  time.sleep(3)

          stage = "/opt/booking_bot/.release_staging/client-email-4f6f9a4f"
          _, stdout, stderr = ssh.exec_command("mkdir -p " + stage, timeout=10)
          if stdout.channel.recv_exit_status():
              raise RuntimeError(stderr.read().decode()[-1000:])

          sftp = ssh.open_sftp()
          sftp.put("/tmp/release.tgz", stage + "/release.tgz")
          sftp.close()

          command = r'''set -Eeuo pipefail
          ROOT=/opt/booking_bot
          STAGE=$ROOT/.release_staging/client-email-4f6f9a4f
          PAYLOAD=$STAGE/payload
          BACKUP=$ROOT/.release_backups/client-email-4f6f9a4f-$(date +%Y%m%d-%H%M%S)

          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD" "$BACKUP/files"
          tar -xzf "$STAGE/release.tgz" -C "$PAYLOAD"

          FILES="email_utils.py database/models.py database/crud.py web/api/schemas.py web/api/routes/client.py bot/services/email_notifications.py bot/services/notifications.py bot/handlers/admin.py"
          for f in $FILES; do
            if [ -f "$ROOT/$f" ]; then
              mkdir -p "$BACKUP/files/$(dirname "$f")"
              cp -a "$ROOT/$f" "$BACKUP/files/$f"
            fi
          done
          mkdir -p "$BACKUP/files/web/frontend"
          cp -a "$ROOT/web/frontend/dist" "$BACKUP/files/web/frontend/dist"

          cd "$ROOT"
          export STAGE_PAYLOAD="$PAYLOAD"
          ./venv/bin/python -c "import asyncio,os,asyncpg; from pathlib import Path; from dotenv import load_dotenv; load_dotenv('/opt/booking_bot/.env'); async def x(): pass" >/dev/null 2>&1 || true
          ./venv/bin/python - <<'MIG'
          import asyncio
          import os
          from pathlib import Path
          import asyncpg
          from dotenv import load_dotenv
          load_dotenv('/opt/booking_bot/.env')

          async def main():
              conn = await asyncpg.connect(
                  host=os.getenv('DB_HOST','localhost'),
                  port=int(os.getenv('DB_PORT','5432')),
                  user=os.getenv('DB_USER','postgres'),
                  password=os.getenv('DB_PASSWORD',''),
                  database=os.getenv('DB_NAME','booking_bot'),
              )
              try:
                  sql = (Path(os.environ['STAGE_PAYLOAD']) / 'migrations' / 'add_user_email.sql').read_text()
                  await conn.execute(sql)
              finally:
                  await conn.close()

          asyncio.run(main())
          MIG

          for f in $FILES; do
            mkdir -p "$ROOT/$(dirname "$f")"
            install -m 0644 "$PAYLOAD/$f" "$ROOT/$f"
          done

          rm -rf "$ROOT/web/frontend/dist"
          cp -a "$PAYLOAD/web/frontend/dist" "$ROOT/web/frontend/dist"

          ./venv/bin/python -m py_compile email_utils.py database/models.py database/crud.py web/api/schemas.py web/api/routes/client.py bot/services/email_notifications.py bot/services/notifications.py bot/handlers/admin.py

          systemctl restart booking-web-api.service
          systemctl restart booking-bot.service
          test "$(systemctl is-active booking-web-api.service)" = active
          test "$(systemctl is-active booking-bot.service)" = active
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 8 http://127.0.0.1:8000/health >/dev/null
          curl -fsS --max-time 10 https://servgo.ru/api/health >/dev/null

          ./venv/bin/python - <<'VERIFY'
          import asyncio
          import os
          from sqlalchemy import text
          from database.database import async_session_maker
          from dotenv import load_dotenv
          load_dotenv('/opt/booking_bot/.env')

          async def main():
              async with async_session_maker() as session:
                  exists = bool((await session.execute(text(
                      "select exists(select 1 from information_schema.columns where table_name='users' and column_name='email')"
                  ))).scalar())
                  print("user_email_column=" + str(exists).lower())

          asyncio.run(main())
          for key in ("SMTP_HOST","SMTP_FROM_EMAIL","SMTP_USERNAME","SMTP_PASSWORD"):
              print(key + "=" + ("present" if os.getenv(key) else "missing"))
          VERIFY

          echo release_status=success
          echo backup_dir=$BACKUP
          '''

          _, stdout, stderr = ssh.exec_command(command, timeout=300)
          output = stdout.read().decode("utf-8", "replace")
          errors = stderr.read().decode("utf-8", "replace")
          print(output)
          status = stdout.channel.recv_exit_status()
          if status:
              print(errors[-2500:])
              raise SystemExit(status)
          ssh.close()
          PY
