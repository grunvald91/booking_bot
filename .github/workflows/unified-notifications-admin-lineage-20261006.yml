name: ServGo admin source lineage audit

on:
  push:
    branches:
      - ops/unified-notifications-release-20261006

permissions:
  contents: read

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Identify production admin.py lineage
        shell: bash
        run: |
          python - <<'PY'
          import base64, difflib, hashlib, os, subprocess, time
          import paramiko

          HOST='155.212.162.47'; ROOT='/opt/booking_bot'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          PATH='web/api/routes/admin.py'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  actual=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if actual!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          sftp=ssh.open_sftp()
          with sftp.open(ROOT+'/'+PATH,'rb') as f: server=f.read()
          sftp.close(); ssh.close()
          server_sha=hashlib.sha256(server).hexdigest()
          print('server_sha256='+server_sha)

          commits=subprocess.check_output(['git','rev-list','--all','--',PATH]).decode().splitlines()
          matches=[]
          for commit in commits:
              try: data=subprocess.check_output(['git','show',f'{commit}:{PATH}'],stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError: continue
              if hashlib.sha256(data).hexdigest()==server_sha:
                  msg=subprocess.check_output(['git','show','-s','--format=%s',commit]).decode().strip()
                  matches.append((commit,msg))
          if matches:
              for commit,msg in matches[:10]: print('history_match='+commit+' '+msg)
          else:
              print('history_match=NONE')

          baseline=subprocess.check_output(['git','show','a1eec94ec04632144d89b6b2a66bc1ed8e6e4f1a:'+PATH]).decode('utf-8','replace').splitlines()
          srv=server.decode('utf-8','replace').splitlines()
          diff=list(difflib.unified_diff(baseline,srv,fromfile='a1eec94',tofile='production',n=4))
          print('DIFF_BEGIN')
          for line in diff:
              low=line.lower()
              if any(k in low for k in ('password','token =','token=','secret','api_key','private_key')):
                  print('[REDACTED]')
              else:
                  print(line)
          print('DIFF_END')
          PY
