name: Deploy only booking-bot private Bot API route
on:
  workflow_dispatch:
    inputs:
      recover_lifecycle:
        description: Recover port 8080 by updating the installed relay drop-in
        type: boolean
        default: false
  push:
    branches: ['fix/bookingbot-relay-lifecycle-20261124']
    paths: ['.github/workflows/servgo-bot-relay89-deploy.yml']
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify lifecycle configuration
        if: github.event_name == 'push' || inputs.recover_lifecycle
        run: python -m unittest discover -s tests -p test_bookingbot_relay_lifecycle.py
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Backup bot, verify Bot API through SOCKS, then start bot
        if: github.event_name == 'workflow_dispatch' && !inputs.recover_lifecycle
        env:
          SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        run: python scripts/deploy_bot_relay89.py
      - name: Apply BookingBot lifecycle drop-in and verify port 8080
        if: github.event_name == 'push' || inputs.recover_lifecycle
        env:
          SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        run: python scripts/deploy_bot_relay89.py --recover-lifecycle
