name: ServGo live client UX read-only check

on:
  push:
    branches:
      - audit/client-status-reschedule-live-20261005

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Check live status endpoint and reschedule availability
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko

          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  actual=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if actual != FP:
                      raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)

          ssh=None
          for attempt in range(3):
              client=paramiko.SSHClient()
              client.set_missing_host_key_policy(Pinned())
              try:
                  client.connect(
                      HOST, port=22, username='root',
                      password=os.environ['SERVER_PASSWORD'],
                      look_for_keys=False, allow_agent=False,
                      timeout=12, banner_timeout=25, auth_timeout=15,
                  )
                  ssh=client
                  break
              except (paramiko.SSHException,OSError,EOFError):
                  client.close()
                  if attempt == 2:
                      raise
                  time.sleep(3)

          cmd=r'''set -e
          cd /opt/booking_bot
          ./venv/bin/python - <<'CHECK_PY'
          import asyncio
          import httpx
          from sqlalchemy import select
          from database.database import async_session_maker
          from database.models import Booking, User

          ACTIVE=('pending','confirmed','pending_prepayment','prepayment_sent','prepayment_confirmed')

          async def main():
              async with async_session_maker() as session:
                  result=await session.execute(
                      select(Booking)
                      .join(User, User.id == Booking.client_id)
                      .where(
                          User.telegram_id >= -880026100048,
                          User.telegram_id <= -880026100001,
                          Booking.employee_id.is_not(None),
                          Booking.status.in_(ACTIVE),
                          Booking.notify_token.is_not(None),
                      )
                      .order_by(Booking.booking_date, Booking.booking_time)
                  )
                  rows=list(result.scalars().all())
                  assert rows, 'No seeded active bookings'

                  booking=next((b for b in rows if b.status == 'prepayment_sent'), rows[0])

                  async with httpx.AsyncClient(timeout=20, follow_redirects=True) as http:
                      status_resp=await http.get(
                          f'https://servgo.ru/api/bookings/by-token/{booking.notify_token}'
                      )
                      assert status_resp.status_code == 200, status_resp.text[:300]
                      status_data=status_resp.json()
                      assert status_data['status'] == booking.status
                      assert 'prepayment_confirmed' in status_data
                      assert 'duration_minutes' in status_data
                      print('public_status_api=200')
                      print('public_status_value='+status_data['status'])

                      shell=await http.get(
                          f'https://servgo.ru/b/{booking.notify_token}'
                      )
                      assert shell.status_code == 200
                      print('public_status_page=200')

                      slots_resp=await http.get(
                          f'https://servgo.ru/api/businesses/{booking.business_id}/slots',
                          params={
                              'service_id': booking.service_id,
                              'date': booking.booking_date.isoformat(),
                              'employee_id': booking.employee_id,
                              'duration_minutes': booking.resource_duration_minutes,
                              'include_unavailable': 'true',
                          },
                      )
                      assert slots_resp.status_code == 200, slots_resp.text[:300]
                      slots=slots_resp.json()
                      exact=next(
                          (slot for slot in slots
                           if slot['time'] == booking.booking_time.strftime('%H:%M')),
                          None,
                      )
                      assert exact is not None, 'Busy time missing from response'
                      assert exact['available'] is False, exact
                      assert any(slot['available'] for slot in slots)
                      print('busy_slot_visible=yes')
                      print('busy_slot_available=false')
                      print('free_slot_visible=yes')

                      own_resp=await http.get(
                          f'https://servgo.ru/api/businesses/{booking.business_id}/slots',
                          params={
                              'service_id': booking.service_id,
                              'date': booking.booking_date.isoformat(),
                              'employee_id': booking.employee_id,
                              'duration_minutes': booking.resource_duration_minutes,
                              'include_unavailable': 'true',
                              'exclude_booking_id': booking.id,
                          },
                      )
                      assert own_resp.status_code == 200
                      own_slots=own_resp.json()
                      own_exact=next(
                          (slot for slot in own_slots
                           if slot['time'] == booking.booking_time.strftime('%H:%M')),
                          None,
                      )
                      assert own_exact is not None
                      assert own_exact['available'] is True, own_exact
                      print('current_booking_excluded_on_reschedule=yes')

              print('live_readonly_check=success')

          asyncio.run(main())
          CHECK_PY
          '''
          _,out,err=ssh.exec_command(cmd,timeout=120)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print(stderr[-2500:])
              raise SystemExit(status)
          ssh.close()
          PY
