name: ServGo Mail V4 isolated real-server smoke
on:
  push:
    branches:
      - feature/mail-v3-bottom-ai-search-20261102
    paths:
      - '.github/workflows/mail-v4-server-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servgo-mail-v4-server-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only pinned SSH dependency
        run: python -m pip install --disable-pip-version-check paramiko
      - name: Check smoke scripts syntax
        run: |
          python -m py_compile scripts/mail_isolated_server_smoke.py scripts/probe_mail_search_server.py
      - name: Read-only API preflight and isolated five-card 2GIS + ClaudeHub smoke
        run: |
          python scripts/probe_mail_search_server.py
