name: ServGo mail daemon diagnose

on:
  push:
    branches: [ops/servgo-mail-server-20261006]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Diagnose
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''echo '--- status ---'
          systemctl status opendkim --no-pager -l || true
          echo '--- journal ---'
          journalctl -u opendkim.service -n 80 --no-pager || true
          echo '--- config check ---'
          opendkim -n 2>&1 || true
          echo '--- process/socket ---'
          ps aux | grep '[o]pendkim' || true
          ss -ltnp | grep 8891 || true
          echo '--- postfix ---'
          systemctl is-active postfix || true
          postconf -n | grep -E '^(myhostname|mydomain|myorigin|inet_interfaces|smtp_helo_name|.*milters)' || true
          '''
          _,o,e=s.exec_command(cmd,timeout=45)
          print(o.read().decode('utf-8','replace'))
          print(e.read().decode('utf-8','replace')[-1500:])
          s.close()
          PY
