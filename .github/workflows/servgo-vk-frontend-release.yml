name: ServGo VK ID frontend guarded release
on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy_servgo_frontend_atomic.py'
      - '.github/workflows/servgo-vk-frontend-release.yml'
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  vk-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Build ServGo frontend
        run: |
          set -euo pipefail
          cd web/frontend
          npm ci --legacy-peer-deps
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH client
        run: python -m pip install -q 'paramiko==3.5.1'
      - name: Enforce exact ORM semantic equivalence
        run: python -m unittest discover -s tests -p 'test_vk_frontend_ast_gate.py' -v
      - name: Atomic PWA release with server backend readiness, checksums, rollback
        run: python scripts/deploy_servgo_frontend_atomic.py
