name: Clear stale package lock
on:
  push:
    branches: [ops/mail-server-audit-20261006]
permissions:
  contents: read
jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,paramiko
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU': raise Exception('host key')
                  c.get_host_keys().add(h,k.get_name(),k)
          c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
          c.connect('155.212.162.47',username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False)
          cmd="systemctl stop unattended-upgrades.service 2>/dev/null || true; pkill -f 'unattended-upgrade-shutdown --wait-for-signal' 2>/dev/null || true; sleep 2; dpkg --audit || true; echo stale_lock_helper_cleared=yes"
          _,o,e=c.exec_command(cmd,timeout=30)
          print(o.read().decode()); print(e.read().decode())
          status=o.channel.recv_exit_status()
          c.close()
          raise SystemExit(status)
          PY