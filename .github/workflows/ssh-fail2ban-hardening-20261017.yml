name: SSH brute-force protection (fail2ban on 155 + relay 89)

# Owner asked on 2026-10-17. 155: ~2.2k failed SSH passwords/day, fail2ban banned 3 IPs (600 s ban).
# 89: ~9.7k/day, no fail2ban. Same sshd jail on both: 4 failures/hour -> 1 h ban, doubling for repeat
# offenders up to 1 week, aggressive mode. The two servers and Tailscale never ban each other.
# sshd: MaxAuthTries 3, LoginGraceTime 30. Password login stays on (155 deploys use it).
# Each sshd change is validated with `sshd -t` and rolled back if invalid.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/ssh-fail2ban-hardening-20261017.yml'

permissions:
  contents: read

concurrency:
  group: ssh-fail2ban-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Harden SSH on both servers
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,shlex,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          def run(cmd,timeout=600):
              _,o,e=s.exec_command(cmd,timeout=timeout)
              print(o.read().decode('utf-8','replace'))
              rc=o.channel.recv_exit_status()
              if rc:
                  print(e.read().decode('utf-8','replace')[-2500:]); raise SystemExit(rc)

          # Shared script; INSTALL=1 installs fail2ban first (relay 89).
          harden = r'''set -Eeuo pipefail
          echo "######## $(hostname) ########"
          if [ "${INSTALL:-0}" = 1 ] && ! command -v fail2ban-client >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq fail2ban >/dev/null
            echo "fail2ban installed: $(fail2ban-client --version | head -1)"
          fi
          install -d /etc/fail2ban/jail.d
          cat > /etc/fail2ban/jail.d/servgo-sshd.local <<'EOF'
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1 155.212.162.47 89.125.90.101 100.64.0.0/10
          backend = systemd
          banaction = nftables
          banaction_allports = nftables[type=allports]
          bantime.increment = true
          bantime.factor = 1
          bantime.maxtime = 1w

          [sshd]
          enabled = true
          mode = aggressive
          port = ssh
          maxretry = 4
          findtime = 1h
          bantime = 1h
          EOF
          sed -i 's/^[ \t]*//' /etc/fail2ban/jail.d/servgo-sshd.local
          fail2ban-client -t >/dev/null && echo "fail2ban config test: ok"
          systemctl enable fail2ban >/dev/null 2>&1 || true
          systemctl restart fail2ban
          sleep 3
          [ "$(systemctl is-active fail2ban)" = active ]
          echo "sshd jail: maxretry=$(fail2ban-client get sshd maxretry) findtime=$(fail2ban-client get sshd findtime) bantime=$(fail2ban-client get sshd bantime)"
          fail2ban-client get sshd ignoreip | tr '\n' ' '; echo
          echo "--- sshd limits"
          install -d /etc/ssh/sshd_config.d
          printf '%s\n' 'MaxAuthTries 3' 'LoginGraceTime 30' > /etc/ssh/sshd_config.d/50-servgo-limits.conf
          if sshd -t; then systemctl reload ssh 2>/dev/null || systemctl reload sshd; echo "sshd reloaded"; else rm -f /etc/ssh/sshd_config.d/50-servgo-limits.conf; echo "sshd -t failed, limits removed"; exit 4; fi
          sshd -T | grep -E '^(maxauthtries|logingracetime|passwordauthentication|pubkeyauthentication) ' | tr '\n' ' '; echo
          sleep 20
          fail2ban-client status sshd | grep -E 'Currently|Total'
          echo "OK_$(hostname)"
          '''
          harden = '\n'.join(l.strip() for l in harden.splitlines())
          run(harden)

          relay = 'INSTALL=1\nexport INSTALL\n' + harden
          run('timeout 400 ssh -i /root/.ssh/servgo_89_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes '
              '-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/booking-bot-relay89/known_hosts '
              '-o ConnectTimeout=8 root@89.125.90.101 ' + shlex.quote(relay), 450)
          # 155 -> 89 key login still works (bot tunnel and these workflows rely on it).
          run('timeout 30 ssh -i /root/.ssh/servgo_89_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes '
              '-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/booking-bot-relay89/known_hosts '
              '-o ConnectTimeout=8 root@89.125.90.101 "echo relay-ssh-from-155: ok"; '
              'echo "booking-bot-relay89=$(systemctl is-active booking-bot-relay89) booking-bot=$(systemctl is-active booking-bot)"; '
              'curl -s -o /dev/null -m 10 -w "api.telegram.org via relay -> %{http_code}\\n" --socks5-hostname 127.0.0.1:1089 https://api.telegram.org', 60)
          s.close()
          PY
