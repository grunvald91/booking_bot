name: Deploy mail reply and mobile compose (scoped, guarded)

# Разовая выкладка почты: кнопка «Написать письмо» на главном экране почты,
# исходящие с текстом и «Написать ещё раз». Только booking-web-api.
# Сверка хэшей с main → бэкап → заливка → py_compile → рестарт → проверка → откат.

on:
  push:
    branches:
      - ccr-545c5158-rcd05z
    paths:
      - '.github/workflows/servgo-mail-compose-deploy.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — secret present
        run: |
          if [ -z "$SERVER_PASSWORD" ]; then
            echo "::error::SERVER_SSH_PASSWORD is not configured"; exit 1
          fi

      - name: Expected server hashes
        run: |
          set -euo pipefail
          for f in web/api/routes/owner_mail.py web/api/routes/owner_mail_ui.html web/api/routes/mail_campaign_dashboard.html; do
            echo "$f $(git show 05a4b1807f966a77bcdde41bb94e502bd69a5372:"$f" | sha256sum | cut -d' ' -f1)"
          done > expected.txt
          cat expected.txt

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Deploy with backup and rollback
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, posixpath, shlex, sys, time
          import paramiko

          ROOT = '/opt/booking_bot'
          FILES = [line.split()[0] for line in pathlib.Path('expected.txt').read_text().splitlines()]
          expected = dict(line.split() for line in pathlib.Path('expected.txt').read_text().splitlines())

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != 'uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU':
                      raise paramiko.SSHException('Host key mismatch')
                  client.get_host_keys().add(hostname, key.get_name(), key)

          ssh = None
          for attempt in range(3):
              conn = paramiko.SSHClient(); conn.set_missing_host_key_policy(Pinned())
              try:
                  conn.connect('155.212.162.47', port=22, username='root', password=os.environ['SERVER_PASSWORD'],
                               look_for_keys=False, allow_agent=False, timeout=12, banner_timeout=25, auth_timeout=15)
                  ssh = conn; break
              except (paramiko.SSHException, OSError, EOFError):
                  conn.close()
                  if attempt == 2: raise
                  time.sleep(3)
          sftp = ssh.open_sftp()

          def run(cmd, check=True):
              _, out, err = ssh.exec_command(cmd, timeout=180)
              code = out.channel.recv_exit_status()
              o = out.read().decode(errors='replace'); e = err.read().decode(errors='replace')
              if o.strip(): print(o.rstrip())
              if e.strip(): print(e.rstrip(), file=sys.stderr)
              if check and code != 0:
                  raise RuntimeError(f'command failed ({code})')
              return code, o

          def api_healthy():
              checks = (
                  "curl -fsS -o /dev/null --max-time 4 http://127.0.0.1:8000/businesses",
                  # Почта без сессии отвечает 401, но не 5xx.
                  "code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:8000/owner-mail/api/outbox); [ \"$code\" = 401 ]",
              )
              for _ in range(25):
                  if all(run(c, check=False)[0] == 0 for c in checks):
                      return True
                  time.sleep(2)
              return False

          try:
              mismatched = []
              for f in FILES:
                  with sftp.open(f'{ROOT}/{f}', 'rb') as fh:
                      if hashlib.sha256(fh.read()).hexdigest() != expected[f]:
                          mismatched.append(f)
              if mismatched:
                  print('Server copies differ from the expected state, refusing to overwrite:', *mismatched, sep='\n  ')
                  sys.exit(2)
              print('Server files match the expected state: ok')

              stamp = time.strftime('%Y%m%d-%H%M%S')
              backup = f'{ROOT}/backups/mail-reply-{stamp}.tgz'
              run(f'mkdir -p {ROOT}/backups && cd {ROOT} && tar czf {backup} {" ".join(FILES)}')
              print('Backup:', backup)

              def restore():
                  print('Rolling back from', backup)
                  code, _ = run(f'cd {ROOT} && tar xzf {backup} && systemctl restart booking-web-api', check=False)
                  print('Rollback', 'succeeded, API healthy' if code == 0 and api_healthy() else 'FAILED — API needs manual attention')

              for f in FILES:
                  sftp.put(f, f'{ROOT}/{f}')
              try:
                  run(f'cd {ROOT} && ./venv/bin/python -m py_compile web/api/routes/owner_mail.py')
                  run('systemctl restart booking-web-api')
                  if not api_healthy():
                      run("printf 'booking-web-api: '; systemctl is-active booking-web-api", check=False)
                      raise RuntimeError('API did not come up healthy')
                  run("printf 'booking-web-api: '; systemctl is-active booking-web-api")
                  print('API health: ok')
                  # Только пути файлов настроек, без значений.
                  run("systemctl show -p EnvironmentFiles booking-web-api | sed -E 's/ \\(ignore_errors=[a-z]+\\)//'", check=False)
              except Exception:
                  restore()
                  raise

              print('Done. API rollback: tar xzf', backup, '-C', ROOT, '&& systemctl restart booking-web-api')
          finally:
              sftp.close(); ssh.close()
          PY
