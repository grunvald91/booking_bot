name: Restore booking code to main after 2026-10-18 incident

# One-off. Triggered only by a push to this branch that changes the restore files.
on:
  push:
    branches: [ops/restore-20261018]
    paths: [.github/restore/**, .github/workflows/restore-20261018.yml]

permissions:
  contents: read

concurrency:
  group: booking-production
  cancel-in-progress: false

jobs:
  restore:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          path: ops
      - run: python -m pip install -q --disable-pip-version-check 'paramiko==3.5.1'
      - name: Restore
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
          DRY_RUN: '0'
        run: python ops/.github/restore/restore.py
