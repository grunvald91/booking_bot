name: ServGo UI fixes + secret rotation (scoped, guarded)

# Разовый прогон:
#   1. frontend (подмена dist) и owner_mail_ui.html (сверка хэша с 0f281fc);
#   2. ротация пароля БД: новый пароль генерируется на сервере и нигде не печатается
#      (scripts/ops/rotate_secrets.py db; при старом пароле вне известных мест — отказ);
#   3. ротация токена бота, если задан секрет NEW_BOT_TOKEN (проверка getMe до записи).
# При сбое каждый шаг откатывается. Временный файл: удалить после прогона.

on:
  push:
    branches:
      - ccr-545c5158-rcd05z
    paths:
      - '.github/workflows/servgo-ui-and-secrets.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      NEW_BOT_TOKEN: ${{ secrets.NEW_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — secret present
        run: |
          if [ -z "$SERVER_PASSWORD" ]; then echo "::error::SERVER_SSH_PASSWORD is not configured"; exit 1; fi

      - name: Validate new bot token (if provided)
        id: token
        run: |
          if [ -z "$NEW_BOT_TOKEN" ]; then echo "present=no" >> "$GITHUB_OUTPUT"; echo "NEW_BOT_TOKEN not set — token rotation skipped"; exit 0; fi
          ok=$(curl -s --max-time 10 "https://api.telegram.org/bot${NEW_BOT_TOKEN}/getMe" | python3 -c "import json,sys; d=json.load(sys.stdin); print('ok' if d.get('ok') else 'bad'); print('bot: @' + d.get('result',{}).get('username',''), file=sys.stderr)")
          if [ "$ok" != "ok" ]; then echo "::error::NEW_BOT_TOKEN rejected by Telegram"; exit 1; fi
          echo "present=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          grep -R -q 'ds-toggle--sm' dist/assets

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Deploy and rotate
        shell: bash
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
          EXPECTED_MAIL_SHA: placeholder
        run: |
          export EXPECTED_MAIL_SHA=$(git show 0f281fc:web/api/routes/owner_mail_ui.html | sha256sum | cut -d' ' -f1)
          python - <<'PY'
          import base64, hashlib, io, os, pathlib, posixpath, shlex, sys, time
          import paramiko

          ROOT = '/opt/booking_bot'
          FRONT = f'{ROOT}/web/frontend'

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != 'uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU':
                      raise paramiko.SSHException('Host key mismatch')
                  client.get_host_keys().add(hostname, key.get_name(), key)

          ssh = None
          for attempt in range(3):
              conn = paramiko.SSHClient(); conn.set_missing_host_key_policy(Pinned())
              try:
                  conn.connect('155.212.162.47', port=22, username='root', password=os.environ['SERVER_PASSWORD'],
                               look_for_keys=False, allow_agent=False, timeout=12, banner_timeout=25, auth_timeout=15)
                  ssh = conn; break
              except (paramiko.SSHException, OSError, EOFError):
                  conn.close()
                  if attempt == 2: raise
                  time.sleep(3)
          sftp = ssh.open_sftp()

          def run(cmd, check=True, timeout=600):
              _, out, err = ssh.exec_command(cmd, timeout=timeout)
              code = out.channel.recv_exit_status()
              o = out.read().decode(errors='replace'); e = err.read().decode(errors='replace')
              if o.strip(): print(o.rstrip())
              if e.strip():
                  # Только последняя строка ошибки (без трейсбеков с путями/данными).
                  print('stderr:', e.strip().splitlines()[-1][:300], file=sys.stderr)
              if check and code != 0:
                  raise RuntimeError(f'command failed ({code})')
              return code, o

          def put_tree(local, remote):
              for path in sorted(pathlib.Path(local).rglob('*')):
                  target = posixpath.join(remote, path.relative_to(local).as_posix())
                  if path.is_dir():
                      run(f'mkdir -p {shlex.quote(target)}')
                  else:
                      sftp.put(str(path), target)

          failures = []
          try:
              # 1. Mail UI + rotation script + frontend.
              mail = 'web/api/routes/owner_mail_ui.html'
              with sftp.open(f'{ROOT}/{mail}', 'rb') as fh:
                  if hashlib.sha256(fh.read()).hexdigest() != os.environ['EXPECTED_MAIL_SHA']:
                      raise SystemExit('owner_mail_ui.html on server differs from expected; refusing')
              stamp = time.strftime('%Y%m%d-%H%M%S')
              run(f'mkdir -p {ROOT}/backups && cp {ROOT}/{mail} {ROOT}/backups/owner_mail_ui-{stamp}.html')
              sftp.put(mail, f'{ROOT}/{mail}')
              run(f'mkdir -p {ROOT}/scripts/ops')
              sftp.put('scripts/ops/rotate_secrets.py', f'{ROOT}/scripts/ops/rotate_secrets.py')
              run(f'cd {ROOT} && ./venv/bin/python -m py_compile scripts/ops/rotate_secrets.py')

              new_dir = f'{FRONT}/dist.new-{stamp}'; prev_dir = f'{FRONT}/dist.prev-{stamp}'
              run(f'test -d {FRONT}/dist && rm -rf {new_dir} && mkdir -p {new_dir}')
              try:
                  put_tree('web/frontend/dist', new_dir)
                  run(f"grep -R -q 'ds-toggle--sm' {new_dir}/assets")
                  run(f'cp -an {FRONT}/dist/assets/. {new_dir}/assets/ 2>/dev/null || true')
                  run(f'mv {FRONT}/dist {prev_dir} && mv {new_dir} {FRONT}/dist')
              except Exception:
                  run(f'rm -rf {new_dir}', check=False)
                  raise
              run(f'ls -d {FRONT}/dist.prev-* 2>/dev/null | sort | head -n -2 | xargs -r rm -rf', check=False)
              print('frontend live; previous build kept at', prev_dir)

              # 2. DB password (also restarts the API, which picks up the mail UI).
              code, _ = run(f'cd {ROOT} && ./venv/bin/python scripts/ops/rotate_secrets.py db', check=False, timeout=900)
              if code != 0:
                  failures.append(f'db rotation exit {code}')
                  run('systemctl restart booking-web-api', check=False)

              # 3. Bot token.
              if os.environ.get('TOKEN_PRESENT') == 'yes':
                  tmp = '/root/.servgo-new-token'
                  with sftp.open(tmp, 'w') as fh:
                      fh.chmod(0o600)
                      fh.write(os.environ['NEW_BOT_TOKEN'])
                  code, _ = run(f'cd {ROOT} && ./venv/bin/python scripts/ops/rotate_secrets.py token {tmp}', check=False, timeout=900)
                  run(f'rm -f {tmp}', check=False)
                  if code != 0:
                      failures.append(f'token rotation exit {code}')
              else:
                  print('token rotation skipped (NEW_BOT_TOKEN not set)')

              run("printf 'booking-web-api: '; systemctl is-active booking-web-api; printf 'booking-bot: '; systemctl is-active booking-bot", check=False)
              run("printf 'businesses HTTP '; curl -s -o /dev/null -w '%{http_code}\\n' --max-time 5 http://127.0.0.1:8000/businesses", check=False)
          finally:
              sftp.close(); ssh.close()
          if failures:
              print('FAILED steps:', *failures, sep='\n  ')
              sys.exit(1)
          print('All steps done')
          PY
