name: ServGo mail setup

on:
  push:
    branches: [ops/servgo-mail-server-20261006]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Run mail setup
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time, paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          sftp=ssh.open_sftp()
          sftp.put('ops/setup_servgo_mail.sh','/tmp/setup_servgo_mail.sh')
          sftp.close()
          _,out,err=ssh.exec_command('chmod 700 /tmp/setup_servgo_mail.sh && /tmp/setup_servgo_mail.sh',timeout=600)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print(stderr[-2500:])
              raise SystemExit(status)
          ssh.close()
          PY
