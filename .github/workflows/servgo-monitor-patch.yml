name: Guarded monitor legacy listener health
on:
  push:
    branches:
      - feature/servgo-promo-isolation-monitor-20261031
    paths:
      - '.github/workflows/servgo-monitor-patch.yml'
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH + tests
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1' 'pytest>=8,<9'
      - name: Run focused checks
        run: |
          python -m py_compile ops/servgo_monitor.py scripts/update_servgo_monitor.py
          python -m pytest -q tests/test_servgo_monitor.py
      - name: Verify legacy web listener with exact deployed monitor baseline
        run: python -m scripts.update_servgo_monitor
