name: ServGo mail server audit

on:
  push:
    branches: [ops/mail-server-audit-20261006]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Public DNS snapshot
        shell: bash
        run: |
          set -x
          command -v dig >/dev/null || (sudo apt-get update && sudo apt-get install -y dnsutils)
          echo '--- NS'; dig +short NS servgo.ru
          echo '--- A'; dig +short A servgo.ru
          echo '--- MAIL A'; dig +short A mail.servgo.ru
          echo '--- MX'; dig +short MX servgo.ru
          echo '--- SPF/TXT'; dig +short TXT servgo.ru
          echo '--- DMARC'; dig +short TXT _dmarc.servgo.ru
          echo '--- DKIM servgo'; dig +short TXT servgo._domainkey.servgo.ru
          echo '--- PTR'; dig +short -x 155.212.162.47

      - name: Install SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Server mail audit
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time, paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set -e
          echo '--- hostname'; hostnamectl --static || hostname
          echo '--- os'; . /etc/os-release; echo "$PRETTY_NAME"
          echo '--- packages'
          dpkg-query -W postfix dovecot-core opendkim rspamd certbot 2>/dev/null || true
          echo '--- mail ports'
          ss -lntp | egrep ':(25|465|587|993|143)\\b' || true
          echo '--- services'
          for s in postfix dovecot opendkim rspamd; do printf "$s="; systemctl is-active "$s" 2>/dev/null || true; done
          echo '--- nginx certs'
          ls -1 /etc/letsencrypt/live 2>/dev/null || true
          echo '--- disk'; df -h / | tail -1
          echo '--- outbound tcp25'
          timeout 6 bash -lc 'cat < /dev/null > /dev/tcp/gmail-smtp-in.l.google.com/25' && echo tcp25=ok || echo tcp25=blocked_or_unreachable
          '''
          _,out,err=ssh.exec_command(cmd,timeout=60)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print(stderr[-2000:])
              raise SystemExit(status)
          ssh.close()
          PY