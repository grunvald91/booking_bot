name: Relay 89 hardening (nginx boot order, stale telemt unit)

# Owner approved on 2026-10-17. Relay 89.125.90.101, reached through server 155.
# 1) nginx failed at boot on 09.10: it binds 10.66.77.1 on the WireGuard interface tg-relay, which
#    wg-quick@tg-relay brings up later. Drop-in orders nginx after it and restarts nginx on failure.
# 2) telemt.service points at /tmp/tinit/config.toml (installer leftover, wiped by the reboot) and has
#    crash-looped ~120k times since. Real proxies run as telemt-direct-*, telemt-bandbook@*,
#    telemt-rf-media. Stop and disable only telemt.service; undo: systemctl enable --now telemt.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/relay89-hardening-20261017.yml'

permissions:
  contents: read

concurrency:
  group: relay89-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Harden relay 89
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,shlex,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          relay = r'''set -Eeuo pipefail
          echo "--- 1) nginx boot order"
          [ "$(systemctl is-active wg-quick@tg-relay)" = active ] || { echo "ABORT: wg-quick@tg-relay not active"; exit 3; }
          install -d /etc/systemd/system/nginx.service.d
          rm -f /etc/systemd/system/nginx.service.d/wait-wireguard.conf
          printf '%s\n' '[Unit]' 'After=wg-quick@tg-relay.service' 'Wants=wg-quick@tg-relay.service' 'StartLimitIntervalSec=0' '' '[Service]' 'Restart=on-failure' 'RestartSec=5' > /etc/systemd/system/nginx.service.d/wait-wireguard.conf
          systemctl daemon-reload
          systemctl show nginx -p After -p Wants -p Restart -p RestartUSec | sed -E 's/ [^ ]*(network|nss|system|sysinit|basic|-\.mount)[^ ]*//g'
          systemctl show nginx -p After | grep -q 'wg-quick@tg-relay.service'
          [ "$(systemctl show nginx -p Restart --value)" = on-failure ]
          echo "nginx=$(systemctl is-active nginx) (not restarted; new settings apply on next start/boot)"
          echo "--- 2) stale telemt.service"
          if [ -e /tmp/tinit/config.toml ]; then echo "SKIP: /tmp/tinit/config.toml exists, leaving telemt.service alone"; else
            systemctl disable --now telemt.service 2>&1 | tail -3 || true
            systemctl reset-failed telemt.service || true
            echo "telemt.service: active=$(systemctl is-active telemt.service) enabled=$(systemctl is-enabled telemt.service 2>/dev/null || true)"
          fi
          echo "--- real proxies after change"
          for u in $(systemctl list-units --type=service --no-legend --plain 'telemt*' 'mtg*' 'mtproxy*' 'xray*' 'tproxy-server*' | awk '{print $1}'); do printf '%s=%s ' "$u" "$(systemctl is-active $u)"; done; echo
          systemctl --failed --no-legend --plain | head -5
          for u in 'https://tg.servgo.ru/js/telegram-widget.js?22'; do printf '%s (local) -> ' "$u"; curl -s -o /dev/null -m 10 -w '%{http_code}\n' --resolve tg.servgo.ru:443:127.0.0.1 "$u" || true; done
          echo RELAY_HARDENING=success
          '''
          relay = '\n'.join(l.strip() for l in relay.splitlines())
          cmd = ('timeout 60 ssh -i /root/.ssh/servgo_89_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes '
                 '-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/booking-bot-relay89/known_hosts '
                 '-o ConnectTimeout=8 root@89.125.90.101 ' + shlex.quote(relay))
          _,o,e=s.exec_command(cmd,timeout=90)
          print(o.read().decode('utf-8','replace'))
          rc=o.channel.recv_exit_status()
          if rc:
              print(e.read().decode('utf-8','replace')[-2000:]); raise SystemExit(rc)
          s.close()
          PY
