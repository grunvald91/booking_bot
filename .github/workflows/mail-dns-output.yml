name: ServGo mail DNS output
on:
  push:
    branches: [ops/mail-dns-output-20261006]
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,paramiko
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU': raise Exception('host key')
                  c.get_host_keys().add(h,k.get_name(),k)
          c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
          c.connect('155.212.162.47',username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False)
          cmd=r'''python3 - <<'OUT'
          from pathlib import Path
          import re
          raw=Path('/etc/opendkim/keys/servgo.ru/servgo.txt').read_text()
          print('DKIM=' + ''.join(re.findall(r'"([^"]*)"', raw)))
          OUT
          echo 'MX=10 mail.servgo.ru.'
          echo 'SPF=v=spf1 ip4:155.212.162.47 -all'
          echo 'DMARC=v=DMARC1; p=none; rua=mailto:dmarc@servgo.ru; adkim=s; aspf=s; pct=100'
          echo 'PTR=mail.servgo.ru'
          openssl x509 -in /etc/letsencrypt/live/mail.servgo.ru/fullchain.pem -noout -subject -enddate
          '''
          _,o,e=c.exec_command(cmd,timeout=20)
          print(o.read().decode()); print(e.read().decode()); c.close()
          PY