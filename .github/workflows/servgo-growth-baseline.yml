name: ServGo growth baseline audit

on:
  push:
    branches:
      - ops/growth-baseline-audit

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}

    steps:
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Read aggregate growth baseline
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, shlex, time
          import paramiko

          EXPECTED='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual=base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != EXPECTED:
                      raise paramiko.SSHException('SSH host key mismatch')
                  client.get_host_keys().add(hostname,key.get_name(),key)

          source=r'''
          import asyncio, json
          from sqlalchemy import text
          from database.database import async_session_maker

          QUERIES = {
              "users_total": "select count(*) from users",
              "businesses_total": "select count(*) from businesses",
              "businesses_active": "select count(*) from businesses where is_active=true",
              "bookings_total": "select count(*) from bookings",
              "owners_with_business": "select count(distinct owner_id) from businesses",
              "subscription_status": "select coalesce(subscription_status,'NULL') status, count(*) n from users group by 1 order by 1",
              "tariffs": "select coalesce(tariff,'NULL') tariff, count(*) n from users group by 1 order by 1",
              "booking_status": "select coalesce(status,'NULL') status, count(*) n from bookings group by 1 order by 2 desc",
          }

          WINDOW_QUERIES = {
              "new_users": "select count(*) from users where created_at >= now() - (:days || ' days')::interval",
              "new_businesses": "select count(*) from businesses where created_at >= now() - (:days || ' days')::interval",
              "new_bookings": "select count(*) from bookings where created_at >= now() - (:days || ' days')::interval",
              "unique_booking_clients": "select count(distinct client_id) from bookings where created_at >= now() - (:days || ' days')::interval",
              "confirmed_or_completed_bookings": "select count(*) from bookings where created_at >= now() - (:days || ' days')::interval and status in ('confirmed','completed')",
              "cancelled_bookings": "select count(*) from bookings where created_at >= now() - (:days || ' days')::interval and status='cancelled'",
              "businesses_with_booking_activity": "select count(distinct business_id) from bookings where created_at >= now() - (:days || ' days')::interval",
          }

          async def run():
              out={"baseline_kind":"aggregate_only","traffic":"UNKNOWN","lead_source_attribution":"ABSENT_IN_SCHEMA"}
              async with async_session_maker() as session:
                  for name, sql in QUERIES.items():
                      rows=(await session.execute(text(sql))).all()
                      out[name]=[list(r) for r in rows] if len(rows)!=1 or len(rows[0])!=1 else rows[0][0]
                  for days in (7,30,90):
                      block={}
                      for name, sql in WINDOW_QUERIES.items():
                          block[name]=(await session.execute(text(sql),{"days":str(days)})).scalar()
                      out[f"last_{days}_days"]=block
                  # Earliest/latest timestamps only, no personal data.
                  out["range"]={
                      "first_user_created_at": str((await session.execute(text("select min(created_at) from users"))).scalar()),
                      "latest_user_created_at": str((await session.execute(text("select max(created_at) from users"))).scalar()),
                      "first_business_created_at": str((await session.execute(text("select min(created_at) from businesses"))).scalar()),
                      "latest_business_created_at": str((await session.execute(text("select max(created_at) from businesses"))).scalar()),
                      "first_booking_created_at": str((await session.execute(text("select min(created_at) from bookings"))).scalar()),
                      "latest_booking_created_at": str((await session.execute(text("select max(created_at) from bookings"))).scalar()),
                  }
              print(json.dumps(out,ensure_ascii=False,indent=2,default=str))

          asyncio.run(run())
          '''
          encoded=base64.b64encode(source.encode()).decode()
          remote="/opt/booking_bot/venv/bin/python -c "+shlex.quote("import base64;exec(base64.b64decode('"+encoded+"'))")

          if not os.environ.get('SERVER_PASSWORD'):
              raise RuntimeError('Missing SSH secret')

          ssh=None
          for attempt in range(3):
              c=paramiko.SSHClient();c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect('155.212.162.47',port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c;break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2: raise
                  time.sleep(3)
          try:
              _,stdout,stderr=ssh.exec_command("cd /opt/booking_bot && "+remote,timeout=45)
              result=stdout.read().decode('utf-8','replace')
              status=stdout.channel.recv_exit_status()
              if status:
                  raise RuntimeError('Aggregate audit failed')
              print(result)
          finally:
              ssh.close()
          PY
