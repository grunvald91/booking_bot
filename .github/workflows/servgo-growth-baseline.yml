name: ServGo models structural diff

on:
  push:
    branches:
      - ops/growth-baseline-audit

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Print sanitized models diff
        shell: bash
        run: |
          python - <<'PY'
          import base64, difflib, hashlib, os, pathlib, re, time
          import paramiko
          EXPECTED='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,client,hostname,key):
                  actual=base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != EXPECTED: raise paramiko.SSHException('SSH host key mismatch')
                  client.get_host_keys().add(hostname,key.get_name(),key)
          ssh=None
          for attempt in range(3):
              c=paramiko.SSHClient();c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect('155.212.162.47',port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c;break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2: raise
                  time.sleep(3)
          try:
              sftp=ssh.open_sftp()
              with sftp.open('/opt/booking_bot/database/models.py','rb') as fh:
                  remote=fh.read().decode('utf-8','replace').splitlines()
              local=pathlib.Path('database/models.py').read_text().splitlines()
              diff=list(difflib.unified_diff(local,remote,fromfile='github-main/database/models.py',tofile='production/database/models.py',n=4))
              secret=re.compile(r'(?i)(token|password|secret|api[_-]?key)\s*[=:]\s*[^\s,;]+')
              print("DIFF_LINES",len(diff))
              for line in diff:
                  print(secret.sub(r'\1=[REDACTED]',line)[:500])
          finally:
              try:sftp.close()
              except:pass
              ssh.close()
          PY
