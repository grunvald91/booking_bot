name: ServGo target source safety check

on:
  push:
    branches:
      - ops/growth-baseline-audit

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Compare target files with production
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, time
          import paramiko

          files=[
              "database/models.py",
              "database/__init__.py",
              "webapp/server.py",
              "webapp/templates/landing.html",
              "webapp/static/js/landing.js",
          ]
          EXPECTED='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,client,hostname,key):
                  actual=base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != EXPECTED:
                      raise paramiko.SSHException('SSH host key mismatch')
                  client.get_host_keys().add(hostname,key.get_name(),key)

          ssh=None
          for attempt in range(3):
              c=paramiko.SSHClient();c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect('155.212.162.47',port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c;break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2: raise
                  time.sleep(3)
          sftp=ssh.open_sftp()
          try:
              mismatches=[]
              for path in files:
                  local=pathlib.Path(path).read_bytes()
                  with sftp.open('/opt/booking_bot/'+path,'rb') as fh:
                      remote=fh.read()
                  same=hashlib.sha256(local).digest()==hashlib.sha256(remote).digest()
                  print(path, "MATCH" if same else "DIFF")
                  if not same:mismatches.append(path)
              print("TARGET_MISMATCH_COUNT",len(mismatches))
              if mismatches:
                  print("TARGET_MISMATCHES",",".join(mismatches))
          finally:
              sftp.close();ssh.close()
          PY
