name: Inspect 2026-10-18 incident side effects (read-only)

on:
  push:
    branches: [ops/restore-20261018]
    paths: [.github/incident/**, .github/workflows/incident-inspect-20261018.yml]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q --disable-pip-version-check 'paramiko==3.5.1'
      - env:
          SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        run: python .github/incident/inspect.py
