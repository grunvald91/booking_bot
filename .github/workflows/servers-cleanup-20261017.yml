name: Servers junk cleanup (155 + relay 89)

# Owner asked on 2026-10-17 to remove obvious junk after a read-only health audit.
# Removes only regenerable or rotated data: Docker build cache, dangling images, two exited one-off
# containers, apt/pip caches, rotated logs, journal above a size cap, the oversized syslog on 89
# (keeps its last 50 MB). Keeps tagged Docker images (rollback sets), release backups, app data,
# kernels. Caps the journal on 89 so the crash-loop spam cannot fill the disk again.
on:
  push:
    branches: [ccr-005ea961-gr0x8f]
    paths:
      - '.github/workflows/servers-cleanup-20261017.yml'

permissions:
  contents: read

concurrency:
  group: servers-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: python -m pip install --disable-pip-version-check -q 'paramiko==3.5.1'
      - name: Clean both servers
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,shlex,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          def run(cmd,timeout=400):
              _,o,e=s.exec_command(cmd,timeout=timeout)
              print(o.read().decode('utf-8','replace'))
              rc=o.channel.recv_exit_status()
              err=e.read().decode('utf-8','replace')
              if rc:
                  print(err[-2000:]); raise SystemExit(rc)

          main = r'''set +e
          echo "############ SERVER 155 ############"
          echo "before: $(df -h / | awk 'NR==2{print $3" used, "$4" free ("$5")"}')"
          echo "--- docker: exited one-off containers"
          for c in servgo-release-20261014-build ai-growth-os-profile-init-1; do
            st=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null); [ "$st" = exited ] && docker rm "$c" >/dev/null && echo "removed $c"; done
          echo "--- docker: dangling images and build cache"
          docker image prune -f 2>&1 | tail -1
          docker builder prune -af 2>&1 | tail -1
          echo "--- caches and rotated logs"
          apt-get clean
          rm -rf /root/.cache/pip
          rm -f /var/log/btmp.1 /var/log/*.gz /var/log/*/*.gz
          journalctl --vacuum-size=200M 2>&1 | tail -1
          echo "after:  $(df -h / | awk 'NR==2{print $3" used, "$4" free ("$5")"}')"
          docker system df 2>/dev/null | sed -n 1,5p
          for u in booking-bot booking-web-api nginx postfix dovecot docker; do printf '%s=%s ' $u "$(systemctl is-active $u)"; done; echo
          echo "CLEAN_155=done"
          '''
          run(main)

          relay = r'''set +e
          echo "############ SERVER 89 ############"
          echo "before: $(df -h / | awk 'NR==2{print $3" used, "$4" free ("$5")"}')"
          echo "--- oversized logs"
          rm -f /var/log/syslog.1 /var/log/btmp.1 /var/log/*.gz /var/log/*/*.gz
          if [ -f /var/log/syslog ] && [ "$(stat -c %s /var/log/syslog)" -gt 104857600 ]; then
            tail -c 52428800 /var/log/syslog > /var/log/syslog.trim && cat /var/log/syslog.trim > /var/log/syslog && rm -f /var/log/syslog.trim
            echo "syslog trimmed to last 50 MB"
          fi
          echo "--- journal: vacuum and cap at 300M"
          journalctl --vacuum-size=300M 2>&1 | tail -1
          install -d /etc/systemd/journald.conf.d
          printf '%s\n' '[Journal]' 'SystemMaxUse=300M' 'SystemMaxFileSize=50M' > /etc/systemd/journald.conf.d/size-cap.conf
          systemctl restart systemd-journald && echo "journald capped at 300M"
          echo "--- caches"
          apt-get clean
          rm -rf /root/.cache/pip /root/.cache/go-build
          echo "after:  $(df -h / | awk 'NR==2{print $3" used, "$4" free ("$5")"}')"
          echo "log dir: $(du -sh /var/log | cut -f1)"
          for u in nginx xray mtproxy mtproxy-ru tproxy-server tproxy-server-ru telemt-rf-media telemt-direct-ozon mtg wg-quick@tg-relay; do printf '%s=%s ' $u "$(systemctl is-active $u)"; done; echo
          systemctl --failed --no-legend --plain | head -5
          echo "CLEAN_89=done"
          '''
          relay = '\n'.join(l.strip() for l in relay.splitlines())
          run('timeout 300 ssh -i /root/.ssh/servgo_89_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes '
              '-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/booking-bot-relay89/known_hosts '
              '-o ConnectTimeout=8 root@89.125.90.101 ' + shlex.quote(relay), 330)
          s.close()
          PY
      - name: Public checks
        run: |
          for u in https://servgo.ru/login https://mail.servgo.ru/ 'https://tg.servgo.ru/js/telegram-widget.js?22'; do printf '%s -> ' "$u"; curl -s -o /dev/null -m 10 -w '%{http_code}\n' "$u" || true; done
