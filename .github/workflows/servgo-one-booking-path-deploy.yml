name: Deploy one client booking path (scoped, guarded)

# Разовая выкладка: старая /book (webapp в booking-bot) → servgo.ru, закрытие
# старого создания записей, проверка «нескольких услуг» в API.
#   1. сверяет хэши файлов на сервере с ожидаемыми (837d30c) — иначе ничего не трогает;
#   2. бэкап; 3. заливка; 4. py_compile; 5. рестарт booking-web-api и booking-bot;
#   6. проверки (API, бот активен, /book → 302 на servgo.ru, лендинг ниши 200);
#   при ошибке — откат файлов из бэкапа и повторный рестарт.
# Журналы сервисов в публичный лог не выводятся. Временный файл: удалить до мержа PR #38.

on:
  push:
    branches:
      - ccr-545c5158-rcd05z
    paths:
      - '.github/workflows/servgo-one-booking-path-deploy.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — secret present
        run: |
          if [ -z "$SERVER_PASSWORD" ]; then
            echo "::error::SERVER_SSH_PASSWORD is not configured"; exit 1
          fi

      - name: Expected server hashes
        run: |
          set -euo pipefail
          # 837d30c = состояние сервера после прогона 3 (webapp не менялся с be2d6bc)
          for f in web/api/routes/client.py webapp/server.py webapp/templates/landing.html webapp/templates/login.html; do
            echo "$f $(git show 837d30c:"$f" | sha256sum | cut -d' ' -f1)"
          done > expected.txt
          cat expected.txt

      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'

      - name: Deploy with backup and rollback
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, sys, time
          import paramiko

          ROOT = '/opt/booking_bot'
          FILES = ['web/api/routes/client.py', 'webapp/server.py', 'webapp/templates/landing.html', 'webapp/templates/login.html']
          PY_FILES = [f for f in FILES if f.endswith('.py')]
          expected = dict(line.split() for line in pathlib.Path('expected.txt').read_text().splitlines())

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != 'uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU':
                      raise paramiko.SSHException('Host key mismatch')
                  client.get_host_keys().add(hostname, key.get_name(), key)

          ssh = None
          for attempt in range(3):
              conn = paramiko.SSHClient(); conn.set_missing_host_key_policy(Pinned())
              try:
                  conn.connect('155.212.162.47', port=22, username='root', password=os.environ['SERVER_PASSWORD'],
                               look_for_keys=False, allow_agent=False, timeout=12, banner_timeout=25, auth_timeout=15)
                  ssh = conn; break
              except (paramiko.SSHException, OSError, EOFError):
                  conn.close()
                  if attempt == 2: raise
                  time.sleep(3)
          sftp = ssh.open_sftp()

          def run(cmd, check=True):
              _, out, err = ssh.exec_command(cmd, timeout=180)
              code = out.channel.recv_exit_status()
              o = out.read().decode(errors='replace'); e = err.read().decode(errors='replace')
              if o.strip(): print(o.rstrip())
              if e.strip(): print(e.rstrip(), file=sys.stderr)
              if check and code != 0:
                  raise RuntimeError(f'command failed ({code})')
              return code, o

          def healthy():
              checks = (
                  "curl -fsS -o /dev/null --max-time 4 http://127.0.0.1:8000/businesses",
                  "systemctl is-active --quiet booking-bot",
                  "curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 4 'http://127.0.0.1:8080/book?business_id=1' | grep -q '^302 https://servgo.ru/book?business_id=1$'",
                  "curl -fsS -o /dev/null --max-time 4 http://127.0.0.1:8080/beauty",
              )
              for _ in range(25):
                  if all(run(c, check=False)[0] == 0 for c in checks):
                      return True
                  time.sleep(2)
              return False

          try:
              mismatched = []
              for f in FILES:
                  with sftp.open(f'{ROOT}/{f}', 'rb') as fh:
                      if hashlib.sha256(fh.read()).hexdigest() != expected[f]:
                          mismatched.append(f)
              if mismatched:
                  print('Server copies differ from the expected state, refusing to overwrite:', *mismatched, sep='\n  ')
                  sys.exit(2)
              print('Server files match the expected state: ok')

              stamp = time.strftime('%Y%m%d-%H%M%S')
              backup = f'{ROOT}/backups/one-booking-path-{stamp}.tgz'
              run(f'mkdir -p {ROOT}/backups && cd {ROOT} && tar czf {backup} {" ".join(FILES)}')
              print('Backup:', backup)

              def restore():
                  print('Rolling back from', backup)
                  code, _ = run(f'cd {ROOT} && tar xzf {backup} && systemctl restart booking-web-api booking-bot', check=False)
                  ok = code == 0
                  for _ in range(25):
                      if run("curl -fsS -o /dev/null --max-time 4 http://127.0.0.1:8000/businesses && systemctl is-active --quiet booking-bot", check=False)[0] == 0:
                          break
                      time.sleep(2)
                  else:
                      ok = False
                  print('Rollback', 'succeeded, services healthy' if ok else 'FAILED — services need manual attention')

              for f in FILES:
                  sftp.put(f, f'{ROOT}/{f}')
              try:
                  run(f'cd {ROOT} && ./venv/bin/python -m py_compile {" ".join(PY_FILES)}')
                  run('systemctl restart booking-web-api booking-bot')
                  if not healthy():
                      run("printf 'booking-web-api: '; systemctl is-active booking-web-api; printf 'booking-bot: '; systemctl is-active booking-bot", check=False)
                      raise RuntimeError('services did not come up healthy')
                  run("printf 'booking-web-api: '; systemctl is-active booking-web-api; printf 'booking-bot: '; systemctl is-active booking-bot")
                  print('legacy /book -> https://servgo.ru/book: ok; niche landing: ok; API: ok')
              except Exception:
                  restore()
                  raise
              print('Done. Rollback: tar xzf', backup, '-C', ROOT, '&& systemctl restart booking-web-api booking-bot')
          finally:
              sftp.close(); ssh.close()
          PY
