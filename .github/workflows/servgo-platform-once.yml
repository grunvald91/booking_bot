name: ServGo platform organisation - one-off guarded provision
on:
  push:
    branches: [ops/servgo-identity-audit-20261104]
    paths:
      - '.github/workflows/servgo-platform-once.yml'
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixed remote scripts
        run: |
          python -m py_compile scripts/provision_servgo_platform_once.py
          python - <<'PY'
          from scripts.provision_servgo_platform_once import _BOOKING, _GROWTH
          compile(_BOOKING, 'read-only-and-create-booking', 'exec')
          compile(_GROWTH, 'read-only-and-connect-growth', 'exec')
          assert 'is_active=False' in _BOOKING
          assert 'Product.slug == "servgo"' in _GROWTH
          print('platform_migration_source_valid=true')
          PY
      - name: Install pinned SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Verify actual production state without writes
        env:
          APPLY: 'false'
        run: |
          test -n "$SERVGO_PASSWORD"
          python -m scripts.provision_servgo_platform_once
      - name: Create private platform organisation and link existing Growth product
        if: contains(github.event.head_commit.message, '[apply-servgo-platform]')
        env:
          APPLY: 'true'
        run: python -m scripts.provision_servgo_platform_once
      - name: Verify migration is idempotently linked in both databases
        if: contains(github.event.head_commit.message, '[apply-servgo-platform]')
        env:
          APPLY: 'false'
        run: python -m scripts.provision_servgo_platform_once
