name: ServGo nginx PWA config locate

on:
  push:
    branches:
      - ops/servgo-nginx-pwa-20261005

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Locate active ServGo nginx config
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''nginx -T 2>&1 | awk '
          /^# configuration file / {file=$4; sub(/:$/,"",file)}
          /server_name servgo\.ru www\.servgo\.ru 155\.212\.162\.47/ {print "SERVGO_CONFIG=" file}
          /location = \/sw\.js/ {print "SW_RULE_CONFIG=" file}
          /location = \/manifest\.webmanifest/ {print "MANIFEST_RULE_CONFIG=" file}
          '
          '''
          _,out,err=ssh.exec_command(cmd,timeout=20)
          print(out.read().decode('utf-8','replace'))
          if out.channel.recv_exit_status()!=0:
              print(err.read().decode('utf-8','replace')[-800:])
              raise SystemExit(1)
          ssh.close()
          PY
