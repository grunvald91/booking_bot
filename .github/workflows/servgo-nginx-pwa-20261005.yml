name: ServGo nginx PWA cache patch

on:
  push:
    branches:
      - ops/servgo-nginx-pwa-20261005

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Patch PWA control-file locations safely
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko
          HOST='155.212.162.47'; FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set -Eeuo pipefail
          FILE=/etc/nginx/sites-enabled/webapp
          BACKUP="/etc/nginx/sites-available/webapp.pwa-backup-$(date +%Y%m%d-%H%M%S)"
          cp -a "$FILE" "$BACKUP"
          echo "backup=$BACKUP"

          python3 - <<'PATCH_PY'
          from pathlib import Path
          p=Path('/etc/nginx/sites-enabled/webapp')
          text=p.read_text()
          marker='server_name servgo.ru www.servgo.ru 155.212.162.47;'
          m=text.find(marker)
          if m < 0:
              raise SystemExit('ServGo server_name not found')
          start=text.rfind('server {',0,m)
          if start < 0:
              raise SystemExit('ServGo server block start not found')
          depth=0; end=None
          for i in range(start,len(text)):
              if text[i]=='{': depth+=1
              elif text[i]=='}':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          if end is None:
              raise SystemExit('ServGo server block end not found')
          block=text[start:end]
          if 'listen 443 ssl;' not in block:
              raise SystemExit('First ServGo block is not HTTPS')
          if 'location = /sw.js' in block or 'location = /manifest.webmanifest' in block:
              print('pwa_locations=already_present')
              raise SystemExit(0)
          needle='    location / {'
          rel=block.find(needle)
          if rel < 0:
              raise SystemExit('ServGo SPA location not found')
          insert_at=start+rel
          addition="\n".join([
              "    # PWA control files: always revalidate service worker and manifest.",
              "    location = /sw.js {",
              "        root /opt/booking_bot/web/frontend/dist;",
              "        default_type application/javascript;",
              '        add_header Cache-Control "no-cache, no-store, must-revalidate";',
              '        add_header Pragma "no-cache";',
              "        try_files $uri =404;",
              "    }",
              "",
              "    location = /manifest.webmanifest {",
              "        root /opt/booking_bot/web/frontend/dist;",
              "        default_type application/manifest+json;",
              '        add_header Cache-Control "no-cache";',
              "        try_files $uri =404;",
              "    }",
              "",
              "",
          ])
          p.write_text(text[:insert_at]+addition+text[insert_at:])
          print('pwa_locations=inserted')
          PATCH_PY

          if ! nginx -t; then
            cp -a "$BACKUP" "$FILE"
            nginx -t
            echo 'nginx_patch=rolled_back'
            exit 1
          fi
          systemctl reload nginx
          sleep 1
          test "$(systemctl is-active nginx.service)" = active

          echo '--- public headers ---'
          SW_HEADERS=$(curl -fsSI --max-time 10 https://servgo.ru/sw.js | tr -d '\r')
          MAN_HEADERS=$(curl -fsSI --max-time 10 https://servgo.ru/manifest.webmanifest | tr -d '\r')
          printf '%s\n' "$SW_HEADERS" | grep -i '^HTTP/'
          printf '%s\n' "$SW_HEADERS" | grep -i '^Content-Type:'
          printf '%s\n' "$SW_HEADERS" | grep -i '^Cache-Control:'
          printf '%s\n' "$MAN_HEADERS" | grep -i '^HTTP/'
          printf '%s\n' "$MAN_HEADERS" | grep -i '^Content-Type:'
          printf '%s\n' "$MAN_HEADERS" | grep -i '^Cache-Control:'

          printf '%s\n' "$SW_HEADERS" | grep -qi 'Cache-Control:.*no-cache'
          printf '%s\n' "$MAN_HEADERS" | grep -qi 'Content-Type:.*application/manifest+json'
          printf '%s\n' "$MAN_HEADERS" | grep -qi 'Cache-Control:.*no-cache'
          curl -fsS --max-time 8 https://servgo.ru/api/health >/dev/null
          echo 'nginx_patch=success'
          '''
          _,out,err=ssh.exec_command(cmd,timeout=45)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print('stderr_suffix='+stderr[-1600:])
              raise SystemExit(status)
          ssh.close()
          PY
