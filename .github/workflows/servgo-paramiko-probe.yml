name: ServGo Paramiko read-only probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install pinned SSH client
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Inspect only web API and one public image
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, logging, os, time
          import paramiko
          logging.getLogger('paramiko').setLevel(logging.CRITICAL)
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual=base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual!='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU':
                      raise paramiko.SSHException('Host key mismatch')
                  client.get_host_keys().add(hostname,key.get_name(),key)
          command='''cd /opt/booking_bot && ./venv/bin/python - <<'REMOTE'
          import ast, hashlib, os, subprocess, urllib.request, urllib.error
          from pathlib import Path
          for path in ('web/api/routes/client.py','web/api/routes/admin.py'):
              data=Path(path).read_bytes()
              print(path, 'sha256',hashlib.sha256(data).hexdigest())
              tree=ast.parse(data)
              for node in ast.walk(tree):
                  if isinstance(node,(ast.AsyncFunctionDef,ast.FunctionDef)) and node.name in ('get_telegram_photo','upload_business_photo','upload_employee_photo'):
                      for part in ast.walk(node):
                          if isinstance(part,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='bot_token' for t in part.targets):
                              expr=part.value
                              kind=('environment_with_fallback' if isinstance(expr,ast.Call) and isinstance(expr.func,ast.Attribute) and expr.func.attr=='getenv' else 'literal' if isinstance(expr,ast.Constant) else type(expr).__name__)
                              print(node.name,'bot_token_source',kind)
          print('api_active',subprocess.run(['systemctl','is-active','booking-web-api.service'],capture_output=True,text=True).stdout.strip())
          for suffix in ('/health','/telegram-photo/AgACAgIAAxkDAAILyGoe-A369HYJo3hjyR6ydswNfONqAALgI2sbl8D5SEfweqrsxduxAQADAgADdwADOwQ'):
              req=urllib.request.Request('http://127.0.0.1:8000'+suffix)
              try:
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      print('local_route',suffix.split('/')[1],'status',resp.status,'content_type',resp.headers.get('Content-Type'),'first_bytes',repr(resp.read(12)))
              except urllib.error.HTTPError as exc:
                  print('local_route',suffix.split('/')[1],'status',exc.code)
              except Exception as exc:
                  print('local_route',suffix.split('/')[1],'error_type',type(exc).__name__)
          REMOTE'''
          for attempt in range(1,4):
              ssh=paramiko.SSHClient(); ssh.set_missing_host_key_policy(Pinned())
              try:
                  ssh.connect('155.212.162.47',username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  _, out, err=ssh.exec_command(command,timeout=40)
                  print(out.read().decode('utf8','replace'))
                  code=out.channel.recv_exit_status()
                  print('remote_exit',code)
                  if code: raise SystemExit(code)
                  break
              except (OSError, EOFError, paramiko.SSHException) as exc:
                  print('connection_attempt',attempt,'error_type',type(exc).__name__)
                  if attempt==3:raise SystemExit(1)
                  time.sleep(3)
              finally: ssh.close()
          PY
