name: Verify SOCKS5 after relay89 clock repair
on:
  push:
    paths: ['.github/workflows/servgo-relay89-clock-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay89-clock-e2e
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Verify live SOCKS5 with TLS validation and four second connection timeout
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          command -v sshpass >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; }
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 root@155.212.162.47 'python3 -u -' <<'PY'
          import subprocess,json,statistics,time,pathlib
          def run(cmd,t=10):
           p=subprocess.run(cmd,capture_output=True,text=True,timeout=t);return p.returncode,p.stdout+p.stderr
          print('TIME',run(['date','-Is']),flush=True)
          for unit in ['elitles-tg-proxy','booking-bot-relay89']:
           print('SERVICE',unit,run(['systemctl','show',unit,'-p','ActiveState,SubState,NRestarts,ExecMainStartTimestamp']),flush=True)
          for round in range(3):
           values=[];bad=[]
           for i in range(20):
            rc,out=run(['curl','-sS','-o','/dev/null','--connect-timeout','4','--max-time','8','--proxy','socks5h://127.0.0.1:1089','-w','%{http_code} %{time_total}','https://api.telegram.org/'],10)
            if rc==0 and out.startswith('302 '):values.append(float(out.split()[1]))
            else:bad.append({'exit':rc,'output':out[:200]})
           print('SOCKS5_ROUND',round,json.dumps({'success':len(values),'total':20,'min_s':min(values) if values else None,'median_s':statistics.median(values) if values else None,'max_s':max(values) if values else None,'errors':bad}),flush=True)
           assert not bad,'end-to-end SOCKS5 probe failed'
           if round<2:time.sleep(10)
          p=pathlib.Path('/var/lib/servgo-monitor/state.json')
          if p.is_file():
           state=json.loads(p.read_text()).get('checks',{}).get('proxy:telegram-egress',{})
           print('MONITOR_PROXY_STATE',json.dumps({k:state.get(k) for k in ['bad','good','alarm','down_since','first_good_at']}),flush=True)
          for name in ['nf_conntrack_count','nf_conntrack_max']:
           p=pathlib.Path('/proc/sys/net/netfilter')/name
           if p.exists():print('CONNTRACK_155',name,p.read_text().strip(),flush=True)
          print('E2E_SUCCESS=true',flush=True)
          
          PY
