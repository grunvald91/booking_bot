name: Temporary growth attribution CI

on:
  push:
    branches:
      - feature/growth-attribution

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BOT_TOKEN: "123456:TESTTOKEN"
      DB_TYPE: "postgresql"
      DB_PASSWORD: "test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt greenlet jinja2
      - name: Compile changed source
        run: python -m compileall -q database webapp
      - name: Validate attribution contract statically
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path("database/models.py").read_text()
          server = Path("webapp/server.py").read_text()
          landing = Path("webapp/templates/landing.html").read_text()
          js = Path("webapp/static/js/landing.js").read_text()

          for marker in [
              'class MarketingLead(Base):',
              'experiment_id:',
              'utm_campaign:',
              'self_reported_source:',
              'attribution_confidence:',
          ]:
              assert marker in models, marker

          for marker in [
              'persist_landing_marketing_lead',
              'experiment_id',
              'utm_source',
              'utm_campaign',
              'self_reported_source',
              'tracking_saved',
          ]:
              assert marker in server, marker

          assert 'name="self_reported_source"' in landing
          assert 'servgo_growth_attribution_v1' in js
          assert 'experiment_id' in js and 'utm_campaign' in js
          print("growth attribution static contract OK")
          PY
