name: Refresh three outdated source copies on the server (GitHub -> server)
# Default is a dry run: it reports what it would do and changes nothing. A push of this branch that touches this file
# runs the dry run; the marker [apply-refresh] in that commit's message makes it replace the files (with backups).
# No service is restarted; a copy that is not provably behind git is refused.
on:
  push:
    branches: [ops/refresh-stale-copies]
    paths:
      - .github/workflows/servgo-refresh-stale-copies.yml
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = replace the files (with backups); false = report only'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: servgo-refresh-stale-copies
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check pytest 'paramiko==3.5.1'
      - run: python -m pytest -q tests/test_refresh_stale_server_copies.py
      - name: Refresh
        run: python scripts/refresh_stale_server_copies.py ${{ (inputs.apply == 'true' || contains(github.event.head_commit.message, '[apply-refresh]')) && '--apply' || '' }}
