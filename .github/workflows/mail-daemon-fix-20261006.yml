name: ServGo mail localhost hardening

on:
  push:
    branches: [ops/servgo-mail-fix-20261006]

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Harden local SMTP
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,os,time,paramiko
          H='155.212.162.47'; F='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class P(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  a=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if a!=F: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          s=None
          for n in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(P())
              try:
                  c.connect(H,username='root',password=os.environ['SERVER_PASSWORD'],look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  s=c; break
              except Exception:
                  c.close()
                  if n==2: raise
                  time.sleep(3)
          cmd=r'''set -Eeuo pipefail
          postconf -e 'inet_interfaces = 127.0.0.1'
          postconf -e 'inet_protocols = ipv4'
          postconf -e 'mynetworks = 127.0.0.0/8'
          postconf -e 'smtpd_relay_restrictions = permit_mynetworks,reject_unauth_destination'
          ufw deny 25/tcp >/dev/null 2>&1 || true

          postfix stop || true
          sleep 1
          postfix start
          systemctl restart opendkim

          test "$(systemctl is-active postfix)" = active
          test "$(systemctl is-active opendkim)" = active
          test "$(postconf -h inet_interfaces)" = "127.0.0.1"

          listeners=$(ss -ltn | awk '$4 ~ /:25$/ {print $4}')
          echo "smtp_listeners=$listeners"
          test "$listeners" = "127.0.0.1:25"

          python3 - <<'SMTP'
          import smtplib
          with smtplib.SMTP('127.0.0.1',25,timeout=5) as s:
              code,_=s.ehlo()
              assert code==250
          print('local_smtp=ok')
          SMTP

          echo 'ufw_25='
          ufw status | grep -E '^25/tcp' || true
          '''
          _,o,e=s.exec_command(cmd,timeout=80)
          stdout=o.read().decode('utf-8','replace')
          stderr=e.read().decode('utf-8','replace')
          print(stdout)
          status=o.channel.recv_exit_status()
          if status:
              print(stderr[-1800:])
              raise SystemExit(status)
          s.close()
          PY
