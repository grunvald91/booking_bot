name: Booking safety DDL dry-run

on:
  push:
    branches:
      - audit/booking-safety-ddl-20261005

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Dry-run migration inside rollback transaction
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko

          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  actual=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if actual!=FP:
                      raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)

          ssh=None
          for attempt in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2: raise
                  time.sleep(3)

          sftp=ssh.open_sftp()
          try:
              sftp.put('migrations/add_booking_overlap_constraint.sql','/tmp/add_booking_overlap_constraint.sql')
          finally:
              sftp.close()

          cmd=r'''set -e
          cd /opt/booking_bot
          ./venv/bin/python - <<'DB_PY'
          import asyncio, os
          from pathlib import Path
          import asyncpg
          from dotenv import load_dotenv

          load_dotenv('/opt/booking_bot/.env')
          sql=Path('/tmp/add_booking_overlap_constraint.sql').read_text()

          async def run():
              conn=await asyncpg.connect(
                  host=os.getenv('DB_HOST','localhost'),
                  port=int(os.getenv('DB_PORT','5432')),
                  user=os.getenv('DB_USER','postgres'),
                  password=os.getenv('DB_PASSWORD',''),
                  database=os.getenv('DB_NAME','booking_bot'),
              )
              before_cols=set()
              try:
                  before_cols={r['column_name'] for r in await conn.fetch(
                      "select column_name from information_schema.columns where table_name='bookings'"
                  )}
                  tr=conn.transaction()
                  await tr.start()
                  try:
                      await conn.execute(sql)
                      cols={r['column_name'] for r in await conn.fetch(
                          "select column_name from information_schema.columns where table_name='bookings'"
                      )}
                      assert 'resource_duration_minutes' in cols
                      assert 'occupies_resource' in cols
                      exists=await conn.fetchval(
                          "select exists(select 1 from pg_constraint where conname='bookings_no_active_resource_overlap')"
                      )
                      assert exists
                      ext=await conn.fetchval(
                          "select exists(select 1 from pg_extension where extname='btree_gist')"
                      )
                      assert ext
                      print('ddl_inside_transaction=ok')
                  finally:
                      await tr.rollback()

                  after_cols={r['column_name'] for r in await conn.fetch(
                      "select column_name from information_schema.columns where table_name='bookings'"
                  )}
                  assert after_cols==before_cols
                  print('rollback_restored_schema=yes')
              finally:
                  await conn.close()
          asyncio.run(run())
          DB_PY
          rm -f /tmp/add_booking_overlap_constraint.sql
          '''
          _,out,err=ssh.exec_command(cmd,timeout=120)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print(stderr[-2000:])
              raise SystemExit(status)
          ssh.close()
          PY
