name: BandBook Direct Import

on:
  issues:
    types: [opened]

jobs:
  import:
    if: github.actor == 'grunvald91' && startsWith(github.event.issue.title, '[BandBook Direct Import]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: read

    steps:
      - name: Import verified conference manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, unicodedata, urllib.request, uuid

          REPO = os.environ['REPO']
          TOKEN = os.environ['GH_TOKEN']
          API = 'http://188.120.254.223:8787'
          GROUP = '5555'
          MEMBER = 'GPT-6 Sol import'

          def gh_issue(number):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{REPO}/issues/{number}',
                  headers={
                      'Authorization': f'Bearer {TOKEN}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          def post(path, body):
              req = urllib.request.Request(
                  API + path,
                  data=json.dumps(body, ensure_ascii=False).encode('utf-8'),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          def norm(value):
              value = unicodedata.normalize('NFKC', str(value or '')).casefold().replace('ё', 'е')
              return ' '.join(re.findall(r'[0-9a-zа-я]+', value))

          issue = gh_issue(14)
          body = issue.get('body') or ''
          match = re.search(r'```json\s*(\[.*?\])\s*```', body, re.S)
          if not match:
              raise SystemExit('JSON manifest not found in Issue #14')
          manifest = json.loads(match.group(1))
          if len(manifest) != 13:
              raise SystemExit(f'Expected 13 manifest songs, got {len(manifest)}')

          before = post('/sync/pull', {'groupCode': GROUP})
          before_count = len(before.get('songs') or [])
          before_version = int(before.get('serverUpdatedAt') or before.get('server_updated_at') or 0)

          snapshot = dict(before)
          songs = [dict(s) for s in (before.get('songs') or [])]
          snapshot['songs'] = songs

          active = {}
          for s in songs:
              if isinstance(s, dict) and not s.get('deletedAt'):
                  active[norm(s.get('title'))] = s

          added, skipped = [], []
          now = int(time.time() * 1000)

          for item in manifest:
              candidates = [item['title'], *list(item.get('aliases') or [])]
              matched = next((c for c in candidates if norm(c) in active), None)
              if matched:
                  skipped.append((item['title'], matched))
                  continue

              record = {
                  'id': str(uuid.uuid5(uuid.NAMESPACE_URL, 'bandbook:conference-2026:' + item['title'])),
                  'title': item['title'],
                  'artist': item.get('artist') or None,
                  'originalKey': item['originalKey'],
                  'currentTranspose': 0,
                  'autoScrollSpeed': 1.0,
                  'bpm': item.get('bpm'),
                  'capo': None,
                  'lyricsWithChords': item['lyricsWithChords'],
                  'notes': item.get('notes') or None,
                  'createdAt': now,
                  'updatedAt': now,
                  'createdBy': MEMBER,
                  'deletedAt': None,
              }
              songs.append(record)
              active[norm(item['title'])] = record
              added.append(item['title'])
              now += 1

          meta = post('/sync/meta', {'groupCode': GROUP})
          meta_version = int(meta.get('serverUpdatedAt') or meta.get('server_updated_at') or 0)
          if meta_version != before_version:
              raise SystemExit(f'Race detected before push: {before_version} -> {meta_version}')

          snapshot['pushedBy'] = MEMBER
          snapshot['pushed_by'] = MEMBER
          if added:
              push = post('/sync/push', {'groupCode': GROUP, 'snapshot': snapshot})
              pushed_version = int(push.get('serverUpdatedAt') or 0)
          else:
              pushed_version = before_version

          after = post('/sync/pull', {'groupCode': GROUP})
          after_songs = after.get('songs') or []
          after_titles = {norm(s.get('title')) for s in after_songs if isinstance(s, dict) and not s.get('deletedAt')}

          missing = []
          for item in manifest:
              names = [item['title'], *list(item.get('aliases') or [])]
              if not any(norm(name) in after_titles for name in names):
                  missing.append(item['title'])

          if missing:
              raise SystemExit('Verification failed; missing: ' + ', '.join(missing))

          print('ENDPOINT:', API)
          print('MODEL_VALIDATION: gpt-6-sol via ClaudeHub (Issues #14/#15)')
          print('BEFORE:', before_count)
          print('ADDED_COUNT:', len(added))
          for title in added:
              print('ADDED:', title)
          print('SKIPPED_COUNT:', len(skipped))
          for requested, matched in skipped:
              print('SKIPPED:', requested, 'matched', matched)
          print('AFTER:', len(after_songs))
          print('PUSH_VERSION:', pushed_version)
          print('VERIFICATION: OK 13/13')
          PY
