name: Server vs GitHub source audit (read-only)

# One-off: compare production source with all branches of booking_bot, Ai_growth_os and SMENA.
# Nothing is written on the server. The log shows only paths and statuses; differing files are
# encrypted to the auditor's key and stored on this branch. Remove after the reconciliation.
on:
  push:
    branches: [ops/server-sync-audit]
    paths: [.github/server-sync/**, .github/workflows/server-sync-audit.yml]

permissions:
  contents: write

concurrency:
  group: server-sync-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the three repositories (all branches)
        run: |
          set -euo pipefail
          for repo in booking_bot Ai_growth_os SMENA; do
            git clone -q --bare "https://github.com/grunvald91/$repo.git" "mirrors/$repo"
          done
      - name: Install
        run: python -m pip install -q --disable-pip-version-check 'paramiko==3.5.1' cryptography
      - name: Audit
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        run: python .github/server-sync/audit.py
      - name: Store encrypted archive on this branch
        run: |
          set -euo pipefail
          mkdir -p .github/server-sync/out
          mv server-sync.enc .github/server-sync/out/server-sync.enc
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add .github/server-sync/out/server-sync.enc
          git commit -q -m "ops: encrypted server source snapshot [skip ci]"
          git push -q origin HEAD:ops/server-sync-audit
