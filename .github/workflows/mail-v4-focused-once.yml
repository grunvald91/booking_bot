name: ServGo Mail V4 focused verification
on:
  push:
    branches:
      - feature/mail-v3-bottom-ai-search-20261102
    paths:
      - '.github/workflows/mail-v4-focused-once.yml'
permissions:
  contents: read
concurrency:
  group: mail-v4-focused-once
  cancel-in-progress: false
jobs:
  mail-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      BOT_TOKEN: 'test-token'
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r web/api/requirements.txt pytest aiosqlite
      - name: Compile touched Python
        run: |
          python -m py_compile web/api/routes/mail_company_search.py web/api/routes/mail_campaign_dispatch.py web/api/routes/mail_campaign_review.py web/api/routes/mail_pwa.py tests/test_mail_company_search.py tests/test_mail_campaign_safety_v4.py
      - name: Check mail inline JavaScript and duplicate IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess, tempfile
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.seen, self.duplicates = set(), []
              def handle_starttag(self, tag, attrs):
                  ident = dict(attrs).get('id')
                  if ident in self.seen and ident is not None:
                      self.duplicates.append(ident)
                  if ident is not None:
                      self.seen.add(ident)
          for name in ['mail_campaign_dashboard.html', 'owner_mail_ui.html']:
              source = (Path('web/api/routes')/name).read_text(encoding='utf-8')
              parsed = IDs();parsed.feed(source)
              assert not parsed.duplicates, (name, parsed.duplicates)
              scripts = re.findall(r'<script>(.*?)</script>', source, re.DOTALL)
              assert len(scripts) == 1, name
              with tempfile.NamedTemporaryFile(mode='w', suffix='.js') as temp:
                  temp.write(scripts[0]);temp.flush()
                  subprocess.run(['node','--check', temp.name],check=True)
              print(name, 'syntax and static IDs OK')
          PY
      - name: Run focused mail regression tests only
        run: |
          python -m pytest -q tests/test_mail_company_search.py tests/test_mail_campaign_safety_v4.py tests/test_mail_air_v2.py tests/test_mail_same_origin.py
