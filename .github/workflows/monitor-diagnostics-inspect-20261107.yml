name: Monitor upgrade source inspection (read only)
on:
  push:
    branches: ['ops/incident-readonly-20261107']
    paths: ['.github/workflows/monitor-diagnostics-inspect-20261107.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HOST: 155.212.162.47
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install SSH client and inspect monitor source safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o LogLevel=ERROR "root@$HOST" 'python3 -' <<'PY'
          import pathlib, re
          p=pathlib.Path('/opt/booking_bot/ops/servgo_monitor.py')
          s=p.read_text(encoding='utf8')
          patterns=[
              r'\b\d{7,12}:[A-Za-z0-9_-]{25,}\b',
              r'gh[pousr]_[A-Za-z0-9_]{20,}',
              r'(?i)(?:password|secret|api[_-]?key)\s*=\s*["\x27][^"\x27]{8,}',
              r'-----BEGIN [A-Z ]+ PRIVATE KEY-----',
          ]
          for pat in patterns:
              if re.search(pat,s): 
                  print('Sensitive material detected; source redacted.'); raise SystemExit(1)
          lines=s.splitlines()
          print('SOURCE_LINES',len(lines))
          for i,line in enumerate(lines,1):
              line=re.sub(r'(?i)https?://[^\s"\\\x27]+','URL_REDACTED',line)
              line=re.sub(r'(?<!\w)[\w.-]+@[\w.-]+\.\w+','EMAIL_REDACTED',line)
              line=re.sub(r'(?i)(?:authorization|x-api-key|bearer)\s*[:=]\s*\S+','AUTH_REDACTED',line)
              line=re.sub(r'([A-Za-z0-9_./+=-]{48,})','LONG_LITERAL_REDACTED',line)
              print(f'{i:03d}: {line[:240]}')
          PY
