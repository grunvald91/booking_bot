name: ServGo Mail mobile navigation focused CI
on:
  push:
    branches: [fix/mail-mobile-navigation-20261102]
    paths: ['.github/workflows/mail-mobile-navigation-once.yml']
permissions:
  contents: read
concurrency:
  group: servgo-mail-mobile-ci
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      BOT_TOKEN: test-token
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -q -r requirements.txt -r web/api/requirements.txt pytest aiosqlite playwright
          python -m playwright install --with-deps chromium
      - name: Python and Mail PWA same-origin/auth regression
        run: |
          python -m py_compile web/api/routes/mail_pwa.py scripts/check_mail_mobile_workspace.py
          python -m pytest -q tests/test_mail_air_v2.py tests/test_mail_same_origin.py tests/test_mail_company_search.py tests/test_mail_campaign_safety_v4.py
      - name: Validate embedded scripts and duplicate HTML element IDs
        run: |
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          from html.parser import HTMLParser
          class Ids(HTMLParser):
              def __init__(self): super().__init__(); self.ids=set(); self.dup=[]
              def handle_starttag(self,tag,attrs):
                  item=dict(attrs).get("id")
                  if item:
                      if item in self.ids:self.dup.append(item)
                      self.ids.add(item)
          for n in ["mail_campaign_dashboard.html", "owner_mail_ui.html"]:
              body=(Path("web/api/routes")/n).read_text(encoding="utf-8")
              parser=Ids();parser.feed(body)
              assert not parser.dup, (n,parser.dup)
              inline=re.findall(r"<script>(.*?)</script>",body,re.S)
              assert len(inline)==1, n
              with tempfile.NamedTemporaryFile(mode="w",suffix=".js") as f:
                  f.write(inline[0]);f.flush()
                  subprocess.run(["node","--check",f.name],check=True)
          print("Mail HTML JS and IDs verified")
          PY
      - name: Check fixed mobile action/folder menus and nav at 320-768px in Chromium
        run: python scripts/check_mail_mobile_workspace.py
