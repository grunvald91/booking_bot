name: ServGo demo inventory

on:
  push:
    branches:
      - ops/demo-calendar-seed-20261005

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Inspect demo businesses
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, time
          import paramiko
          HOST='155.212.162.47'
          FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self,c,h,k):
                  actual=base64.b64encode(hashlib.sha256(k.asbytes()).digest()).decode().rstrip('=')
                  if actual!=FP: raise paramiko.SSHException('host key mismatch')
                  c.get_host_keys().add(h,k.get_name(),k)
          ssh=None
          for attempt in range(3):
              c=paramiko.SSHClient(); c.set_missing_host_key_policy(Pinned())
              try:
                  c.connect(HOST,port=22,username='root',password=os.environ['SERVER_PASSWORD'],
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  ssh=c; break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2: raise
                  time.sleep(3)
          cmd=r'''set -e
          cd /opt/booking_bot
          ./venv/bin/python - <<'INV_PY'
          import asyncio
          from datetime import date, timedelta
          from sqlalchemy import text
          from database.database import async_session_maker

          async def main():
              start=date.today()+timedelta(days=1)
              end=start+timedelta(days=30)
              async with async_session_maker() as s:
                  businesses=(await s.execute(text("""
                    select id,name,business_type,is_active,working_hours_start,working_hours_end,
                           booking_interval_minutes,prepayment_enabled
                    from businesses
                    where is_active=true
                    order by id
                  """))).mappings().all()
                  print('ACTIVE_BUSINESSES='+str(len(businesses)))
                  for b in businesses:
                      print(
                        'BUSINESS|id={id}|name={name}|type={business_type}|hours={working_hours_start}-{working_hours_end}|'
                        'step={booking_interval_minutes}|prepay={prepayment_enabled}'.format(**b)
                      )
                      services=(await s.execute(text("""
                        select id,name,duration_minutes,price,is_additional,is_active
                        from services where business_id=:bid and is_active=true
                        order by is_additional,id
                      """),{'bid':b['id']})).mappings().all()
                      for svc in services:
                          print(
                            ' SERVICE|id={id}|name={name}|dur={duration_minutes}|price={price}|add={is_additional}'.format(**svc)
                          )
                      employees=(await s.execute(text("""
                        select id,name,role,booking_interval_minutes,solo_price_per_hour,is_active
                        from employees
                        where business_id=:bid and is_active=true
                        order by id
                      """),{'bid':b['id']})).mappings().all()
                      for emp in employees:
                          links=(await s.execute(text("""
                            select service_id from employee_services where employee_id=:eid order by service_id
                          """),{'eid':emp['id']})).scalars().all()
                          dayoffs=(await s.execute(text("""
                            select date from employee_days_off
                            where employee_id=:eid and date between :start and :end
                            order by date
                          """),{'eid':emp['id'],'start':start,'end':end})).scalars().all()
                          print(
                            ' RESOURCE|id={id}|name={name}|role={role}|step={booking_interval_minutes}|'
                            'solo={solo_price_per_hour}|links={links}|days_off={days}'.format(
                              **emp, links=','.join(map(str,links)) or '*',
                              days=','.join(d.isoformat() for d in dayoffs) or '-'
                            )
                          )
                      stats=(await s.execute(text("""
                        select status,count(*) n
                        from bookings
                        where business_id=:bid and booking_date between :start and :end
                        group by status order by status
                      """),{'bid':b['id'],'start':start,'end':end})).all()
                      print(' EXISTING_FUTURE|'+(','.join(f'{st}:{n}' for st,n in stats) if stats else 'none'))
          asyncio.run(main())
          INV_PY
          '''
          _,out,err=ssh.exec_command(cmd,timeout=60)
          stdout=out.read().decode('utf-8','replace')
          stderr=err.read().decode('utf-8','replace')
          print(stdout)
          status=out.channel.recv_exit_status()
          if status:
              print(stderr[-2000:])
              raise SystemExit(status)
          ssh.close()
          PY
