meta:
  title: "Онлайн запись и предоплата для психологов — ServGo"
  description: "Онлайн запись и предоплата к психологу через Telegram-бот или сайт. Без переписки и без комиссии сторонним сайтам — все деньги клиента ваши. От 0 ₽/мес."
  og_image: "/static/niche/psy/og.png"
  short_label: "Психологи и коучи"

hero:
  eyebrow: "Запись и оплата для психологов, коучей, логопедов"
  h1: "Запись с предоплатой за две минуты — без переписки и без комиссии сторонним сайтам"
  copy: >
    Клиент сам выбирает слот и оплачивает — в Telegram-боте или на сайте
    servgo.ru. Подтверждённая запись сразу появляется в вашем расписании.
    Больше не нужно держать в голове, кто, когда и сколько должен, и срываться
    на каждое сообщение. Вы зарабатываете больше — потому что ни один слот не
    теряется, — и при этом остаётесь в балансе: больше времени на близких, на
    теннис, танцы и прогулку без телефона в руке.
  stage_services:
    - { time: "10:00", label: "Свободно" }
    - { time: "11:30", label: "Индивидуальная 60 мин" }
    - { time: "14:00", label: "Парная терапия" }
    - { time: "17:00", label: "Абонемент — 2 / 4" }
  slots: ["10:00", "11:30", "14:00", "17:00"]

signal_strip:
  - { title: "0% комиссии", sub: "не маркетплейс, вся выручка ваша", color: "mint" }
  - { title: "Предоплата при записи", sub: "час оплачен заранее, пропусков меньше", color: "peach" }
  - { title: "Часовые пояса", sub: "клиент видит своё время, вы — своё", color: "sky" }
  - { title: "Абонементы", sub: "учёт сессий в пакете автоматический", color: "lemon" }

pains:
  intro: "Знакомо?"
  entries:
    - "Клиент не пришёл — час потерян, денег нет. С предоплатой через ServGo час оплачен заранее: даже если клиент сорвался, деньги уже у вас, а слот закрывается автоматически"
    - "Переписка ради одной сессии: «а в четверг? а в пятницу?» — время между клиентами уходит на администрирование"
    - "Ручная просьба оплатить, реквизиты, чек, напоминание «вы там оплатили?» — ощущение попрошайки"
    - "Уходить на маркетплейс для психологов = отдавать 30–50% с сессии и терять право работать с клиентом напрямую. У вас в ServGo вся выручка остаётся вам"
    - "Клиент в другом часовом поясе пишет «в 18:00» — кто-то из вас путается, сессия пропала"

owners:
  h2: "Меньше администрирования — больше работы с клиентами"
  copy: "ServGo закрывает то, что у частного специалиста съедает часы каждую неделю: согласование слотов, напоминания о предоплате и ручной учёт абонементов."
  cards:
    - { icon: "01", title: "Запись и оплата вместе", text: "Клиент выбирает слот и оплачивает в один заход. Не оплатил — слот не бронируется.", color: "mint" }
    - { icon: "02", title: "Защита от двойной записи", text: "Два клиента в одном слоте физически невозможны, даже если расписание сложное и в нескольких форматах.", color: "coral" }
    - { icon: "03", title: "Абонементы и пакеты", text: "Купил 4 сессии — баланс виден и вам, и клиенту. Не нужно вести счётчик в заметках.", color: "sky" }
    - { icon: "04", title: "Напоминания за 24 и 2 часа", text: "До 25% пропусков случаются из-за «просто забыл». Автонапоминание клиенту это убирает.", color: "violet" }

clients:
  h2: "Запись клиента — в Telegram или на сайте"
  copy: "Клиент идёт к вашему боту в Telegram или открывает страницу servgo.ru, видит свободные слоты, выбирает удобный и сразу оплачивает. Ссылку на бот или на сайт ставите в Instagram Bio, подпись или шапку канала. В кабинете специалиста есть QR-код — клиент сканирует и сразу попадает в запись."
  steps:
    - { num: "1", title: "Открыл бота или сайт", sub: "ссылка из Bio, подписи или с сайта" }
    - { num: "2", title: "Выбрал тип сессии", sub: "первичная, повторная, парная" }
    - { num: "3", title: "Выбрал и оплатил слот", sub: "часовой пояс — свой" }
    - { num: "4", title: "Получил напоминание", sub: "за день и за два часа" }

compare:
  eyebrow: "Почему ServGo вместо маркетплейсов и Google-календаря"
  h2: "Не маркетплейс, не таблица — рабочее место частного специалиста"
  copy: "Маркетплейсы дают трафик, но забирают 30–50% и право работать с клиентом напрямую. Google-календарь бесплатный, но не принимает оплату и не напоминает клиенту."
  competitor_label: "Маркетплейсы и Google Calendar"
  rows:
    - { criteria: "Комиссия", them: "Крупные маркетплейсы для психологов — 30–50% с каждой сессии, навсегда.", us: "0%. Все деньги клиента приходят вам напрямую." }
    - { criteria: "Кому принадлежит клиент", them: "Маркетплейс запрещает работать вне платформы.", us: "Клиент пишет вашему боту — отношения только между вами." }
    - { criteria: "Оплата", them: "Google-календарь не принимает деньги. Карта на карту — риски блокировки счёта.", us: "Платёжный поток встроен в запись. Чек уходит клиенту автоматически." }
    - { criteria: "Напоминания клиенту", them: "Google-календарь шлёт письмо, которое часто не читают.", us: "Telegram-уведомление за 24 и за 2 часа — клиент видит его сразу." }

faq:
  h2: "Что обычно спрашивают частные специалисты"
  entries:
    - q: "Мне хватает Google Календаря"
      a: "Google Calendar не принимает предоплату, не отправляет напоминание клиенту в Telegram и не защищает от двойной записи. ServGo закрывает это в одном флоу."
    - q: "Предоплата отпугнёт клиентов"
      a: "Крупные платформы для психологов давно работают только с предоплатой — клиенты к этому привыкли. По данным агрегаторов рынка, неявок становится меньше на 40–60%."
    - q: "У меня 4–5 постоянных клиентов, мне ничего не нужно"
      a: "При 4–5 клиентах расписание простое. Но один уходит — нужен новый, и первый контакт хаотичен. ServGo — 0–2 000 ₽/мес, окупается одной предотвращённой неявкой."
    - q: "У меня нет сайта, некуда встраивать"
      a: "Свой делать не нужно — у каждого бизнеса в ServGo уже есть страница на servgo.ru, и параллельно работает Telegram-бот. Ссылку на любой из этих каналов ставите в Instagram Bio, шапку канала и подпись в мессенджере — клиент сам выбирает, где ему удобнее."
    - q: "Не хочу идти на маркетплейс для психологов"
      a: "ServGo — не маркетплейс. Никакой комиссии с сессии, никаких алгоритмов, скрывающих анкету. Клиенты остаются вашими."
