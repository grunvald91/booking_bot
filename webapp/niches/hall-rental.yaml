meta:
  title: "ServGo для аренды залов и фотостудий — один календарь, депозит и предоплата онлайн"
  description: "Клиенты бронируют зал, фотостудию или переговорку 24/7 — в Telegram-боте или на сайте servgo.ru. Предоплата и депозит удерживаются автоматически, двойные брони невозможны. От 0 до 2 000 ₽ в месяц."
  og_image: "/static/niche/hall-rental/og.png"

hero:
  eyebrow: "Онлайн-бронирование для лофтов, фотостудий, переговорок и залов"
  h1: "Один календарь по всем залам. Двойных броней больше нет"
  copy: >
    Один пятничный вечер в лофте — это 12–25 тысяч. Двойная бронь = клиент
    приехал с детьми и реквизитом, а зал занят. Он уезжает, оставляет
    две звезды и больше никогда не возвращается. ServGo держит один календарь
    по всем залам, принимает бронь 24/7 в Telegram-боте и на сайте servgo.ru,
    удерживает предоплату и депозит автоматически. Администратор больше не
    сверяет три мессенджера в полночь — расписание само следит за собой.
  stage_services:
    - { time: "10:00", label: "Свободно" }
    - { time: "12:00", label: "Переговорка, 2 ч" }
    - { time: "14:00", label: "Фотостудия, 1 ч + предметка" }
    - { time: "19:00", label: "Лофт, 6 ч, девичник" }
  slots: ["12:00", "14:00", "16:00", "19:00"]

signal_strip:
  - { title: "Один календарь", sub: "все залы и каналы — одна сетка", color: "mint" }
  - { title: "Депозит онлайн", sub: "удерживается до брони, возвращается после", color: "peach" }
  - { title: "Бронь 24/7", sub: "клиент бронит ночью — вы видите утром", color: "sky" }
  - { title: "Буфер на уборку", sub: "15–30 минут между клиентами автоматически", color: "lemon" }

pains:
  intro: "Знакомо?"
  entries:
    - "Двойная бронь между Direct, WhatsApp, агрегаторами и сайтом. Клиент приехал с детьми и реквизитом, а зал занят — скандал, возврат денег, две звезды. ServGo держит один календарь по всем каналам, без перепроверки"
    - "Передача ключей и кодов в любой час — администратор привязан к двери в 7:00 утра и в 23:00 вечера. Без онлайн-системы это ручной труд каждый день, без выходных"
    - "Депозит 3 000–10 000 ₽ наличными → спор «что считать порчей» после съёмки. ServGo удерживает депозит онлайн в момент брони и автоматически возвращает после приёмки — конфликта у двери нет"
    - "Переработка и штрафы (5 000 ₽ за бенгальские огни, +30 минут «по факту», 0,5% в день за просрочку) — каждое нарушение приходится считать и выставлять руками задним числом. ServGo выставляет автоматически по правилам"
    - "Пятница–суббота 19:00–24:00 — самый дорогой слот с самым высоким риском срыва. Без предоплаты лофт за 6 часов стоит пустой. С обязательной предоплатой риск переходит на клиента, а не на вас"

owners:
  h2: "Один календарь, депозит онлайн и буферы между клиентами"
  copy: "ServGo закрывает то, что у арендного пространства всегда болит сильнее всего: двойные брони, депозит и штрафы наличными, передача ключей и сорвавшиеся пятничные вечера."
  cards:
    - { icon: "01", title: "Все залы и каналы — одна сетка", text: "Фотостудия с 5 залами, лофт с тремя пространствами, коворкинг с переговорками — один календарь. Direct, WhatsApp и агрегаторы льют в него — двойная бронь физически невозможна.", color: "mint" }
    - { icon: "02", title: "Буфер между клиентами", text: "55 минут съёмки + 15 минут уборки — система блокирует промежуток автоматически. Никаких «следующий уже в дверях».", color: "coral" }
    - { icon: "03", title: "Депозит и предоплата онлайн", text: "Сумма удерживается на карте клиента в момент брони. После приёмки зала возвращается одним кликом — конфликта у двери и удержания из кармана нет.", color: "sky" }
    - { icon: "04", title: "Штрафы по правилам, не вручную", text: "Переработка, бенгальские огни, скотч на стенах — выставляется автоматически по настроенным правилам. Администратор не сидит после клиента и не считает.", color: "violet" }

clients:
  h2: "Бронь зала — четыре шага в Telegram или на сайте"
  copy: "Клиент открывает бот или страницу servgo.ru, выбирает зал, длительность и время. Депозит и предоплата удерживаются на карте в момент брони. После приёмки — депозит возвращается автоматически."
  steps:
    - { num: "1", title: "Выбрал зал", sub: "переговорка, фотостудия, лофт" }
    - { num: "2", title: "Выбрал длительность", sub: "1, 2, 4, 6 часов или пакет" }
    - { num: "3", title: "Оплатил аренду и депозит", sub: "одна транзакция, два удержания" }
    - { num: "4", title: "Получил код от замка", sub: "автоматически, на конкретный слот" }

compare:
  eyebrow: "Почему удобнее тяжёлых CRM и агрегаторов для аренды залов"
  h2: "ServGo делает то, что нужно почасовой аренде: матрицу залы × время, депозит онлайн и буферы между клиентами"
  copy: "Универсальные CRM заточены под «услугу-у-мастера», а не «ресурс × время». Агрегаторы дают трафик, но забирают комиссию и не дают контроля над прямыми клиентами."
  competitor_label: "Тяжёлые CRM и агрегаторы"
  rows:
    - { criteria: "Цена", them: "13–55 тыс. ₽/год за нужный набор модулей у крупных платформ.", us: "0–2 000 ₽/мес фиксированно. Без интегратора." }
    - { criteria: "Матрица «зал × время»", them: "Заточены под услугу-у-мастера. Почасовая аренда — кастомизация через костыли.", us: "Изначально про залы и слоты. Несколько ресурсов одновременно — из коробки." }
    - { criteria: "Депозит онлайн", them: "Либо отдельный модуль, либо вручную через перевод.", us: "Удержание и возврат на карте клиента — встроены в шаг записи." }
    - { criteria: "База клиентов", them: "Агрегатор владеет клиентом. Прямые брони — в обход, двойные брони — гарантированы.", us: "Клиент пишет вашему боту — отношения только между вами." }

faq:
  h2: "Что обычно спрашивают владельцы залов"
  entries:
    - q: "У меня сложные правила: депозит, штрафы, разные тарифы будни/выходные"
      a: "Все правила настраиваются один раз. Депозит 5 000 ₽, штраф за бенгальские огни 5 000 ₽, тариф пт–сб ×1.5, скидка за пакет от 6 часов — настройте однажды, дальше система применяет автоматически."
    - q: "Я работаю на агрегаторах — мне хватает"
      a: "Агрегатор владеет клиентом и берёт 6–10% с каждой брони. Прямые брони из Instagram, рекомендаций и сайта идут в обход — без синхронизации это гарантированная двойная бронь. ServGo принимает прямые брони и не берёт комиссию."
    - q: "Клиенты у меня пишут в Direct и WhatsApp — на бот они не пойдут"
      a: "WhatsApp в РФ с 2025 года нестабилен — уведомления зависают, клиенты не получают напоминания. Бот в Telegram работает напрямую через серверы Telegram, без задержек. Direct остаётся, ServGo добавляется параллельно."
    - q: "Боюсь, что клиент онлайн вытряхнет все слоты и не приедет"
      a: "Предоплата 50–100% удерживается на карте в момент брони. Если клиент не приехал — деньги остаются у вас. Это правило, известное любому клиенту на рынке аренды."
    - q: "У нас умные замки — нужно генерить код на каждую бронь"
      a: "Поддерживаем интеграцию с TTLock и аналогами: код генерится автоматически на конкретный слот, отправляется клиенту вместе с подтверждением, сбрасывается после окончания брони."
    - q: "Дорого, не потяну"
      a: "Старт бесплатно, дальше до 2 000 ₽/мес. Один предотвращённый срыв пятничного лофта (12–25 тыс. ₽) окупает год подписки."
