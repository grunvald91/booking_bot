faq:
  h2: "Что обычно спрашивают владельцы барбершопов"
  entries:
    - q: "Я знаю всех клиентов по именам — CRM не нужна"
      a: "На точке до 3 кресел это правда. Но как только нанимаете второго барбера и он уходит — он уносит «свою половину» базы. Контакты в Telegram-боте бренда остаются у владельца, а не у мастера."
    - q: "Клиенты звонят и договариваются на лету — сместить, перенести"
      a: "Звонки остаются. ServGo добавляется параллельно — для молодой аудитории, которая в принципе не звонит, и для тех, кто хочет записаться в 23:00."
    - q: "Новый барбер не разберётся в системе"
      a: "Барберу разбираться не нужно. Расписание открывается в Telegram-боте или в браузере. Новый мастер видит свой день с первой минуты, без обучения."
    - q: "Уже пробовал тяжёлую CRM — слишком сложно, отказался"
      a: "ServGo — не CRM с двадцатью модулями. Это Telegram-бот и веб-приложение с одним расписанием: владелец работает там, где удобнее, клиент записывается тоже там, где удобнее."
    - q: "При марже 10–12% не потяну подписку"
      a: "0–2 000 ₽/мес — это полпроцента от выручки точки 200–300 тыс. ₽/мес. Один возвращённый клиент через 3–4 недели вместо 6 окупает подписку на месяц."
    - q: "Боюсь, что приложение покажет клиенту конкурентов рядом"
      a: "ServGo — не агрегатор. Бот привязан к вашему бренду, у соседнего барбершопа клиент его не увидит."
