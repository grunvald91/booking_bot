  eyebrow: "Онлайн-запись для барбершопов и мужских студий"
  h1: "Уход одного барбера — минус 20% выручки. Сделайте так, чтобы база осталась у вас"
  copy: >
    Если запись клиентов живёт в WhatsApp у барбера, при уходе он унесёт её
    с собой — это минус 20% выручки точки на одного ушедшего мастера. ServGo
    держит запись в Telegram-боте бренда и на сайте servgo.ru: клиент
    записывается на барбершоп, а не на личный номер мастера. Автонапоминания
    приводят клиента обратно через 3–4 недели, а не через 6. Одна подписка
    0–2 000 ₽/мес вместо тяжёлой CRM за 3–6 тысяч и интегратора за 15–40 тысяч сверху.
  stage_services:
    - { time: "10:00", label: "Свободно" }
    - { time: "11:30", label: "Стрижка ножницами, 60 мин" }
    - { time: "14:00", label: "Стрижка + борода, 75 мин" }
    - { time: "17:00", label: "Королевское бритьё, 45 мин" }
  slots: ["11:30", "13:00", "14:30", "17:00"]

