pains:
  intro: "Знакомо?"
  entries:
    - "Уход одного барбера — минус 20% выручки точки. База клиентов в голове и в WhatsApp у мастера, не у бренда. ServGo держит контакты у владельца: уйдёт мастер — клиенты остаются у вас"
    - "Молодая аудитория не звонит — пишет в Telegram. Если запись только по телефону администратора в рабочее время, клиент уходит к соседям, у которых есть бот"
    - "Клиент стрижётся «когда вспомнит» — раз в 5–6 недель вместо 3–4. Без автонапоминания о следующей стрижке годовая выручка с клиента просаживается на 20–30%"
    - "Клиент с улицы сел в кресло, через 10 минут приехал записанный — конфликт у зеркала. Без единого расписания этого не избежать"
    - "Маржа барбершопов в 2026 — 10–12%. Тяжёлая CRM за 3–6 тыс. ₽/мес + интегратор за 15–40 тыс. ₽ съедают полпроцента маржи. ServGo — Telegram-бот за 0–2 000 ₽/мес без интегратора"

owners:
  h2: "База клиентов у бренда, а не у мастера"
  copy: "ServGo закрывает то, что в барбершопе всегда болит сильнее всего: увод клиентов уходящим барбером, упущенный возврат через 3–4 недели и перегруз администратора телефонными звонками."
  cards:
