meta:
  title: "Онлайн запись для барбершопов — ServGo"
  description: "Онлайн запись в барбершоп 24/7 через Telegram-бот и сайт. База клиентов остаётся у бренда, автонапоминания о следующей стрижке. От 0 ₽/мес без интегратора."
  og_image: "/static/niche/barbershop/og.png"
  short_label: "Барбершопы"

