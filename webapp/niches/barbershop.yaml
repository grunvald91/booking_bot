  copy: "Клиент открывает бот или страницу servgo.ru, выбирает услугу (стрижка, борода, комбо), мастера и время. Бот напоминает за день и за два часа. Через 3 недели — напоминание о следующей стрижке. В кабинете владельца есть QR-код точки — клиент сканирует и записывается."
