    - { icon: "02", title: "Автонапоминание о следующей стрижке", text: "Через 3 недели клиент получает напоминание: «пора подстричься». Частота визитов держится на 12–17 в год вместо 8–10. Это +20–30% выручки на клиента.", color: "coral" }
    - { icon: "03", title: "Длительности комбо считает сама", text: "Стрижка 45 мин, борода 30 мин, комбо 75 мин, бритьё +30 мин. Администратор не путается, следующий клиент не ждёт 30 минут в кресле под зеркалом.", color: "sky" }
    - { icon: "04", title: "Клиенты без записи в общей сетке", text: "Клиент с улицы попадает в то же расписание, что и записанные. Никаких пересечений и конфликтов у зеркала.", color: "violet" }

