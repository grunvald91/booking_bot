compare:
  eyebrow: "Почему удобнее RemOnline и YCLIENTS для точки с 1–2 постами"
  h2: "ServGo делает только запись. Зато делает её просто, по фиксированной цене и без зависимости от курса валюты"
  copy: "Большим автосервисам нужны склад, зарплаты и интеграции с поставщиками. Маленькой точке — нет."
  competitor_label: "RemOnline / YCLIENTS"
  rows:
    - { criteria: "Цена", them: "RemOnline от 29 до 69 € за всё, что нужно. Курс плавающий.", us: "0–2 000 ₽/мес фиксированно. Никаких валютных сюрпризов." }
    - { criteria: "Что внутри", them: "Склад, зарплаты, аналитика, заказ-наряды — половина модулей маленькой точке не нужна.", us: "Запись, расписание, услуги, предоплата, напоминания — и всё." }
    - { criteria: "Внедрение", them: "Настройка под себя занимает недели и часто требует помощника со стороны.", us: "Передали данные — через день уже принимаете записи." }
    - { criteria: "Если уйдёте", them: "«Нельзя выгрузить данные, если подписка закончилась» — отзывы RemOnline.", us: "Все записи в привычной переписке Telegram, никакого закрытого формата." }

faq:
  h2: "Что обычно спрашивают владельцы шиномонтажа"
  entries:
    - q: "У нас и так живая очередь — справляемся"
      a: "В сезон живая очередь даёт конфликты и заставляет нанимать человека для регулировки потока. ServGo разводит клиентов по слотам — конфликтов нет, нанимать никого не нужно."
    - q: "Клиент звонит — этого хватает"
      a: "Мастер не возьмёт трубку, когда работает руками. В пик звонков десятки — клиент уходит к соседям, а вы про него не знаете."
    - q: "Парни не разберутся в новой программе"
      a: "Им ничего не нужно учить. Расписание открывается и в Telegram-боте, и в браузере на servgo.ru — что под рукой, то и открывают. Новый мастер видит слоты с первой минуты."
    - q: "Наши клиенты — в интернет не пойдут"
      a: "Telegram стоит у 80%+ пользователей смартфонов в Краснодарском крае. Запись через бот — это сообщение в мессенджер, не длинная форма. А если клиенту удобнее с компьютера или браузера — есть та же запись на сайте servgo.ru."
    - q: "Предоплата отпугнёт"
      a: "Предоплата опциональна. Можно включить только на пиковые даты — отсечёте фантомные брони, реальных клиентов это не пугает."
