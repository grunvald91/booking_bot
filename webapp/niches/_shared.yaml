connect_bot_url: "https://t.me/cityservice_mlm_bot"
demo_site_url: "https://servgo.ru/"

pricing:
  eyebrow: "Стоимость"
  h2: "От 0 до 2 000 ₽ в месяц"
  copy: >
    Стоимость для первых подключений — от нуля до двух тысяч рублей в месяц.
    Условия уникальные и доступны ограниченное время, но после подключения
    они закрепляются за бизнесом навсегда.
  card_label: "Стартовые условия"
  card_amount: "0–2 000 ₽"
  card_period: "в месяц"
  card_note: "Фиксируем условия на весь срок работы бизнеса в ServGo."

launch:
  eyebrow: "Запуск без лишней нагрузки"
  h2: "Владелец не настраивает сервис сам"
  copy: >
    Вы передаёте данные о бизнесе, услугах, сотрудниках, графике и оплате.
    Мы заводим карточку, проверяем тестовую запись и отдаём готовую ссылку клиентам.
  steps:
    - "Собираем анкету бизнеса"
    - "Заводим услуги, команду и график"
    - "Проверяем запись, чек и предоплату"
    - "Публикуем ссылку или QR-код"

capability_grid:
  - "Онлайн-запись 24/7"
  - "Услуги, цены и длительность"
  - "Мастера, администраторы и залы"
  - "Рабочие часы и перерывы"
  - "Выходные сотрудников"
  - "Предоплата и чек"
  - "Напоминания за 24 и 2 часа"
  - "Календарь и расписание"
  - "Абонементы"
  - "QR-код: один скан → бот или сайт → запись в пару кликов"
  - "Фото, видео, адрес и маршрут"
  - "Аналитика по записям"

final:
  eyebrow: "ServGo для демонстрации"
  h2: "Покажите владельцу не технологию, а спокойный рабочий день"
  copy: >
    Записи на месте, клиенты понимают шаги, команда получает уведомления,
    а владелец видит расписание без ручного журнала.
