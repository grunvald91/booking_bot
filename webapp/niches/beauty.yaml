faq:
  h2: "Что обычно спрашивают владельцы салонов"
  entries:
    - q: "У меня уже есть WhatsApp и Direct — справляемся"
      a: "Пока запись в личке — вы привязаны к телефону 24/7. Бот принимает запись автоматически даже ночью. WhatsApp остаётся, ServGo добавляется параллельно."
    - q: "Мои клиентки не будут пользоваться ботом — они привыкли звонить"
      a: "Телефон никуда не девается. Часть клиенток переходит на бота сама, особенно те, кому неудобно говорить из офиса или в транспорте."
    - q: "Боюсь, что клиенты уйдут к конкурентам через эту систему"
      a: "ServGo работает внутри вашего Telegram-бота. Нет общего каталога, как у YCLIENTS — база видна только вам."
    - q: "Дорого, не потяну"
      a: "Старт бесплатно, дальше до 2 000 ₽/мес. Одна предотвращённая неявка по маникюру (1 500–3 000 ₽) уже окупает месяц."
    - q: "Уже пробовал YCLIENTS — не понравилось"
      a: "ServGo — не тяжёлая CRM, а Telegram-бот с расписанием. Нет долгой настройки, нет менеджера по продажам, нет неожиданных списаний."
