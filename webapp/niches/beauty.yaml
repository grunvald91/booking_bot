    - { time: "10:30", label: "Маникюр гель-лак" }
    - { time: "12:00", label: "Стрижка + укладка" }
    - { time: "14:00", label: "Брови архитектура" }
  slots: ["10:00", "11:30", "13:00", "15:30"]

