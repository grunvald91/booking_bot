  eyebrow: "Онлайн-запись для салонов и мастеров красоты"
  h1: "ServGo превращает Direct, WhatsApp и звонки в одно понятное расписание"
  copy: >
    Клиент сам выбирает услугу, мастера, дату и время — в Telegram-боте или
    прямо с вашего сайта servgo.ru. Запись попадает в общее расписание салона,
    а мастер видит свой день без блокнота и заметок.
  stage_services:
