meta:
  title: "ServGo для салонов красоты — онлайн-запись в Telegram и на сайте без хаоса в директе"
  description: "Запись маникюра, стрижек и процедур через Telegram-бот или прямо с сайта. Предоплата, напоминания за 24 и 2 часа, защита от двойной записи. От 0 до 2 000 ₽ в месяц."
  og_image: "/static/niche/beauty/og.png"

