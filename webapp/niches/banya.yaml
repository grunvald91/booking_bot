meta:
  title: "Онлайн запись и бронирование для бань и саун — ServGo"
  description: "Онлайн бронирование сауны и бани 24/7 через Telegram-бот и сайт. Предоплата убирает пропуски, апсейл на чан/веник/банщика — средний чек +30%. От 0 ₽/мес."
  og_image: "/static/niche/banya/og.png"
  short_label: "Бани и сауны"

hero:
  eyebrow: "Онлайн-бронирование для бань, саун и термальных комплексов"
  h1: "Пятничный вечер на компанию — это 15–25 тысяч. Не теряйте его на непринятый звонок"
  copy: >
    Каждый пропущенный звонок в пятницу вечером — это не клиент, а упущенный
    сеанс на 15 тысяч и выше. ServGo принимает бронь 24/7 в Telegram-боте и
    на сайте servgo.ru: клиент сам выбирает зал, время и компанию, оплачивает
    заранее, в шаге записи добавляет банщика и веники. Сменщик видит одно
    расписание — никаких двойных броней. Больше выручки даже в ночные часы,
    меньше телефона в 23:00.
  stage_services:
    - { time: "16:00", label: "Свободно" }
    - { time: "18:00", label: "Русская баня, 4 ч, до 8 чел." }
    - { time: "20:00", label: "Сауна, 2 ч + чан" }
    - { time: "22:00", label: "Ночной сеанс + банщик" }
  slots: ["18:00", "19:00", "20:00", "22:00"]

signal_strip:
  - { title: "Бронь 24/7", sub: "ночные часы перестают быть пустыми", color: "mint" }
  - { title: "Предоплата", sub: "сеанс оплачен заранее, пропусков меньше", color: "peach" }
  - { title: "Апсейл в брони", sub: "банщик, веник, чай — клиент видит сразу", color: "sky" }
  - { title: "Одно расписание", sub: "сменщик видит то же, что и вы", color: "lemon" }

pains:
  intro: "Похоже на ваш сезон?"
  entries:
    - "До 25% сеансов срываются без предоплаты. Пятничный вечер на компанию в Сочи — это от 15 тысяч, и он сгорает. С предоплатой через ServGo сеанс оплачен заранее: деньги уже у вас, даже если клиент не доехал"
    - "Двойные брони между залами и сменами съедают 10% загрузки. Тетрадь не знает, что «Дубовая» и «Берёзовая» — это два разных ресурса. ServGo держит одно расписание на все залы и парные"
    - "30–40% клиентов уходят, потому что никто не взял трубку в пятницу вечером. Бот и сайт принимают бронь круглосуточно — у соседей этого нет"
    - "Сложная сетка тарифов: будни до 16:00, выходные, +500 ₽ с 7-го гостя, доплаты за чан и веник. Администратор путается, доплаты проходят мимо кассы. ServGo считает сам"
    - "Доп. услуги (банщик ~6 000 ₽, веники, чай, фуршет) уходят впустую — клиент о них не знает до момента, когда уже сидит в парной. Один экран с апсейлом поднимает средний чек на 15–30%"

owners:
  h2: "Сезон без потерянных сеансов и без телефона в 23:00"
  copy: "ServGo закрывает то, что у банного комплекса всегда болит сильнее всего: ночные брони, путаница между залами, апсейл доп. услуг и сложная тарифная сетка."
  cards:
    - { icon: "01", title: "Бот и сайт работают 24/7", text: "Клиент бронит ночью — вы не отвечаете на сообщения в 23:00. Утром просто видите оплаченный сеанс в расписании.", color: "mint" }
    - { icon: "02", title: "Все залы — одна сетка", text: "«Дубовая», «Берёзовая», финская сауна, чан, парная — система знает, что занято в данный момент. Двойная бронь невозможна.", color: "coral" }
    - { icon: "03", title: "Апсейл в шаге записи", text: "Клиент выбирает зал — система предлагает банщика, веники, чай, фуршет. Средний чек растёт на 15–30% без усилий администратора.", color: "sky" }
    - { icon: "04", title: "Тарифная сетка считает сама", text: "Будни/выходные, до/после 16:00, доплата с N-го гостя, премиальные часы — настраиваете один раз, дальше система считает.", color: "violet" }

clients:
  h2: "Бронь сеанса — четыре шага в Telegram или на сайте"
  copy: "Клиент открывает бот или страницу servgo.ru, выбирает зал, длительность и компанию, добавляет банщика и веник, оплачивает заранее. В кабинете владельца есть QR-код — клиент сканирует у входа и попадает в бронь."
  steps:
    - { num: "1", title: "Выбрал зал", sub: "русская баня, сауна, чан" }
    - { num: "2", title: "Выбрал время и компанию", sub: "2–4 часа, до N человек" }
    - { num: "3", title: "Добавил доп. услуги", sub: "банщик, веники, чай, фуршет" }
    - { num: "4", title: "Оплатил и получил подтверждение", sub: "адрес, время, как проехать" }

compare:
  eyebrow: "Почему удобнее тяжёлых CRM и нишевых платформ для бани"
  h2: "ServGo не пытается быть всем сразу. Делает бронь, предоплату и апсейл — по фиксированной цене"
  copy: "Универсальные CRM заточены под салоны красоты — не знают про почасовую аренду залов и буферы на уборку. Нишевые платформы для бань делают своё дело, но просят за каждый канал отдельно."
  competitor_label: "Тяжёлые CRM"
  rows:
    - { criteria: "Цена", them: "От 800 до 5 000 ₽/мес за нужный набор модулей. Часто плюс интегратор.", us: "0–2 000 ₽/мес фиксированно. Без интегратора." }
    - { criteria: "Бронь почасовая", them: "Заточены под услугу-у-мастера; почасовая аренда залов настраивается долго.", us: "Изначально про слоты и залы. Буферы на уборку и протопку — из коробки." }
    - { criteria: "Апсейл", them: "Доп. услуги либо отдельный модуль, либо вручную в комментариях.", us: "Банщик, веник, чай, фуршет — на одном экране записи." }
    - { criteria: "Каналы", them: "Виджет на сайт отдельно, бот отдельно, мобильное приложение — за деньги.", us: "Telegram-бот и страница на servgo.ru работают параллельно, без доплат." }

faq:
  h2: "Что обычно спрашивают владельцы бань"
  entries:
    - q: "Клиенты не будут оставлять предоплату — обидятся"
      a: "Реальный кейс банного комплекса в Казани: при внедрении обязательной предоплаты −25% сорвавшихся сеансов и +20% выручки за счёт ночных броней. Часть «обиженных» с лихвой компенсируется новым потоком, который раньше не доходил из-за «не дозвонился»."
    - q: "У меня сложная тарифная сетка: будни/выходные/время суток/количество гостей"
      a: "Сетка настраивается один раз: правило «+500 ₽ с 7-го гостя», скидка «до 16:00 в будни», премиальный тариф «пт–вс после 18:00». Дальше система считает сама, администратор не путается."
    - q: "У нас всё в тетради, нас устраивает"
      a: "Пока расписание в тетради — вы привязаны к телефону и администратору. Каждый ночной звонок, на который не ответили, — это упущенный сеанс. Тетрадь остаётся, ServGo добавляется параллельно."
    - q: "Подписка 1–2 тыс. ₽/мес — не окупится"
      a: "При выручке 200–300 тыс. ₽/мес инвестиции окупаются за две недели — кейс Казани. Достаточно одного предотвращённого срыва пятничного сеанса, чтобы закрыть подписку на месяц вперёд."
    - q: "У меня нет сайта, некуда встраивать"
      a: "Свой делать не нужно — у каждого бизнеса в ServGo уже есть страница на servgo.ru, и параллельно работает Telegram-бот. Ссылку на любой из каналов ставите в Instagram Bio, шапку канала и подпись в мессенджере."
