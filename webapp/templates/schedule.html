<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание · ServGo</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/static/favicon.svg?v=2">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/schedule.css?v=24">
</head>
<body data-theme="dark">
    <div id="app">
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Загрузка расписания…</p>
        </div>

        <!-- Main -->
        <div class="content" id="mainContent" style="display:none;">
            <!-- Header -->
            <header class="header">
                <button class="icon-btn" id="backBtn" onclick="goBack()" title="Назад">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="header-title">
                    <h1>Расписание</h1>
                    <div class="header-sub"><span class="dot"></span><span id="businessName">—</span></div>
                </div>
                <button class="icon-btn bordered" id="themeToggle" onclick="toggleTheme()" title="Сменить тему">
                    <svg id="themeIconDark" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                    <svg id="themeIconLight" width="17" height="17" viewBox="0 0 24 24" fill="none" style="display:none;"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                <select class="business-select" id="businessSelect"><option value="">Бизнес</option></select>
            </header>

            <!-- Search + chips -->
            <div class="toolbar">
                <div class="search-box">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <input type="text" id="searchInput" placeholder="Поиск по клиенту, услуге, телефону" autocomplete="off">
                    <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none;">&times;</button>
                </div>
                <div class="chips" id="empChips"></div>
            </div>

            <!-- Mode toggle -->
            <!-- Compact control row: режим + листалка дат + сворачивание -->
            <div class="control-row">
                <div class="seg" id="modeToggle">
                    <button class="seg-btn active" id="segDay" onclick="setViewMode('day')">День</button>
                    <button class="seg-btn" id="segWeek" onclick="setViewMode('week')">Неделя</button>
                </div>
                <div class="date-stepper">
                    <button class="nav-btn ghost" id="navPrev" onclick="navigate(-1)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12l6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="date-label" id="todayBtn" onclick="goToToday()">
                        <span class="main" id="navMain">Сегодня</span><span class="sub" id="navSub"></span>
                    </button>
                    <button class="nav-btn ghost" id="navNext" onclick="navigate(1)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <button class="details-toggle" id="detailsToggle" onclick="toggleDetails()" title="Сводка и легенда">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <!-- Collapsible: сводка + легенда -->
            <div class="details-panel" id="detailsPanel" hidden>
                <div class="summary" id="summary"></div>
                <div class="legend" id="legend"></div>
            </div>

            <!-- Column header -->
            <div class="col-header" id="colHeader"></div>

            <!-- Timeline -->
            <div class="timeline" id="timeline"></div>

            <!-- Global bottom nav (app shell) -->
            <nav class="bottom-nav">
                <a class="bn-item" href="/dashboard"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="14" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="3" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/><rect x="14" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.9"/></svg><span>Панель</span></a>
                <a class="bn-item active" href="/schedule"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Расписание</span></a>
                <a class="bn-item" href="/services"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="3" stroke="currentColor" stroke-width="1.9"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.9"/><path d="M8.5 7.7L20 17M20 7L8.5 16.3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Услуги</span></a>
                <a class="bn-item" href="/masters"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 19c.6-3 2.9-4.6 5.5-4.6s4.9 1.6 5.5 4.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M16 5.2a3 3 0 010 5.6M17.5 14.6c2 .6 3.4 2.1 3.9 4.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Мастера</span></a>
                <a class="bn-item" href="/settings"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.43.992a6.93 6.93 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.297 2.247a1.125 1.125 0 01-1.37.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.542-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.98 6.98 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg><span>Настройки</span></a>
            </nav>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" id="fabAdd" onclick="openNewBookingModal()" title="Новая запись" style="display:none;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>

    <!-- Bottom sheet (детали + быстрые действия) — наполняется из JS -->
    <div id="sheetRoot"></div>

    <!-- Move hint -->
    <div id="moveHintRoot"></div>

    <!-- New booking modal -->
    <div class="modal hidden" id="newBookingModal">
        <div class="modal-overlay" onclick="closeNewBookingModal()"></div>
        <div class="modal-card">
            <div class="modal-head">
                <div class="t">Новая запись</div>
                <button class="modal-close" onclick="closeNewBookingModal()">&times;</button>
            </div>
            <form id="newBookingForm" onsubmit="submitNewBooking(event)">
                <div class="form-group">
                    <label for="nbClientName">Имя клиента *</label>
                    <input type="text" id="nbClientName" required placeholder="Введите имя" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="nbClientPhone">Телефон</label>
                    <input type="tel" id="nbClientPhone" placeholder="+7 (999) 123-45-67" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="nbService">Услуга *</label>
                    <select id="nbService" required><option value="">Выберите услугу</option></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nbEmployee" id="nbEmployeeLabel">Мастер</label>
                        <select id="nbEmployee"><option value="">Любой свободный</option></select>
                    </div>
                    <div class="form-group">
                        <label for="nbTime">Время *</label>
                        <input type="time" id="nbTime" required>
                    </div>
                </div>
                <input type="hidden" id="nbDate">
                <div class="form-group" id="nbAdditionalServicesGroup" style="display:none;">
                    <label>Доп. услуги</label>
                    <div id="nbAdditionalServices" class="additional-services-list"></div>
                </div>
                <div id="nbPriceInfo" class="price-block" style="display:none;"></div>
                <div class="form-group">
                    <label for="nbComment">Комментарий</label>
                    <textarea id="nbComment" placeholder="Комментарий к записи…" rows="2"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeNewBookingModal()">Отмена</button>
                    <button type="submit" class="btn-submit" id="nbSubmitBtn">Создать запись</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/schedule.js?v=32"></script>
</body>
</html>
