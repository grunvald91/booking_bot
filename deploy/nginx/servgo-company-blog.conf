# Public company blog routes for the active servgo.ru:443 virtual host.
# These directives are installed by scripts/ops/servgo_company_blog_nginx_release.py
# with nginx -t, rollback, and live HTTP verification. Do not include this
# file from nginx directly unless the deployment mechanism is changed.
#
# Keep public company pages on the BookingBot server-rendered SEO handler;
# the SPA /index.html fallback must not answer these URLs with HTTP 200.
# /api/ maps to localhost:8000/ and strips the /api/ prefix.

# SERVGO_COMPANY_SEO_SSR_BEGIN
location ~ ^/business/([0-9]+)/blog/$ {
    return 301 /business/$1/blog$is_args$args;
}
location ~ ^/business/([0-9]+)/blog/(.+)/$ {
    return 301 /business/$1/blog/$2$is_args$args;
}
location ~ ^/business/([0-9]+)/blog(?:/|$) {
    limit_except GET HEAD { deny all; }
    rewrite ^/business/([0-9]+)/blog(.*)$ /api/seo-pages/business/$1/blog$2 last;
}
# SERVGO_COMPANY_SEO_SSR_END

# The global /business-blog-sitemap.xml remains a verified, updated static
# sitemap index (scripts/ops/servgo_sitemap.py, systemd hourly timer).
