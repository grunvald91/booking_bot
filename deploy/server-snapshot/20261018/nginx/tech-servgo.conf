server {
 listen 80;
 listen [::]:80;
 server_name tech.servgo.ru;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://tech.servgo.ru$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name tech.servgo.ru;
 root /var/www/tech-servgo/current;
 index index.html;
 charset utf-8;
 ssl_certificate /etc/letsencrypt/live/tech.servgo.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/tech.servgo.ru/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location / { try_files $uri $uri/ =404; }
 location ~ /\. { deny all; }
}
