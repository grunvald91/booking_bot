        proxy_read_timeout 60s;
    }

    location /api/legacy/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/media/ {
        proxy_pass http://127.0.0.1:8080/api/media/;
        proxy_set_header Host $host;
    }

    location /dating/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /elitles/ {
        alias /var/www/elitles-sochi/;
        index index.html;
        try_files $uri $uri/ /elitles/index.html;
    }

    location /elitles/img/ {
        alias /var/www/elitles-sochi/img/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        root /opt/booking_bot/web/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA control files: always revalidate service worker and manifest.
    location = /sw.js {
        root /opt/booking_bot/web/frontend/dist;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        root /opt/booking_bot/web/frontend/dist;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        root /opt/booking_bot/web/frontend/dist;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        sub_filter_once off;
        sub_filter '<script src="https://telegram.org/js/telegram-web-app.js" async></script>' '<script src="https://tg.servgo.ru/js/telegram-web-app.js" async></script><script src="/servgo-shared-auth.js?v=20260528_1035" defer></script>';
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/servgo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servgo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

