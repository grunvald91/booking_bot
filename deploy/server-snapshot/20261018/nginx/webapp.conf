server {
    server_name artur.grunvald1991.fvds.ru;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/legacy/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/media/ {
        proxy_pass http://127.0.0.1:8080/api/media/;
        proxy_set_header Host $host;
    }

    location /dating/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /elitles/ {
        alias /var/www/elitles-sochi/;
        index index.html;
        try_files $uri $uri/ /elitles/index.html;
    }

    location /elitles/img/ {
        alias /var/www/elitles-sochi/img/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /calendar {
        proxy_pass http://127.0.0.1:8080/calendar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8080/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        root /opt/booking_bot/web/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        root /opt/booking_bot/web/frontend/dist;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/artur.grunvald1991.fvds.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artur.grunvald1991.fvds.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name artur.grunvald1991.fvds.ru;
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name servgo.ru www.servgo.ru 155.212.162.47;
    # ServGo blog release 20261015: scoped routes only.
    location = /blog { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /blog/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /static/blog/ { proxy_pass http://127.0.0.1:8080; }
    location = /static/css/blog.css { proxy_pass http://127.0.0.1:8080; }
    location = /static/css/landing.css { proxy_pass http://127.0.0.1:8080; }
    location = /static/favicon.svg { proxy_pass http://127.0.0.1:8080; }
    location = /static/og.png { proxy_pass http://127.0.0.1:8080; }

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
